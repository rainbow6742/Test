<!DOCTYPE html>
<html>
<head>
    <title>The Password Game</title>
    <style>
        body { background: #f4f6fa; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        #box { width: 100%; max-width: 450px; background: white; border: 2px solid #e2e8f0; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        textarea { width: 100%; height: 60px; padding: 10px; box-sizing: border-box; font-size: 1.1rem; }
        #rules { margin-top: 15px; display: flex; flex-direction: column-reverse; gap: 8px; }
        .rule { padding: 10px; border-radius: 6px; font-size: 0.9rem; font-weight: bold; background: #fff5f5; border: 1px solid #feb2b2; color: #991b1b; }
        .rule.ok { background: #f0fdf4; border-color: #bbf7d0; color: #166534; text-decoration: line-through; }
        #win { display: none; background: #dcfce7; color: #14532d; padding: 15px; border-radius: 6px; text-align: center; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>
    <h2>The Password Game</h2>
    <div id="box">
        <div id="win">🎉 Secure Password Accepted!</div>
        <textarea id="input" placeholder="Enter password..."></textarea>
        <div id="rules"></div>
    </div>
<script>
    const input = document.getElementById('input'), rulesDiv = document.getElementById('rules'), win = document.getElementById('win');
    const targetLength = Math.floor(Math.random() * 10) + 20;

    const rules = [
        { id: 1, txt: "Minimum 5 characters.", chk: p => p.length >= 5 },
        { id: 2, txt: "Must include a number.", chk: p => /\d/.test(p) },
        { id: 3, txt: "Must include an uppercase letter.", chk: p => /[A-Z]/.test(p) },
        { id: 4, txt: "Must include a special character.", chk: p => /[^A-Za-z0-9]/.test(p) },
        { id: 5, txt: "Digits must add up to exactly 25.", chk: p => (p.match(/\d/g) || []).reduce((a, b) => a + parseInt(b), 0) === 25 },
        { id: 6, txt: "Must include a month (e.g., May).", chk: p => ['january','february','march','april','may','june','july','august','september','october','november','december'].some(m => p.toLowerCase().includes(m)) },
        { id: 7, txt: "Must include a sponsor: Pepsi, Starbucks, or Shell.", chk: p => ['pepsi','starbucks','shell'].some(s => p.toLowerCase().includes(s)) },
        { id: 8, txt: "Must include a Roman numeral (I, V, X, L, C, D, M).", chk: p => /[IVXLCDM]/.test(p) },
        { id: 9, txt: "Must include a valid leap year.", chk: p => (p.match(/\d+/g) || []).some(n => { const y = parseInt(n); return (y%4===0 && y%100!==0) || y%400===0; }) },
        { id: 10, txt: `Must be EXACTLY ${targetLength} characters long.`, chk: p => p.length === targetLength }
    ];

    function verify() {
        const val = input.value; rulesDiv.innerHTML = ''; let okCount = 0;
        for (let i = 0; i < rules.length; i++) {
            const passed = rules[i].chk(val);
            const card = document.createElement('div');
            card.className = `rule ${passed ? 'ok' : ''}`;
            card.innerText = `Rule ${rules[i].id}: ${rules[i].txt} ${passed ? '✅' : '❌'}`;
            rulesDiv.appendChild(card);
            if (!passed) break;
            okCount++;
        }
        win.style.display = (okCount === rules.length) ? 'block' : 'none';
    }
    input.addEventListener('input', verify); verify();
</script>
</body>
</html>
