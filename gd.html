<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geometry Dash Web HTML5</title>
  <style>
    @import url('https://googleapis.com');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      color: #fff;
      font-family: 'Russo One', sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 800px;
      height: 400px;
      box-shadow: 0 0 30px rgba(0, 221, 255, 0.4);
      border: 4px solid #333;
      border-radius: 8px;
    }

    canvas {
      display: block;
      background: linear-gradient(to bottom, #1a0033 0%, #001133 100%);
    }

    /* Game HUD overlays */
    .hud-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      font-size: 1.5rem;
      text-shadow: 2px 2px 0 #000;
    }

    .screen-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 10;
    }

    h1 {
      font-size: 3.5rem;
      color: #00ddff;
      margin-bottom: 10px;
      text-shadow: 3px 3px 0 #000, 0 0 20px rgba(0, 221, 255, 0.6);
      letter-spacing: 2px;
    }

    p {
      font-size: 1.2rem;
      color: #ccc;
      margin-bottom: 25px;
    }

    button {
      background: linear-gradient(to bottom, #00ff66, #009933);
      border: 3px solid #fff;
      color: #fff;
      font-family: 'Russo One', sans-serif;
      font-size: 1.5rem;
      padding: 12px 40px;
      cursor: pointer;
      border-radius: 10px;
      text-shadow: 2px 2px 0 #000;
      box-shadow: 0 5px 15px rgba(0, 255, 100, 0.4);
      pointer-events: auto;
      transition: transform 0.1s;
    }

    button:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    
    <!-- Gameplay HUD -->
    <div class="hud-layer">
      <div class="top-bar">
        <div id="score-display">ATTEMPT 1</div>
        <div id="percent-display">0%</div>
      </div>
    </div>

    <!-- Menu / Game Over Screen Overlay -->
    <div id="menu-overlay" class="screen-overlay">
      <h1 id="menu-title">GEOMETRY DASH</h1>
      <p id="menu-sub">PRESS SPACEBAR, CLICK, OR TAP TO JUMP</p>
      <button onclick="startGame()">PLAY</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Web Audio API Synthesis Engine (No external sound files required)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'jump') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
      } else if (type === 'crash') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      }
    }

    // Physics Configurations
    const GRAVITY = 1.2;
    const JUMP_FORCE = -15;
    const BASE_SPEED = 6;
    const FLOOR_Y = 320;

    let gameActive = false;
    let attempts = 1;
    let gameSpeed = BASE_SPEED;
    let distanceTraveled = 0;
    const targetDistance = 5000; // Finish line marker

    // Player Cube Entity Matrix
    let cube = {
      x: 100, y: FLOOR_Y - 30,
      w: 30, h: 30,
      vy: 0,
      rotation: 0,
      isGrounded: false
    };

    let obstacles = [];
    let particles = [];
    let spawnTimer = 0;

    // Obstacle Generator Map Array
    function spawnObstacle() {
      // Randomly spawn a single spike (1) or double spike (2)
      let type = Math.random() > 0.4 ? 1 : 2;
      obstacles.push({
        x: canvas.width + 50,
        y: FLOOR_Y,
        type: type,
        w: type === 1 ? 30 : 55,
        h: 32,
        passed: false
      });
    }

    function createExplosion(x, y, color) {
      for (let i = 0; i < 20; i++) {
        particles.push({
          x: x, y: y,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 8,
          size: Math.random() * 4 + 2,
          alpha: 1,
          color: color
        });
      }
    }

    // Input Trigger Interceptors
    function triggerJump() {
      if (!gameActive) return;
      if (cube.isGrounded) {
        cube.vy = JUMP_FORCE;
        cube.isGrounded = false;
        playSound('jump');
      }
    }

    window.addEventListener('keydown', (e) => { if (e.code === 'Space' || e.code === 'ArrowUp') triggerJump(); });
    canvas.addEventListener('mousedown', triggerJump);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); triggerJump(); });

    function startGame() {
      document.getElementById('menu-overlay').style.display = 'none';
      resetGame();
      gameActive = true;
    }

    function resetGame() {
      cube.y = FLOOR_Y - 30;
      cube.vy = 0;
      cube.rotation = 0;
      cube.isGrounded = true;
      obstacles = [];
      particles = [];
      spawnTimer = 0;
      gameSpeed = BASE_SPEED;
      distanceTraveled = 0;
      document.getElementById('score-display').innerText = `ATTEMPT ${attempts}`;
    }

    function gameOver() {
      gameActive = false;
      playSound('crash');
      createExplosion(cube.x + 15, cube.y + 15, '#ff3300');
      attempts++;
      
      setTimeout(() => {
        document.getElementById('menu-title').innerText = "CRASHED!";
        document.getElementById('menu-sub').innerText = `You completed ${Math.floor((distanceTraveled/targetDistance)*100)}% of the grid map.`;
        document.getElementById('menu-overlay').style.display = 'flex';
      }, 600);
    }

    function gameWin() {
      gameActive = false;
      document.getElementById('menu-title').innerText = "VICTORY! 🎉";
      document.getElementById('menu-sub').innerText = `Completed successfully in ${attempts} attempts!`;
      document.getElementById('menu-overlay').style.display = 'flex';
    }

    // Main Game Loop Engine Update Cycle
    function update() {
      if (!gameActive) {
        updateParticles();
        return;
      }

      distanceTraveled += gameSpeed;
      gameSpeed = BASE_SPEED + (distanceTraveled / 1200); // Progressive speed up scaling
      
      let percentage = Math.min(100, Math.floor((distanceTraveled / targetDistance) * 100));
      document.getElementById('percent-display').innerText = `${percentage}%`;

      if (distanceTraveled >= targetDistance) {
        gameWin();
        return;
      }

      // Physics Engine
      cube.vy += GRAVITY;
      cube.y += cube.vy;

      // Ground Bounds Collision Lock
      if (cube.y >= FLOOR_Y - cube.h) {
        cube.y = FLOOR_Y - cube.h;
        cube.vy = 0;
        cube.isGrounded = true;
        // Snap rotation smoothly to nearest 90-degree angle upon landing
        cube.rotation = Math.round(cube.rotation / 90) * 90;
      } else {
        cube.rotation += gameSpeed * 0.75; // Passive flip animation in mid-air
      }

      // Spawn Obstacles System Manager Loop
      spawnTimer += gameSpeed;
      if (spawnTimer > 1800) { 
        spawnObstacle();
        spawnTimer = Math.random() * 400; // Variable frequency offsets
      }

      // Update and Collision Check Obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.x -= gameSpeed;

        // Bounding Box Coordinates Check Checkers
        let cubeLeft = cube.x + 4;
        let cubeRight = cube.x + cube.w - 4;
        let cubeTop = cube.y + 4;
        let cubeBottom = cube.y + cube.h;

        if (obs.type === 1) { // Single Triangle Spike Collision
          if (cubeRight > obs.x && cubeLeft < obs.x + obs.w && cubeBottom > obs.y - obs.h) {
            gameOver();
          }
        } else { // Double Spike Block Combo Bounding Matrix 
          if (cubeRight > obs.x && cubeLeft < obs.x + obs.w && cubeBottom > obs.y - obs.h) {
            gameOver();
          }
        }

        // Garbage collection
        if (obs.x < -100) obstacles.splice(i, 1);
      }

      updateParticles();
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.02;
        if (p.alpha <= 0) particles.splice(i, 1);
      }
    }

    // Canvas Render Pipeline Frame Draw Cycles
    function draw() {
      // Clear Screen with Vector Blue/Purple Gradients
      ctx.fillStyle = '#06001a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Grid Matrix Background lines
      ctx.strokeStyle = 'rgba(0, 180, 255, 0.05)';
      ctx.lineWidth = 1;
let gridOffset = (distanceTraveled) % 40;
for (let x = -gridOffset; x < canvas.width; x += 40) {
ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, FLOOR_Y); ctx.stroke();
}
// Draw Neon Floor Line Separator
ctx.fillStyle = '#0a0a28';
ctx.fillRect(0, FLOOR_Y, canvas.width, canvas.height - FLOOR_Y);
ctx.strokeStyle = '#00ddff';
ctx.lineWidth = 4;
ctx.beginPath(); ctx.moveTo(0, FLOOR_Y); ctx.lineTo(canvas.width, FLOOR_Y); ctx.stroke();
// Draw Obstacle Spikes (Neon Pink Hazard Shapes)
obstacles.forEach(obs => {
ctx.fillStyle = '#ff0055';
ctx.strokeStyle = '#fff';
ctx.lineWidth = 2;
if (obs.type === 1) {
ctx.beginPath();
ctx.moveTo(obs.x, obs.y);
ctx.lineTo(obs.x + obs.w / 2, obs.y - obs.h);
ctx.lineTo(obs.x + obs.w, obs.y);
ctx.closePath(); ctx.fill(); ctx.stroke();
} else {
// Double interlocking spike layout
ctx.beginPath();
ctx.moveTo(obs.x, obs.y);
ctx.lineTo(obs.x + 15, obs.y - obs.h);
ctx.lineTo(obs.x + 30, obs.y);
ctx.moveTo(obs.x + 25, obs.y);
ctx.lineTo(obs.x + 40, obs.y - obs.h);
ctx.lineTo(obs.x + 55, obs.y);
ctx.closePath(); ctx.fill(); ctx.stroke();
}
});
// Draw Particles Explosion Engine Layout
particles.forEach(p => {
ctx.save();
ctx.globalAlpha = p.alpha;
ctx.fillStyle = p.color;
ctx.fillRect(p.x, p.y, p.size, p.size);
ctx.restore();
});
// Draw Player Cube with active 2D transformations Matrix rotations
if (gameActive) {
ctx.save();
ctx.translate(cube.x + cube.w / 2, cube.y + cube.h / 2);
ctx.rotate((cube.rotation * Math.PI) / 180);
// Cube Core Shape Body
ctx.fillStyle = '#00ffcc';
ctx.strokeStyle = '#fff';
ctx.lineWidth = 3;
ctx.fillRect(-cube.w / 2, -cube.h / 2, cube.w, cube.h);
ctx.strokeRect(-cube.w / 2, -cube.h / 2, cube.w, cube.h);
// Icon Eyes/Expression detailing lines
ctx.fillStyle = '#000';
ctx.fillRect(-10, -10, 6, 6);
ctx.fillRect(4, -10, 6, 6);
ctx.fillRect(-8, 4, 16, 4);
ctx.restore();
}
}
// Master Animation Frame Clock Loop Engine
function loop() {
update();
draw();
requestAnimationFrame(loop);
}
loop();
