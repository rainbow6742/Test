<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e272e, #34495e);
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .score-board {
            display: flex;
            gap: 40px;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px 40px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            font-size: 1.2rem;
            text-align: center;
        }

        .score-box span {
            display: block;
            font-size: 2rem;
            font-weight: bold;
            color: #05c46b;
        }

        .choices-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .choice-btn {
            background: #485460;
            border: none;
            border-bottom: 6px solid #1e272e;
            border-radius: 50%;
            width: 90px;
            height: 90px;
            font-size: 2.5rem;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

        .choice-btn:hover {
            background: #0be881;
        }

        .choice-btn:active {
            transform: translateY(4px);
            border-bottom-width: 2px;
        }

        .display-area {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            width: 80%;
            max-width: 400px;
            text-align: center;
            min-height: 120px;
        }

        .versus {
            font-size: 1.2rem;
            color: #d2dae2;
            margin-bottom: 10px;
        }

        .result-message {
            font-size: 1.8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .win { color: #0be881; text-shadow: 0 0 10px rgba(11,232,129,0.4); }
        .lose { color: #ff5e57; text-shadow: 0 0 10px rgba(255,94,87,0.4); }
        .draw { color: #ffdd59; text-shadow: 0 0 10px rgba(255,221,89,0.4); }
    </style>
</head>
<body>

    <h1>Rock Paper Scissors</h1>
    <p style="color: #bdc581; margin-top: 0; margin-bottom: 20px;">First to beat the computer wins the round!</p>

    <div class="score-board">
        <div class="score-box">
            Player
            <span id="player-score">0</span>
        </div>
        <div class="score-box">
            Computer
            <span id="computer-score" style="color: #ff5e57;">0</span>
        </div>
    </div>

    <div class="choices-container">
        <button class="choice-btn" onclick="playGame('✊')">✊</button>
        <button class="choice-btn" onclick="playGame('✋')">✋</button>
        <button class="choice-btn" onclick="playGame('✌️')">✌️</button>
    </div>

    <div class="display-area">
        <div class="versus" id="matchup">Make your move to start!</div>
        <div class="result-message" id="result"></div>
    </div>

    <script>
        let pScore = 0;
        let cScore = 0;

        const emojis = { '✊': 'Rock', '✋': 'Paper', '✌️': 'Scissors' };
        const choices = ['✊', '✋', '✌️'];

        function playGame(playerChoice) {
            // Computer picks a random index
            const computerChoice = choices[Math.floor(Math.random() * choices.length)];
            
            document.getElementById('matchup').innerHTML = 
                `You chose <b>${emojis[playerChoice]}</b> vs Computer's <b>${emojis[computerChoice]}</b>`;

            const resultElement = document.getElementById('result');
            resultElement.className = "result-message"; // Reset classes

            if (playerChoice === computerChoice) {
                resultElement.textContent = "It's a Draw!";
                resultElement.classList.add('draw');
            } 
            else if (
                (playerChoice === '✊' && computerChoice === '✌️') ||
                (playerChoice === '✋' && computerChoice === '✊') ||
                (playerChoice === '✌️' && computerChoice === '✋')
            ) {
                resultElement.textContent = "You Win!";
                resultElement.classList.add('win');
                pScore++;
                document.getElementById('player-score').textContent = pScore;
            } 
            else {
                resultElement.textContent = "You Lose!";
                resultElement.classList.add('lose');
                cScore++;
                document.getElementById('computer-score').textContent = cScore;
            }
        }
    </script>
</body>
</html>
