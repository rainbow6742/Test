<!DOCTYPE html>
<html>
<head>
    <title>Typing Game</title>
    <style>
        body { font-family: monospace; background: #1e1e2e; color: #cd.d6f4; text-align: center; padding-top: 50px; }
        #box { font-size: 1.5rem; max-width: 600px; margin: 20px auto; background: #252538; padding: 20px; border-radius: 8px; text-align: left; }
        .letter { color: #6c7086; }
        .correct { color: #a6e3a1; }
        .incorrect { color: #f38ba8; background: rgba(243,139,168,0.2); }
        .current { border-left: 2px solid #cba6f7; color: #fff; }
        input { position: absolute; opacity: 0; }
    </style>
</head>
<body>
    <h2>Time: <span id="t">30</span>s | WPM: <span id="w">0</span></h2>
    <input type="text" id="in" autocomplete="off">
    <div id="box" onclick="document.getElementById('in').focus()"></div>
    <button onclick="location.reload()">Restart</button>

    <script>
        const words = "algorithm function variable developer keyboard network security interface database framework".split(' ').sort(() => Math.random() - 0.5).join(' ');
        const box = document.getElementById('box'), input = document.getElementById('in'), timer = document.getElementById('t'), wpm = document.getElementById('w');
        let idx = 0, correct = 0, total = 0, timeLeft = 30, active = false, interval;

        box.innerHTML = [...words].map(c => `<span class="letter">${c}</span>`).join('');
        const spans = box.children;
        spans[0].classList.add('current');

        input.oninput = (e) => {
            if (!active && timeLeft === 30) {
                active = true;
                interval = setInterval(() => {
                    if (--timeLeft <= 0) { clearInterval(interval); input.disabled = true; alert(`Done! WPM: ${wpm.innerText}`); }
                    timer.innerText = timeLeft;
                    wpm.innerText = Math.round((correct / 5) / ((30 - timeLeft) / 60)) || 0;
                }, 1000);
            }

            if (timeLeft <= 0 || idx >= spans.length) return;
            spans[idx].classList.remove('current');

            if (e.inputType === 'deleteContentBackward') {
                if (idx > 0) {
                    idx--;
                    if (spans[idx].classList.contains('correct')) correct--;
                    spans[idx].className = 'letter current';
                }
            } else {
                let char = input.value.slice(-1);
                if (!char) return;
                if (char === spans[idx].innerText) { spans[idx].classList.add('correct'); correct++; }
                else spans[idx].classList.add('incorrect');
                idx++;
                if (idx < spans.length) spans[idx].classList.add('current');
            }
            input.value = '';
        };
        input.focus();
    </script>
</body>
</html>
