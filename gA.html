<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spacebar Speed Clicker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #2d2d2d;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }
        h1 { color: #00ffcc; margin-top: 0; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
            font-size: 1.1em;
            background: #3d3d3d;
            padding: 15px;
            border-radius: 10px;
        }
        .click-area {
            border: 3px dashed #00ffcc;
            padding: 40px 20px;
            border-radius: 10px;
            font-size: 1.5em;
            margin: 20px 0;
            background-color: #252525;
            cursor: pointer;
            user-select: none;
            transition: background 0.1s;
        }
        .click-area:active, .click-area.active {
            background-color: #353535;
            border-color: #ff00ff;
        }
        button {
            background-color: #00ffcc;
            color: #1a1a1a;
            border: none;
            padding: 10px 20px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            transition: transform 0.1s, background 0.2s;
        }
        button:hover { background-color: #00ccff; transform: scale(1.05); }
        button:disabled { background-color: #555; color: #aaa; cursor: not-allowed; transform: none; }
        .shop, .rewards {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #444;
        }
        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #3a3a3a;
            padding: 10px 15px;
            border-radius: 5px;
            margin: 10px 0;
        }
        .timer-alert { color: #ff3366; font-weight: bold; }
        .success-text { color: #00ffcc; }
    </style>
</head>
<body>

<div class="container">
    <h1>Spacebar Clicker (10s)</h1>
    
    <div class="stats-grid">
        <div>High Score: <span id="high-score">0</span></div>
        <div>Gems: 💎<span id="gem-count">0</span></div>
        <div>Current Score: <span id="current-score">0</span></div>
        <div>Time Left: <span id="time-left">10.0</span>s</div>
    </div>

    <div id="active-multipliers" style="margin-bottom: 15px; font-weight: bold; color: #ff00ff;"></div>

    <button id="start-btn" onclick="startGame()">Start Game</button>
    <button id="save-btn" onclick="saveGame()">💾 Save Game</button>

    <div id="click-zone" class="click-area">
        Press <strong>SPACEBAR</strong> or Click Here to Start!
    </div>

    <div class="rewards">
        <h3>🎁 Daily Rewards</h3>
        <button id="daily-btn" onclick="claimDaily()">Claim Daily Reward (50 Gems)</button>
        <p id="daily-status" style="font-size: 0.9em; color: #aaa;"></p>
    </div>

    <div class="shop">
        <h3>🛒 Multiplier Shop</h3>
        <div class="shop-item">
            <div>
                <strong>2x Gem Multiplier</strong><br>
                <small>Lasts for 1 game room</small>
            </div>
            <button id="buy-x2" onclick="buyMultiplier(2, 50)">Cost: 50 💎</button>
        </div>
        <div class="shop-item">
            <div>
                <strong>5x Gem Multiplier</strong><br>
                <small>Lasts for 1 game room</small>
            </div>
            <button id="buy-x5" onclick="buyMultiplier(5, 200)">Cost: 200 💎</button>
        </div>
    </div>
</div>

<script>
    // Game State variables
    let score = 0;
    let highScore = 0;
    let gems = 0;
    let timeLeft = 10.0;
    let isPlaying = false;
    let timerInterval = null;
    let lastDailyClaim = 0;
    
    // Shop multipliers (array of modifiers that expire after use)
    let activeMultipliers = []; 

    const clickZone = document.getElementById('click-zone');
    const startBtn = document.getElementById('start-btn');

    // Load game automatically on launch
    window.onload = function() {
        loadGame();
        updateUI();
        checkDailyAvailability();
    };

    // Keyboard Listeners
    window.addEventListener('keydown', function(e) {
        if (e.code === 'Space') {
            e.preventDefault(); // Stop page scrolling
            registerClick();
        }
    });

    // Touch/Click listener for accessibility
    clickZone.addEventListener('mousedown', function() {
        registerClick();
    });

    function registerClick() {
        if (!isPlaying) return;
        score++;
        document.getElementById('current-score').innerText = score;
        
        // Brief visual flash
        clickZone.classList.add('active');
        setTimeout(() => clickZone.classList.remove('active'), 50);
    }

    function startGame() {
        if (isPlaying) return;
        
        isPlaying = true;
        score = 0;
        timeLeft = 10.0;
        
        document.getElementById('current-score').innerText = score;
        startBtn.disabled = true;
        clickZone.innerHTML = "<strong>GO! GO! GO!</strong>";
        
        timerInterval = setInterval(() => {
            timeLeft -= 0.1;
            if (timeLeft <= 0) {
                timeLeft = 0;
                endGame();
            }
            document.getElementById('time-left').innerText = timeLeft.toFixed(1);
        }, 100);
    }

    function endGame() {
        isPlaying = false;
        clearInterval(timerInterval);
        startBtn.disabled = false;
        clickZone.innerHTML = "Game Over! Press Start to play again.";

        let gemsEarned = 0;
        let isNewBest = false;

        // Gem Logic
        if (score > 10) {
            gemsEarned = score; // Base rewards match score amounts
            
            // Check Highscore / New Best
            if (score > highScore) {
                highScore = score;
                isNewBest = true;
                gemsEarned *= 2; // High score double multiplier rule
            }

            // Apply Shop Multipliers
            if (activeMultipliers.length > 0) {
                let shopMultiplierTotal = activeMultipliers.reduce((a, b) => a * b, 1);
                gemsEarned *= shopMultiplierTotal;
            }

            gems += gemsEarned;
        }

        // Output breakdown alert
        let message = `You got ${score} clicks!`;
        if (score > 10) {
            message += `\nEarned ${gemsEarned} Gems! ` + 
                       (isNewBest ? "🔥 NEW BEST BONUS!" : "") +
                       (activeMultipliers.length > 0 ? " 🛒 Shop Multiplier Applied!" : "");
        } else {
            message += `\nScore 11 or higher to earn gems!`;
        }
        alert(message);

        // Reset temporary multipliers
        activeMultipliers = [];
        
        updateUI();
        saveGame(); // Auto-save at completion
    }

    // Shop functions
    function buyMultiplier(factor, cost) {
        if (gems >= cost) {
            gems -= cost;
            activeMultipliers.push(factor);
            alert(`Successfully purchased ${factor}x Gem Multiplier! Valid for your NEXT game run.`);
            updateUI();
        } else {
            alert("Not enough Gems!");
        }
    }

    // Daily rewards setup
    function claimDaily() {
        const now = Date.now();
        const oneDay = 24 * 60 * 60 * 1000;

        if (now - lastDailyClaim >= oneDay) {
            gems += 50;
            lastDailyClaim = now;
            alert("Claimed 50 Daily Gems!");
            updateUI();
            checkDailyAvailability();
            saveGame();
        }
    }

    function checkDailyAvailability() {
        const dailyBtn = document.getElementById('daily-btn');
        const dailyStatus = document.getElementById('daily-status');
        const now = Date.now();
        const oneDay = 24 * 60 * 60 * 1000;
        const nextAvailable = lastDailyClaim + oneDay;

        if (now >= nextAvailable) {
            dailyBtn.disabled = false;
            dailyStatus.innerText = "Available to claim now!";
        } else {
            dailyBtn.disabled = true;
            
            // Countdown function
            let timeLeftMs = nextAvailable - now;
            let hours = Math.floor(timeLeftMs / (1000 * 60 * 60));
            let minutes = Math.floor((timeLeftMs % (1000 * 60 * 60)) / (1000 * 60));
            dailyStatus.innerText = `Next reward available in: ${hours}h ${minutes}m`;
        }
    }

    // Data Save and UI handlers
    function saveGame() {
        const saveState = {
            highScore: highScore,
            gems: gems,
            lastDailyClaim: lastDailyClaim
        };
        localStorage.setItem('spacebarClickerSave', JSON.stringify(saveState));
        
        // Show status feedback on button text
        const saveBtn = document.getElementById('save-btn');
        saveBtn.innerText = "✅ Saved!";
        setTimeout(() => saveBtn.innerText = "💾 Save Game", 1500);
    }

    function loadGame() {
        const savedData = localStorage.getItem('spacebarClickerSave');
        if (savedData) {
            const parsed = JSON.parse(savedData);
            highScore = parsed.highScore || 0;
            gems = parsed.gems || 0;
            lastDailyClaim = parsed.lastDailyClaim || 0;
        }
    }

    function updateUI() {
document.getElementById('high-score').innerText = highScore;
document.getElementById('gem-count').innerText = gems;
// Shop button restrictions
document.getElementById('buy-x2').disabled = (gems < 50);
document.getElementById('buy-x5').disabled = (gems < 200);
// Display Active temporary status
const multDisplay = document.getElementById('active-multipliers');
if (activeMultipliers.length > 0) {
let combined = activeMultipliers.reduce((a,b) => a * b, 1);
multDisplay.innerText = 🛒 Active Shop Boost for next run: ${combined}x Gems;
} else {
multDisplay.innerText = "";
}
}
// Auto-update daily countdown every minute
setInterval(checkDailyAvailability, 60000);
