<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPS Betting</title>
    <style>
        :root { --cur: default; }
        body { font-family: system-ui; background: linear-gradient(135deg, #1e272e, #34495e); color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; user-select: none; cursor: var(--cur); }
        .top-ui { display: flex; gap: 15px; margin-bottom: 20px; width: 100%; max-width: 450px; }
        .card { background: rgba(0, 0, 0, 0.4); padding: 10px; border-radius: 10px; text-align: center; flex: 1; }
        .coins { color: #ffdd59; font-size: 1.6rem; font-weight: bold; }
        .bet-box, .safe-box { background: rgba(0,0,0,0.2); padding: 12px; border-radius: 12px; width: 100%; max-width: 420px; text-align: center; margin-bottom: 15px; box-sizing: border-box; }
        .safe-box { display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: bold; }
        .slider { width: 80%; accent-color: #ffdd59; }
        .choices { display: flex; gap: 20px; margin-bottom: 20px; }
        
        /* Force cursor style over buttons and interactables */
        .btn, .cur-item, input, label { cursor: inherit !important; }
        
        .btn { background: #485460; border: none; border-bottom: 5px solid #1e272e; border-radius: 50%; width: 80px; height: 80px; font-size: 2.2rem; transition: transform 0.1s; display: flex; align-items: center; justify-content: center; }
        .btn:hover { background: #0be881; }
        .btn:active { transform: translateY(3px); border-bottom-width: 2px; }
        
        .display { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; width: 100%; max-width: 420px; text-align: center; min-height: 80px; box-sizing: border-box; }
        .win { color: #0be881; font-weight: bold; font-size: 1.5rem; }
        .lose { color: #ff5e57; font-weight: bold; font-size: 1.5rem; }
        .draw { color: #ffdd59; font-weight: bold; font-size: 1.5rem; }
        .cur-box { margin-top: 25px; background: rgba(255,255,255,0.07); padding: 12px; border-radius: 12px; width: 100%; max-width: 450px; box-sizing: border-box; }
        .cur-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
        .cur-item { background: rgba(0,0,0,0.3); padding: 8px; border-radius: 6px; text-align: center; font-size: 0.8rem; border: 2px solid transparent; }
        .cur-item.active { border-color: #00d2d3; background: rgba(0,210,211,0.15); }
    </style>
</head>
<body>

    <div class="top-ui">
        <div class="card">💰 Wealth<div id="coin-val" class="coins">100</div></div>
        <div class="card">Record<div id="record-val" style="font-size:1.3rem; font-weight:bold; margin-top:5px; color:#0be881;">0 - 0</div></div>
    </div>

    <h1>RPS Tycoon</h1>
    
    <div class="safe-box">
        <input type="checkbox" id="safe-toggle" onchange="toggleSafeMode(this.checked)" style="transform: scale(1.3);">
        <label for="safe-toggle" id="safe-label">🛡️ Safe Mode (No Loss)</label>
    </div>
    
    <div class="bet-box">
        <div>Bet: <b style="color:#ffdd59;">💰 <span id="bet-display">10</span></b></div>
        <input type="range" min="1" max="100" value="10" class="slider" id="slider" oninput="updateBet(this.value)">
    </div>

    <div class="choices">
        <button class="btn" onclick="play('✊')">✊</button>
        <button class="btn" onclick="play('✋')">✋</button>
        <button class="btn" onclick="play('✌️')">✌️</button>
    </div>

    <div class="display">
        <div id="matchup" style="color:#d2dae2;">Set your bet and pick a move!</div>
        <div id="result" style="margin-top:5px;"></div>
    </div>

    <div class="cur-box">
        <div style="font-weight:bold; margin-bottom:8px; color:#ffdd59; text-align:center;">🖱️ Free Cursors</div>
        <div class="cur-grid">
            <div class="cur-item active" id="c-default" onclick="setCur('default')">Normal</div>
            <div class="cur-item" id="c-crosshair" onclick="setCur('crosshair')">Crosshair</div>
            <div class="cur-item" id="c-laser" onclick="setCur('laser')">🔴 Laser Dot</div>
        </div>
    </div>

    <script>
        let coins = 100, wins = 0, losses = 0, activeBet = 10, chosenCur = 'default', safeMode = false;
        const name = { '✊': 'Rock', '✋': 'Paper', '✌️': 'Scissors' }, choices = ['✊', '✋', '✌️'];

        window.onload = () => { load(); updateUI(); setCur(chosenCur); };

        function updateBet(val) {
            if (val > coins) { val = Math.max(1, coins); document.getElementById('slider').value = val; }
            activeBet = parseInt(val);
            document.getElementById('bet-display').textContent = activeBet;
        }

        function toggleSafeMode(checked) {
            if (coins >= 5000) {
                document.getElementById('safe-toggle').checked = false;
                return;
            }
            safeMode = checked;
            save();
        }

        function updateUI() {
            document.getElementById('coin-val').textContent = coins;
            document.getElementById('record-val').textContent = `${wins} - ${losses}`;
            document.getElementById('slider').max = Math.max(1, coins);
            if (parseInt(document.getElementById('slider').value) > coins) updateBet(coins);

            const toggle = document.getElementById('safe-toggle');
            const label = document.getElementById('safe-label');
            if (coins >= 5000) {
                safeMode = false;
                toggle.checked = false;
                toggle.disabled = true;
                label.innerHTML = "🔒 Safe Mode (Disabled at 5000+)";
                label.style.color = "#ff5e57";
            } else {
                toggle.disabled = false;
                toggle.checked = safeMode;
                label.innerHTML = "🛡️ Safe Mode (No Loss)";
                label.style.color = "#fff";
            }
        }

        function play(player) {
            if (coins <= 0) { alert("Bankrupt! Gifting 💰 20 to keep playing!"); coins = 20; updateUI(); return; }
            if (activeBet > coins) updateBet(coins);

            const comp = choices[Math.floor(Math.random() * 3)];
            document.getElementById('matchup').innerHTML = `You [${name[player]}] vs Computer [${name[comp]}]`;
            const res = document.getElementById('result');

            if (player === comp) { 
                res.textContent = "Draw!"; res.className = "draw"; 
            } 
            else if ((player==='✊' && comp==='✌️') || (player==='✋' && comp==='✊') || (player==='✌️' && comp==='✋')) {
                coins += activeBet; wins++; res.textContent = `Win! +💰${activeBet}`; res.className = "win";
            } else {
                losses++;
                if (safeMode) {
                    res.textContent = `Lose! Saved by Safe Mode! (💰0)`; res.className = "draw";
                } else {
                    coins -= activeBet; res.textContent = `Lose! -💰${activeBet}`; res.className = "lose";
                }
            }
            updateUI(); save();
        }

        function setCur(type) {
            chosenCur = type;
            if (type === 'laser') {
                // Injects a high-vis standalone pixel-perfect red circle SVG asset
                document.documentElement.style.setProperty('--cur', `url('data:image/svg+xml;utf8,<svg xmlns="http://w3.org" width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5" fill="%23ff0055" stroke="%23ffffff" stroke-width="1.5"/></svg>') 8 8, auto`);
            } else {
                document.documentElement.style.setProperty('--cur', type);
            }
            document.querySelectorAll('.cur-item').forEach(i => i.classList.remove('active'));
            document.getElementById(`c-${type}`).classList.add('active');
            save();
        }

        function save() { localStorage.setItem('rps_s_laser', JSON.stringify({ coins, wins, losses, chosenCur, safeMode })); }
        function load() { const d = localStorage.getItem('rps_s_laser'); if (d) { try { const p = JSON.parse(d); coins = p.coins??100; wins = p.wins??0; losses = p.losses??0; chosenCur = p.chosenCur??'default'; safeMode = p.safeMode??false; } catch(e){} } }
    </script>
</body>
</html>
