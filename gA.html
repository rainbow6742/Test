<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gem Catcher Arcade</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #ui {
            display: flex;
            gap: 20px;
            font-size: 20px;
            margin-bottom: 10px;
            font-weight: bold;
            color: #00ffcc;
        }
        #gameCanvas {
            background: #222;
            border: 4px solid #00ffcc;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
            max-width: 100%;
        }
        #controls {
            margin-top: 15px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div>Score: <span id="score">0</span></div>
        <div>Lives: <span id="lives">3</span></div>
    </div>
    
    <canvas id="gameCanvas" width="400" height="500"></canvas>
    
    <div id="controls">Use ⬅️ and ➡️ Arrow Keys or Click/Drag to move the bucket!</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");

    // Game variables
    let score = 0;
    let lives = 3;
    let gameOver = false;

    // Player Basket
    const basket = {
        x: 175,
        y: 460,
        width: 60,
        height: 15,
        speed: 7
    };

    // Falling Gems
    let gems = [];
    const gemSize = 12;
    let spawnTimer = 0;
    let baseSpeed = 2.5;

    // Keyboard inputs
    let keys = {};
    window.addEventListener("keydown", e => keys[e.code] = true);
    window.addEventListener("keyup", e => keys[e.code] = false);

    // Mouse / Touch inputs
    canvas.addEventListener("mousemove", e => {
        const rect = canvas.getBoundingClientRect();
        const root = document.documentElement;
        const mouseX = e.clientX - rect.left - root.scrollLeft;
        basket.x = mouseX - basket.width / 2;
    });

    function spawnGem() {
        gems.push({
            x: Math.random() * (canvas.width - gemSize * 2) + gemSize,
            y: 0,
            speed: baseSpeed + Math.random() * 2,
            color: `hsl(${Math.random() * 360}, 100%, 60%)`
        });
    }

    function update() {
        if (gameOver) return;

        // Move basket with keyboard
        if (keys["ArrowLeft"] && basket.x > 0) basket.x -= basket.speed;
        if (keys["ArrowRight"] && basket.x < canvas.width - basket.width) basket.x += basket.speed;

        // Keep basket in screen bounds
        if (basket.x < 0) basket.x = 0;
        if (basket.x > canvas.width - basket.width) basket.x = canvas.width - basket.width;

        // Spawn gems
        spawnTimer++;
        if (spawnTimer > 40) {
            spawnGem();
            spawnTimer = 0;
        }

        // Update gems
        for (let i = gems.length - 1; i >= 0; i--) {
            let g = gems[i];
            g.y += g.speed;

            // Catch collision
            if (g.y + gemSize >= basket.y && 
                g.x >= basket.x && 
                g.x <= basket.x + basket.width) {
                score++;
                scoreEl.innerText = score;
                baseSpeed += 0.05; // Make game progressively faster
                gems.splice(i, 1);
                continue;
            }

            // Miss check
            if (g.y > canvas.height) {
                lives--;
                livesEl.innerText = lives;
                gems.splice(i, 1);

                if (lives <= 0) {
                    gameOver = true;
                }
            }
        }
    }

    function draw() {
        // Clear background
        ctx.fillStyle = "#222";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Basket
        ctx.fillStyle = "#00ffcc";
        ctx.fillRect(basket.x, basket.y, basket.width, basket.height);

        // Draw Gems
        gems.forEach(g => {
            ctx.fillStyle = g.color;
            ctx.beginPath();
            ctx.moveTo(g.x, g.y - gemSize);
            ctx.lineTo(g.x + gemSize, g.y);
            ctx.lineTo(g.x, g.y + gemSize);
            ctx.lineTo(g.x - gemSize, g.y);
            ctx.closePath();
            ctx.fill();
        });

        // Game Over screen
        if (gameOver) {
            ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ff3366";
            ctx.font = "30px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 10);
            ctx.fillStyle = "#fff";
            ctx.font = "16px sans-serif";
            ctx.fillText("Refresh the page to play again!", canvas.width / 2, canvas.height / 2 + 30);
        }
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // Fire up loop
    gameLoop();
</script>
</body>
</html>
