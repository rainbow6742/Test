<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RPS</title>
    <style>
        :root { --bg: linear-gradient(135deg, #1e272e, #34495e); }
        body { font-family: system-ui; background: var(--bg); color: #fff; text-align: center; user-select: none; }
        .box { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; max-width: 400px; margin: 10px auto; }
        .btn { background: #485460; border: none; border-bottom: 4px solid #111; border-radius: 50%; width: 70px; height: 70px; font-size: 2rem; margin: 5px; cursor: pointer; }
        .btn:hover { background: #0be881; }
        .btn:active { transform: translateY(2px); border-bottom-width: 1px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 5px; }
        .item { background: rgba(0,0,0,0.3); padding: 5px; border-radius: 4px; font-size: 0.75rem; border: 2px solid transparent; cursor: pointer; }
        .item.active { border-color: #00d2d3; }
    </style>
</head>
<body>

    <h2>💰 <span id="c">100</span> | <span id="d"></span></h2>
    
    <div class="box">
        <input type="checkbox" id="st" onchange="tg(this.checked)"> <label id="sl" for="st">🛡️ Safe Mode</label>
    </div>

    <div class="box">
        Bet: 💰<span id="bd">10</span><br>
        <input type="range" min="1" max="100" value="10" id="sd" oninput="ub(this.value)" style="width:90%">
    </div>

    <div>
        <button class="btn" onclick="p('✊')">✊</button>
        <button class="btn" onclick="p('✋')">✋</button>
        <button class="btn" onclick="p('✌️')">✌️</button>
    </div>

    <div class="box" id="m">Pick a move!</div>

    <div class="box">
        <div>🎨 Background Paint</div>
        <div class="grid" id="sg"></div>
    </div>

    <script>
        let co = 100, ab = 10, sm = false, cd = null, inv = ['d'], th = 'd';
        const tms = {
            d: { n: 'Slate', c: 0, s: 'linear-gradient(135deg, #1e272e, #34495e)' },
            r: { n: 'Ruby', c: 50, s: 'linear-gradient(135deg, #2c3e50, #ea2027)' },
            n: { n: 'Neon', c: 150, s: 'linear-gradient(135deg, #000, #a55eea)' },
            g: { n: 'Gold', c: 400, s: 'linear-gradient(135deg, #2c3e50, #f1c40f)' }
        }, nm = { '✊': 'Rock', '✋': 'Paper', '✌️': 'Scissors' }, ch = ['✊', '✋', '✌️'];

        window.onload = () => { ld(); ui(); };

        function ub(v) { ab = Math.min(parseInt(v), co); document.getElementById('bd').textContent = ab; }
        
        function tg(c) { if (co < 5000) { sm = c; sv(); } else document.getElementById('st').checked = false; }

        function ui() {
            document.getElementById('c').textContent = co;
            const s = document.getElementById('sd'); s.max = co; if (parseInt(s.value) > co) ub(co);
            const t = document.getElementById('st'), l = document.getElementById('sl');
            if (co >= 5000) { sm = false; t.checked = false; t.disabled = true; l.innerHTML = "🔒 Closed (5000+)"; }
            else { t.disabled = false; t.checked = sm; l.innerHTML = "🛡️ Safe Mode"; }
            
            const d = document.getElementById('d');
            if (cd === new Date().toDateString()) d.innerHTML = "Claimed";
            else d.innerHTML = `<button onclick="cl()" style="cursor:pointer">🎁 +50</button>`;
            
            const g = document.getElementById('sg'); g.innerHTML = '';
            Object.keys(tms).forEach(k => {
                const i = tms[k], ow = inv.includes(k), ac = th === k;
                const d = document.createElement('div'); d.className = `item ${ac?'active':''}`;
                d.innerHTML = `<b>${i.n}</b><br>${ac?'Equipped':ow?'Equip':'💰'+i.c}`;
                d.onclick = () => {
                    if (ac) return;
                    if (ow) { th = k; } 
                    else if (co >= i.c) { co -= i.c; inv.push(k); th = k; }
                    document.documentElement.style.setProperty('--bg', tms[th].s); ui(); sv();
                };
                g.appendChild(d);
            });
        }

        function cl() { co += 50; cd = new Date().toDateString(); ui(); sv(); }

        function p(pl) {
            if (co <= 0) { alert("Gifted 💰20!"); co = 20; ui(); return; }
            const cp = ch[Math.floor(Math.random() * 3)];
            let res = "";
            if (pl === cp) res = "Draw!";
            else if ((pl==='✊'&&cp==='✌️')||(pl==='✋'&&cp==='✊')||(pl==='✌️'&&cp==='✋')) { co += ab; res = `Win! +💰${ab}`; } 
            else if (sm) res = "Protected!"; else { co -= ab; res = `Lose! -💰${ab}`; }
            document.getElementById('m').innerHTML = `You [${nm[pl]}] vs Comp [${nm[cp]}]<br><b>${res}</b>`;
            ui(); sv();
        }

        function sv() { localStorage.setItem('rps_mini', JSON.stringify({ co, sm, cd, inv, th })); }
        function ld() { const sa = localStorage.getItem('rps_mini'); if (sa) { try { const p = JSON.parse(sa); co=p.co??100; sm=p.sm??false; cd=p.cd; inv=p.inv??['d']; th=p.th??'d'; document.documentElement.style.setProperty('--bg', tms[th].s); } catch(e){} } }
    </script>
</body>
</html>
