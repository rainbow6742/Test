<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Arcade</title><style>
body{background:#111;color:#fff;font-family:sans-serif;text-align:center;margin:10px}
.b{background:#0fcc;border:0;padding:6px 12px;font-weight:bold;border-radius:4px;cursor:pointer}
.b:disabled{background:#555;cursor:not-allowed}
.s{background:#222;padding:8px;margin:8px auto;max-width:380px;border-radius:6px;display:flex;justify-content:space-between;align-items:center}
</style></head><body>
<div style="font-size:18px;margin-bottom:5px">Pts: 🪙<span id="pt">0</span> | Scr: <span id="sc">0</span> | Lvs: <span id="lv">3</span></div>
<canvas id="c" width="380" height="380" style="background:#222;border:3px solid #0fcc;border-radius:6px"></canvas>
<div class="s"><button class="b" onclick="sv(1)">💾 Save</button><span id="bt"></span></div>
<div class="s"><span>🎁 Daily (100pt)</span><button id="db" class="b" onclick="cl()">Claim</button></div>
<div class="s"><span>🛒 2x Next Run (50pt)</span><button id="b2" class="b" onclick="by(2,50)">Buy</button></div>
<div class="s"><span>🛒 Perm +1x (<span id="pc">150</span>pt)</span><button id="bp" class="b" onclick="bp()">Buy <span id="pm">1</span>x</button></div>
<script>
let el=id=>document.getElementById(id),cv=el('c'),x=cv.getContext('2d'),scr=0,lv=3,go=false;
let pts=0,dl=0,rm=1,pm=1,pc=150,g=[],bt={x:160,y:355,w:60,h:12},tm=0,spd=2.5;
window.onload=()=>{ld();up();setInterval(ck,10000);loop();};
window.addEventListener("keydown",e=>{if(e.code=="ArrowLeft"&&bt.x>0)bt.x-=15;if(e.code=="ArrowRight"&&bt.x<320)bt.x+=15});
cv.addEventListener("mousemove",e=>bt.x=Math.max(0,Math.min(320,e.clientX-cv.getBoundingClientRect().left-30)));
cv.addEventListener("click",e=>{if(go){let r=cv.getBoundingClientRect(),cx=e.clientX-r.left,cy=e.clientY-r.top;if(cx>115&&cx<265&&cy>210&&cy<250)rs();}});
function loop(){
    x.fillStyle="#222";x.fillRect(0,0,380,380);x.fillStyle="#0fcc";x.fillRect(bt.x,bt.y,bt.w,bt.h);
    if(!go){
        if(++tm>35){g.push({x:Math.random()*360+10,y:0,s:spd+Math.random()*2,c:`hsl(${Math.random()*360},90%,60%)`});tm=0;}
        for(let i=g.length-1;i>=0;i--){
            let o=g[i];o.y+=o.s;x.fillStyle=o.c;x.fillRect(o.x-5,o.y-5,10,10);
            if(o.y>=bt.y&&o.x>=bt.x&&o.x<=bt.x+bt.w){scr++;spd+=0.04;g.splice(i,1);}
            else if(o.y>380){lv--;g.splice(i,1);if(lv<=0){go=true;pts+=Math.floor(scr*pm*rm);rm=1;up();sv();}}
        }
    }else{
        x.fillStyle="rgba(0,0,0,0.8)";x.fillRect(0,0,380,380);x.fillStyle="#ff3366";x.font="24px sans-serif";x.fillText("GAME OVER",120,160);
        x.fillStyle="#fff";x.font="14px sans-serif";x.fillText("Score: "+scr,165,190);x.fillStyle="#0fcc";x.fillRect(115,210,150,40);
        x.fillStyle="#111";font="14px sans-serif";x.fillText("RESTART",160,235);
    }
    el('sc').innerText=scr;el('lv').innerText=lv;requestAnimationFrame(loop);
}
function rs(){scr=0;lv=3;spd=2.5;g=[];go=false;}
function by(f,c){if(pts>=c){pts-=c;rm*=f;up();sv();}}
function bp(){if(pts>=pc){pts-=pc;pm++;pc=Math.floor(pc*1.6);up();sv();}}
function cl(){if(!dl||Date.now()-dl>=86400000){pts+=100;dl=Date.now();up();sv();}}
function ck(){let a=!dl||Date.now()-dl>=86400000;el('db').disabled=!a;el('db').innerText=a?"Claim":"Locked";}
function sv(f){localStorage.setItem("gCP",{pts,dl,pm,pc});if(f){alert("Saved!");}}
function ld(){let s=localStorage.getItem("gCP");if(s){try{let p=JSON.parse(s);pts=p.pts||0;dl=p.dl||0;pm=p.pm||1;pc=p.pc||150;}catch(e){}}ck();}
function up(){el('pt').innerText=pts;el('pm').innerText=pm;el('pc').innerText=pc;el('b2').disabled=pts<50;el('bp').disabled=pts<pc;el('bt').innerText=rm>1?`🔥 ${rm}x Active`:"";}
</script></body></html>
