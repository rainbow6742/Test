<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Clicker Game</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2d2d44);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 400px;
            width: 90%;
        }

        h1 {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            color: #a5a5db;
        }

        .score-display {
            font-size: 4rem;
            font-weight: bold;
            margin: 1rem 0 2rem 0;
            color: #00ffcc;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            transition: transform 0.05s ease;
        }

        .click-btn {
            background: linear-gradient(135deg, #00ffcc, #0099ff);
            border: none;
            color: #12121c;
            padding: 1.2rem 2.5rem;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 255, 204, 0.3);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            outline: none;
            width: 100%;
        }

        .click-btn:作业-active, .click-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(0, 255, 204, 0.5);
        }

        .instructions {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #8a8ab0;
            line-height: 1.4;
        }

        .key-indicator {
            display: inline-block;
            background: #3d3d5c;
            color: #fff;
            padding: 0.2rem 0.5rem;
            border-radius: 5px;
            font-family: monospace;
            border-bottom: 3px solid #28283d;
            margin: 0 2px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>Score</h1>
        <div class="score-display" id="score">0</div>
        
        <button class="click-btn" id="clickBtn">TAP / CLICK ME</button>
        
        <div class="instructions">
            Tap the button OR press <span class="key-indicator">ANY KEY</span> on your keyboard to gain points!
        </div>
    </div>

    <script>
        // Game Logic State
        let points = 0;

        // DOM Elements
        const scoreDisplay = document.getElementById('score');
        const clickButton = document.getElementById('clickBtn');

        // Function to increment score and update UI
        function increasePoints() {
            points++;
            scoreDisplay.textContent = points;
            
            // Visual feedback effect on the score numbers
            scoreDisplay.style.transform = 'scale(1.1)';
            setTimeout(() => {
                scoreDisplay.style.transform = 'scale(1)';
            }, 50);
        }

        // Event Listener 1: Button Click / Mobile Tap
        clickButton.addEventListener('click', (e) => {
            increasePoints();
            // Prevents spacebar/enter from double-triggering when button has focus
            clickButton.blur(); 
        });

        // Event Listener 2: Any Keyboard Key Press
        window.addEventListener('keydown', (e) => {
            increasePoints();
            
            // Visually trigger the button state for keyboard users
            clickButton.style.transform = 'scale(0.95)';
            setTimeout(() => {
                clickButton.style.transform = '';
            }, 50);
        });
    </script>

</body>
</html>
