<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clicker Game Mini</title>
    <style>
        body { font-family: sans-serif; background: #12121c; color: #fff; text-align: center; padding: 20px; }
        .box { background: #1e1e2f; padding: 15px; border-radius: 10px; margin: 10px auto; max-width: 420px; }
        button { background: #00ffcc; border: none; padding: 10px; font-weight: bold; cursor: pointer; border-radius: 5px; margin: 4px; }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="box">
        <h1>Score: <span id="score">0</span></h1>
        <p>Auto-clicking: <span id="cps">0</span>/sec <span id="badge" style="color:#ff007f"></span></p>
        <button id="clickBtn" style="width:100%; height:50px;">TAP / CLICK OR PRESS ANY KEY</button>
        <hr>
        <div id="dailyText">Day 1: +10 Pts</div>
        <button id="dailyBtn">Claim Daily Reward</button>
    </div>

    <div class="box">
        <h3>🏪 Shop</h3>
        <p><b>Auto-Clickers:</b><br>
            <button class="shop-btn" onclick="buyAuto(1, 50)">+1/s (50pt)</button>
            <button class="shop-btn" onclick="buyAuto(5, 100)">+5/s (100pt)</button>
            <button class="shop-btn" onclick="buyAuto(10, 200)">+10/s (200pt)</button>
            <button class="shop-btn" onclick="buyAuto(25, 500)">+25/s (500pt)</button>
            <button class="shop-btn" onclick="buyAuto(50, 1000)">+50/s (1k pt)</button>
        </p>
        <p><b>1-Min Multipliers:</b><br>
            <button class="shop-btn" onclick="buyMult(2, 50)">2x (50pt)</button>
            <button class="shop-btn" onclick="buyMult(5, 200)">5x (200pt)</button>
        </p>
    </div>

    <script>
        let pts = parseInt(localStorage.getItem('pts')) || 0;
        let cps = parseInt(localStorage.getItem('cps')) || 0;
        let streak = parseInt(localStorage.getItem('streak')) || 1;
        let lastClaim = localStorage.getItem('lastClaim') || "";
        let mult = 1, multTimer, cdTimer;

        const el = (id) => document.getElementById(id);

        function clickAction() { pts += mult; saveAndUpdate(); }

        window.addEventListener('keydown', (e) => { if (!e.repeat) clickAction(); });
        el('clickBtn').addEventListener('click', () => { clickAction(); el('clickBtn').blur(); });

        setInterval(() => { if (cps > 0) { pts += (cps * mult); saveAndUpdate(); } }, 1000);

        function buyAuto(val, cost) { if (pts >= cost) { pts -= cost; cps += val; saveAndUpdate(); } }

        function buyMult(val, cost) {
            if (pts >= cost) {
                pts -= cost; mult = val; saveAndUpdate();
                clearTimeout(multTimer); clearInterval(cdTimer);
                let left = 60;
                el('badge').textContent = `(${val}x - ${left}s)`;
                cdTimer = setInterval(() => { left--; el('badge').textContent = left > 0 ? `(${val}x - ${left}s)` : ""; }, 1000);
                multTimer = setTimeout(() => { mult = 1; clearInterval(cdTimer); el('badge').textContent = ""; }, 60000);
            }
        }

        function checkDaily() {
            let today = new Date().toDateString();
            let amt = 10 * Math.pow(2, streak - 1);
            el('dailyText').textContent = `Day ${streak} Reward: +${amt} Points`;
            
            if (lastClaim === today) {
                el('dailyBtn').disabled = true;
                el('dailyBtn').textContent = "Claimed Today";
            } else {
                el('dailyBtn').disabled = false;
                el('dailyBtn').textContent = "Claim";
                if (lastClaim && Math.ceil(Math.abs(new Date(today) - new Date(lastClaim)) / 86400000) > 1) {
                    streak = 1;
                    checkDaily();
                }
            }
        }

        el('dailyBtn').addEventListener('click', () => {
            pts += 10 * Math.pow(2, streak - 1);
            lastClaim = new Date().toDateString();
            streak++;
            saveAndUpdate();
            checkDaily();
        });

        function saveAndUpdate() {
            localStorage.setItem('pts', pts); localStorage.setItem('cps', cps);
            localStorage.setItem('streak', streak); localStorage.setItem('lastClaim', lastClaim);
            el('score').textContent = pts; el('cps').textContent = cps;
            
            const costs =;
            document.querySelectorAll('.shop-btn').forEach((b, i) => {
                b.disabled = pts < costs[i];
            });
        }

        saveAndUpdate();
        checkDaily();
    </script>
</body>
</html>
