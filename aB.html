<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Multiplying Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #2c3e50;
            color: white;
        }
        .container {
            text-align: center;
            background: #34495e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 {
            margin-bottom: 10px;
        }
        p {
            color: #bdc3c7;
            margin-bottom: 25px;
        }
        input {
            padding: 12px;
            font-size: 18px;
            border: 2px solid #7f8c8d;
            border-radius: 6px;
            background: #2c3e50;
            color: white;
            text-align: center;
            width: 220px;
        }
        input:focus {
            outline: none;
            border-color: #e74c3c;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Don't Press 'X'</h1>
    <p>(Click the screen once first, then press 'X' to duplicate)</p>
    <input type="text" id="codeInput" placeholder="Enter code to close all..." maxlength="5">
</div>

<script>
    // BroadcastChannel allows all open tabs/windows of this page to talk to each other
    const closeChannel = new BroadcastChannel('close_windows_channel');

    // Listen for the close signal from any other window
    closeChannel.onmessage = (event) => {
        if (event.data === 'close_all') {
            window.close();
        }
    };

    // Detect when the user presses a key
    document.addEventListener('keydown', (event) => {
        // Check if the user is typing in the input box so typing 'x' in the code doesn't trigger popups
        if (document.activeElement === document.getElementById('codeInput')) {
            return; 
        }

        // If 'x' or 'X' is pressed, open 2 new instances of the exact same URL
        if (event.key === 'x' || event.key === 'X') {
            const currentUrl = window.location.href;
            window.open(currentUrl, '_blank');
            window.open(currentUrl, '_blank');
        }
    });

    // Monitor the input box for the magic code
    const codeInput = document.getElementById('codeInput');
    codeInput.addEventListener('input', () => {
        if (codeInput.value === '31718') {
            // Send a message to all other tabs to close
            closeChannel.postMessage('close_all');
            // Close the current tab
            window.close();
        }
    });
</script>

</body>
</html>
