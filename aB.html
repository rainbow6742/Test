<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman Game</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
            color: #4dabf7;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #2a2a35;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
        }

        /* Hangman Canvas/SVG styling */
        .gallows {
            stroke: #fff;
            stroke-width: 4;
            fill: none;
            stroke-linecap: round;
        }

        .body-part {
            display: none;
            stroke: #ff6b6b;
            stroke-width: 4;
        }

        .word-display {
            display: flex;
            gap: 15px;
            margin: 30px 0;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 5px;
        }

        .letter-slot {
            border-bottom: 4px solid #4dabf7;
            min-width: 25px;
            text-align: center;
            height: 45px;
        }

        /* Keyboard styling */
        .keyboard {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 450px;
        }

        .key {
            background-color: #3b3b4f;
            color: white;
            border: none;
            padding: 12px 0;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .key:hover:not(:disabled) {
            background-color: #4e4e6a;
        }

        .key:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .key.correct {
            background-color: #2b8a3e;
        }

        .key.wrong {
            background-color: #c92a2a;
        }

        /* Game Over Modals */
        .message {
            font-size: 20px;
            font-weight: bold;
            margin: 20px 0;
            min-height: 30px;
            text-align: center;
        }

        .btn-restart {
            background-color: #4dabf7;
            color: #1e1e24;
            border: none;
            padding: 12px 28px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            display: none;
        }

        .btn-restart:hover {
            background-color: #339af0;
        }
    </style>
</head>
<body>

    <h1>Hangman</h1>
    <div class="game-container">
        <!-- Hangman Visual elements using vector graphic lines -->
        <svg height="250" width="200">
            <!-- Gallows base -->
            <line x1="20" y1="230" x2="180" y2="230" class="gallows" />
            <line x1="60" y1="20" x2="60" y2="230" class="gallows" />
            <line x1="60" y1="20" x2="140" y2="20" class="gallows" />
            <line x1="140" y1="20" x2="140" y2="50" class="gallows" />

            <!-- Stick figure parts ordered by step -->
            <circle cx="140" cy="70" r="20" class="body-part" id="part-0" /> <!-- Head -->
            <line x1="140" y1="90" x2="140" y2="150" class="body-part" id="part-1" /> <!-- Body -->
            <line x1="140" y1="110" x2="110" y2="130" class="body-part" id="part-2" /> <!-- Left Arm -->
            <line x1="140" y1="110" x2="170" y2="130" class="body-part" id="part-3" /> <!-- Right Arm -->
            <line x1="140" y1="150" x2="110" y2="190" class="body-part" id="part-4" /> <!-- Left Leg -->
            <line x1="140" y1="150" x2="170" y2="190" class="body-part" id="part-5" /> <!-- Right Leg -->
        </svg>

        <div class="word-display" id="wordDisplay"></div>
        <div class="message" id="gameMessage"></div>
        <div class="keyboard" id="keyboard"></div>
        <button class="btn-restart" id="restartBtn" onclick="initGame()">Play Again</button>
    </div>

<script>
    const wordList = [
        "JAVASCRIPT", "DEVELOPER", "HANGMAN", "COMPUTER", "PROGRAMMING",
        "INTERFACE", "KEYBOARD", "BROWSERS", "CREATIVE", "MONITOR"
    ];

    let selectedWord = "";
    let guessedLetters = [];
    let wrongGuesses = 0;
    const maxWrong = 6;

    const wordDisplay = document.getElementById("wordDisplay");
    const gameMessage = document.getElementById("gameMessage");
    const keyboard = document.getElementById("keyboard");
    const restartBtn = document.getElementById("restartBtn");

    // Initialize/Reset the game state
    function initGame() {
        wrongGuesses = 0;
        guessedLetters = [];
        selectedWord = wordList[Math.floor(Math.random() * wordList.length)];
        
        gameMessage.textContent = "";
        restartBtn.style.display = "none";
        
        // Hide all hangman body parts
        for(let i = 0; i < maxWrong; i++) {
            document.getElementById(`part-${i}`).style.display = "none";
        }

        renderWord();
        renderKeyboard();
    }

    // Display underscores or correct letters
    function renderWord() {
        wordDisplay.innerHTML = "";
        let won = true;

        for (let letter of selectedWord) {
            const slot = document.createElement("div");
            slot.classList.add("letter-slot");
            
            if (guessedLetters.includes(letter)) {
                slot.textContent = letter;
            } else {
                slot.textContent = "";
                won = false;
            }
            wordDisplay.appendChild(slot);
        }

        if (won) {
            endGame(true);
        }
    }

    // Build the virtual A-Z alphabet buttons
    function renderKeyboard() {
        keyboard.innerHTML = "";
        for (let i = 65; i <= 90; i++) {
            const letter = String.fromCharCode(i);
            const button = document.createElement("button");
            button.classList.add("key");
            button.textContent = letter;
            button.id = `key-${letter}`;
            button.addEventListener("click", () => handleGuess(letter));
            keyboard.appendChild(button);
        }
    }

    // Process a chosen letter
    function handleGuess(letter) {
        guessedLetters.push(letter);
        const button = document.getElementById(`key-${letter}`);
        button.disabled = true;

        if (selectedWord.includes(letter)) {
            button.classList.add("correct");
            renderWord();
        } else {
            button.classList.add("wrong");
            // Reveal the next body part based on mistake number
            document.getElementById(`part-${wrongGuesses}`).style.display = "block";
            wrongGuesses++;
            
            if (wrongGuesses === maxWrong) {
                endGame(false);
            }
        }
    }

    // Process winning or losing conditions
    function endGame(isWin) {
        // Disable remaining layout buttons
        const keys = document.querySelectorAll(".key");
        keys.forEach(key => key.disabled = true);

        if (isWin) {
            gameMessage.textContent = "🎉 You Win! Congratulations! 🎉";
            gameMessage.style.color = "#2b8a3e";
        } else {
            gameMessage.textContent = `❌ Game Over! The word was: ${selectedWord}`;
            gameMessage.style.color = "#e74c3c";
        }
        
        restartBtn.style.display = "block";
    }

    // Start game on load
    initGame();
</script>

</body>
</html>
