<!DOCTYPE html>
<html>
<head>
    <title>MicroCraft</title>
    <style>
        body { margin: 0; overflow: hidden; background: #78a7ff; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #x { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; transform: translate(-50%,-50%); border: 2px solid white; mix-blend-mode: difference; pointer-events: none; }
        #u { position: absolute; top: 10px; left: 10px; color: white; text-shadow: 1px 1px #000; pointer-events: none; }
    </style>
</head>
<body>
    <div id="u">Click to play | WASD + Mouse | L-Click: Break, R-Click: Place</div>
    <div id="x"></div>
    <canvas id="c"></canvas>

    <script>
        const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth, h = canvas.height = window.innerHeight;
        window.onresize = () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; };

        const M = 16, H = 4, g = new Uint8Array(M * M * H);
        const getB = (x,y,z) => (x<0||x>=M||y<0||y>=M||z<0||z>=H) ? 0 : g[x + y*M + z*M*M];
        const setB = (x,y,z,v) => { if(x>=0&&x<M&&y>=0&&y<M&&z>=0&&z<H) g[x + y*M + z*M*M] = v; };

        // Generate flat world with a center wall
        for(let x=0; x<M; x++) for(let y=0; y<M; y++) { setB(x, y, 0, 1); if(x===8 && y>4 && y<12) setB(x, y, 1, 2); }

        let px = 4.5, py = 4.5, pz = 1.5, rx = 0, ry = 0, keys = {};
        canvas.onclick = () => canvas.requestPointerLock();
        document.onmousemove = (e) => { if (document.pointerLockElement===canvas) { rx -= e.movementX*0.004; ry = Math.max(-1.4, Math.min(1.4, ry - e.movementY*0.004)); } };
        window.onkeydown = (e) => keys[e.key.toLowerCase()] = true;
        window.onkeyup = (e) => keys[e.key.toLowerCase()] = false;

        function cast() {
            let dx = -Math.sin(rx)*Math.cos(ry), dy = Math.cos(rx)*Math.cos(ry), dz = Math.sin(ry);
            let cx = Math.floor(px), cy = Math.floor(py), cz = Math.floor(pz);
            let sx = Math.sign(dx), sy = Math.sign(dy), sz = Math.sign(dz);
            let tx = sx > 0 ? (cx + 1 - px) / dx : (px - cx) / dx, ty = sy > 0 ? (cy + 1 - py) / dy : (py - cy) / dy, tz = sz > 0 ? (cz + 1 - pz) / dz : (pz - cz) / dz;
            let ddx = Math.abs(1/dx), ddy = Math.abs(1/dy), ddz = Math.abs(1/dz), f = 0;
            for (let i = 0; i < 20; i++) {
                if (getB(cx, cy, cz) > 0) return { h: 1, x: cx, y: cy, z: cz, px: cx-(f===0?sx:0), py: cy-(f===1?sy:0), pz: cz-(f===2?sz:0) };
                if (tx < ty && tx < tz) { cx += sx; tx += ddx; f = 0; } else if (ty < tz) { cy += sy; ty += ddy; f = 1; } else { cz += sz; tz += ddz; f = 2; }
            }
            return { h: 0 };
        }

        window.onmousedown = (e) => {
            if (document.pointerLockElement !== canvas) return;
            let r = cast();
            if (r.h) { if (e.button === 0) setB(r.x, r.y, r.z, 0); if (e.button === 2) setB(r.px, r.py, r.pz, 1); }
        };
        canvas.oncontextmenu = (e) => e.preventDefault();

        const colors = [null, '#557a2b', '#808080'];

        function loop() {
            if (keys.w) { px -= Math.sin(rx)*0.05; py += Math.cos(rx)*0.05; }
            if (keys.s) { px += Math.sin(rx)*0.05; py -= Math.cos(rx)*0.05; }
            if (keys.a) { px -= Math.cos(rx)*0.05; py -= Math.sin(rx)*0.05; }
            if (keys.d) { px += Math.cos(rx)*0.05; py += Math.sin(rx)*0.05; }

            ctx.fillStyle = '#78a7ff'; ctx.fillRect(0, 0, w, h);
            let ray = cast();

            for (let sx = 0; sx < w; sx += 4) {
                let ax = rx + ((sx - w/2) / (w/2)) * 0.8;
                let dx = -Math.sin(ax)*Math.cos(ry), dy = Math.cos(ax)*Math.cos(ry), dz = Math.sin(ry);
                let cx = Math.floor(px), cy = Math.floor(py), cz = Math.floor(pz);
                let stepX = Math.sign(dx), stepY = Math.sign(dy), stepZ = Math.sign(dz);
                let tx = stepX > 0 ? (cx + 1 - px) / dx : (px - cx) / dx, ty = stepY > 0 ? (cy + 1 - py) / dy : (py - cy) / dy, tz = stepZ > 0 ? (cz + 1 - pz) / dz : (pz - cz) / dz;
                let ddx = Math.abs(1/dx), ddy = Math.abs(1/dy), ddz = Math.abs(1/dz), f = 0, bid = 0, d = 0;

                for (let i = 0; i < 30; i++) {
                    bid = getB(cx, cy, cz);
                    if (bid > 0) { d = (f===0)?tx-ddx:(f===1)?ty-ddy:tz-ddz; break; }
                    if (tx < ty && tx < tz) { cx += stepX; tx += ddx; f = 0; } else if (ty < tz) { cy += stepY; ty += ddy; f = 1; } else { cz += stepZ; tz += ddz; f = 2; }
                }

                if (bid > 0 && d > 0) {
                    let bh = Math.floor(h / (d * Math.cos(((sx - w/2) / (w/2)) * 0.8)));
                    let yTop = h/2 - bh/2 + (ry * h/2);
                    ctx.fillStyle = colors[bid];
                    ctx.fillRect(sx, yTop, 4, bh);
                    if (ray.h && cx === ray.x && cy === ray.y && cz === ray.z) { ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fillRect(sx, yTop, 4, bh); }
                }
            }
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
