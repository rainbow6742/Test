<!DOCTYPE html>
<html>
<head>
    <title>Retro Space Shooter</title>
    <style>
        body { margin: 0; background: #050510; overflow: hidden; color: #00ffff; font-family: sans-serif; }
        #ui { position: absolute; top: 10px; left: 10px; font-size: 20px; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">Score: <span id="sc">0</span> | Shield: <span id="sh">100</span>%</div>
    <canvas id="g"></canvas>

    <script>
        const canvas = document.getElementById('g'), ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth, h = canvas.height = window.innerHeight;
        window.onresize = () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; };

        let score = 0, shield = 100, px = w/2, py = h/2, keys = {}, objects = [];

        window.onkeydown = (e) => { keys[e.key.toLowerCase()] = true; if(e.key === ' ' && shield > 0) objects.push({t:'l', x:px, y:py, z:1}); };
        window.onkeyup = (e) => keys[e.key.toLowerCase()] = false;

        // Populate background stars
        for(let i=0; i<100; i++) objects.push({t:'s', x:Math.random()*w - w/2, y:Math.random()*h - h/2, z:Math.random()*1000});

        function spawn() {
            if(shield > 0) {
                objects.push({t:'a', x:(Math.random()-0.5)*w*2, y:(Math.random()-0.5)*h*2, z:1000, r:15+Math.random()*20});
                setTimeout(spawn, Math.max(200, 1000 - score));
            }
        }
        spawn();

        function loop() {
            ctx.fillStyle = '#050510'; ctx.fillRect(0, 0, w, h);
            const cx = w/2, cy = h/2;

            // Handle input
            if (keys.w) py -= 7; if (keys.s) py += 7; if (keys.a) px -= 7; if (keys.d) px += 7;
            px = Math.max(20, Math.min(w - 20, px)); py = Math.max(20, Math.min(h - 20, py));

            objects.forEach((o, idx) => {
                if (o.t === 's') { // Stars
                    o.z -= 4; if(o.z <= 0) o.z = 1000;
                    ctx.fillStyle = '#fff'; ctx.fillRect((o.x/o.z)*cx + cx, (o.y/o.z)*cy + cy, 2, 2);
                }
                else if (o.t === 'l') { // Lasers
                    o.z += 25;
                    ctx.fillStyle = '#00ffff'; ctx.beginPath(); ctx.arc(o.x, o.y, 4, 0, 7); ctx.fill();
                    if(o.z > 1000) objects.splice(idx, 1);
                }
                else if (o.t === 'a') { // Asteroids
                    o.z -= 6;
                    let sx = (o.x/o.z)*cx + cx, sy = (o.y/o.z)*cy + cy, sr = (o.r/o.z)*cx;
                    
                    if (o.z <= 10) { // Screen impact
                        if (Math.hypot(sx - px, sy - py) < sr + 20 && shield > 0) { shield -= 20; if(shield <= 0) alert(`Game Over! Score: ${score}`); }
                        objects.splice(idx, 1); return;
                    }

                    // Draw Asteroid
                    ctx.fillStyle = '#544'; ctx.beginPath(); ctx.arc(sx, sy, Math.max(1, sr), 0, 7); ctx.fill();

                    // Collision with lasers
                    objects.forEach((l, lIdx) => {
                        if (l.t === 'l' && Math.abs(l.z - (1000 - o.z)) < 60 && Math.hypot(l.x - sx, l.y - sy) < sr + 10) {
                            objects.splice(idx, 1); objects.splice(lIdx, 1); score += 100;
                        }
                    });
                }
            });

            // UI Update
            document.getElementById('sc').innerText = score;
            document.getElementById('sh').innerText = Math.max(0, shield);

            // Default Tactical Crosshair
            ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(px, py, 15, 0, 7); ctx.stroke(); // Circle
            ctx.beginPath(); ctx.moveTo(px-25, py); ctx.lineTo(px-5, py); ctx.moveTo(px+5, py); ctx.lineTo(px+25, py); // H-Lines
            ctx.moveTo(px, py-25); ctx.lineTo(px, py-5); ctx.moveTo(px, py+5); ctx.lineTo(px, py+25); ctx.stroke(); // V-Lines
            ctx.fillStyle = '#00ffff'; ctx.fillRect(px-1, py-1, 2, 2); // Center Dot

            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
