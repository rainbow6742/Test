<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusSpace - Pomodoro & Tasks</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --break-color: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .app-container {
            max-width: 900px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .app-container {
                grid-template-columns: 1fr;
            }
        }

        /* Timer Section Card */
        .timer-card, .task-card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .mode-selectors {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            background: transparent;
            border: 2px dashed var(--text-muted);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            border-style: solid;
            border-color: var(--accent-color);
            color: var(--text-main);
            background-color: rgba(59, 130, 246, 0.1);
        }

        .mode-btn.break-mode.active {
            border-color: var(--break-color);
            background-color: rgba(16, 185, 129, 0.1);
        }

        .time-display {
            font-size: 80px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            margin: 20px 0;
            letter-spacing: -2px;
        }

        .controls {
            display: flex;
            gap: 15px;
        }

        .control-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .control-btn:hover {
            opacity: 0.9;
        }

        .reset-btn {
            background-color: #475569;
        }

        /* Task Section Card */
        .task-card {
            align-items: stretch;
        }

        h2 {
            margin-top: 0;
            font-size: 24px;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
        }

        .task-input-wrapper {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #taskInput {
            flex: 1;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-size: 16px;
        }

        #taskInput:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .add-task-btn {
            background-color: #334155;
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 20px;
        }

        .add-task-btn:hover {
            background-color: #475569;
        }

        .task-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 280px;
            overflow-y: auto;
        }

        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0f172a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid var(--accent-color);
        }

        .task-text {
            flex: 1;
            margin-right: 10px;
            word-break: break-word;
        }

        .delete-task-btn {
            background: transparent;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h1 style="margin-bottom: 40px; font-size: 32px; letter-spacing: -0.5px;">🎯 FocusSpace</h1>

    <div class="app-container">
        <!-- POMODORO TIMER -->
        <div class="timer-card">
            <div class="mode-selectors">
                <button class="mode-btn active" id="workMode" onclick="setMode('work')">Focus Session</button>
                <button class="mode-btn break-mode" id="breakMode" onclick="setMode('break')">Short Break</button>
            </div>
            <div class="time-display" id="timeDisplay">25:00</div>
            <div class="controls">
                <button class="control-btn" id="startBtn" onclick="toggleTimer()">Start</button>
                <button class="control-btn reset-btn" onclick="resetTimer()">Reset</button>
            </div>
        </div>

        <!-- TASK MANAGER -->
        <div class="task-card">
            <h2>Focus Tasks</h2>
            <div class="task-input-wrapper">
                <input type="text" id="taskInput" placeholder="What are you working on?" maxlength="50">
                <button class="add-task-btn" onclick="addTask()">+</button>
            </div>
            <ul class="task-list" id="taskList">
                <!-- Javascript will insert tasks here -->
            </ul>
        </div>
    </div>

    <script>
        // Timer Variables
        let timer;
        let isRunning = false;
        let currentMode = 'work'; // 'work' or 'break'
        let timeRemaining = 25 * 60; 

        const timeDisplay = document.getElementById('timeDisplay');
        const startBtn = document.getElementById('startBtn');
        const workModeBtn = document.getElementById('workMode');
        const breakModeBtn = document.getElementById('breakMode');
        const taskInput = document.getElementById('taskInput');
        const taskList = document.getElementById('taskList');

        function updateDisplay() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            timeDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timer);
                startBtn.textContent = 'Start';
                startBtn.style.backgroundColor = 'var(--accent-color)';
            } else {
                timer = setInterval(() => {
                    if (timeRemaining > 0) {
                        timeRemaining--;
                        updateDisplay();
                    } else {
                        clearInterval(timer);
                        alert(currentMode === 'work' ? 'Time for a break!' : 'Back to work!');
                        resetTimer();
                    }
                }, 1000);
                startBtn.textContent = 'Pause';
                startBtn.style.backgroundColor = '#e2e8f0';
                startBtn.style.color = '#0f172a';
            }
            isRunning = !isRunning;
        }

        function resetTimer() {
            clearInterval(timer);
            isRunning = false;
            startBtn.textContent = 'Start';
            startBtn.style.backgroundColor = 'var(--accent-color)';
            startBtn.style.color = 'white';
            timeRemaining = currentMode === 'work' ? 25 * 60 : 5 * 60;
            updateDisplay();
        }

        function setMode(mode) {
            currentMode = mode;
            if (mode === 'work') {
                workModeBtn.classList.add('active');
                breakModeBtn.classList.remove('active');
            } else {
                breakModeBtn.classList.add('active');
                workModeBtn.classList.remove('active');
            }
            resetTimer();
        }

        // Task List Functions
        function addTask() {
            const text = taskInput.value.trim();
            if (text === '') return;

            const li = document.createElement('li');
            li.className = 'task-item';
            li.innerHTML = `
                <span class="task-text">${text}</span>
                <button class="delete-task-btn" onclick="this.parentElement.remove()">✕</button>
            `;
            
            taskList.appendChild(li);
            taskInput.value = '';
        }

        // Allow entering tasks with Enter key
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });

        // Setup init display
        updateDisplay();
    </script>
</body>
</html>
