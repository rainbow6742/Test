<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlock to Win</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        input {
            padding: 10px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 6px;
            margin-bottom: 20px;
            width: 200px;
            text-align: center;
        }
        input:focus {
            outline: none;
            border-color: #007bff;
        }
        button {
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #cccccc;
            border: none;
            border-radius: 6px;
            cursor: not-allowed;
            transition: background-color 0.3s;
        }
        button.active {
            background-color: #28a745;
            cursor: pointer;
        }
        #message {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #28a745;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Enter the Code to Win</h2>
    <input type="text" id="codeInput" placeholder="Enter code here..." maxlength="5">
    <br>
    <button id="winButton" disabled>Claim Win</button>
    <div id="message"></div>
</div>

<script>
    const codeInput = document.getElementById('codeInput');
    const winButton = document.getElementById('winButton');
    const message = document.getElementById('message');
    const targetCode = "31718";

    codeInput.addEventListener('input', () => {
        if (codeInput.value === targetCode) {
            winButton.disabled = false;
            winButton.classList.add('active');
        } else {
            winButton.disabled = true;
            winButton.classList.remove('active');
        }
    });

    winButton.addEventListener('click', () => {
        message.textContent = "🎉 Congratulations! You won! 🎉";
    });
</script>

</body>
</html>
