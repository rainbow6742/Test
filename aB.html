<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Roboto, arial, sans-serif;
            font-size: 14px;
            color: #202124;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #ffffff;
        }

        /* Top Header Navigation */
        header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            height: 60px;
            padding: 0 24px;
            gap: 15px;
        }

        header a {
            text-decoration: none;
            color: rgba(0,0,0,0.87);
        }

        header a:hover {
            text-decoration: underline;
        }

        .apps-icon {
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .apps-icon:hover {
            background-color: rgba(60,64,67,0.08);
        }

        .sign-in-btn {
            background-color: #1a73e8;
            color: white !important;
            padding: 9px 23px;
            border-radius: 4px;
            font-weight: 500;
            letter-spacing: .25px;
        }

        .sign-in-btn:hover {
            background-color: #1b66c9;
            text-decoration: none !important;
            box-shadow: 0 1px 2px 0 rgba(66,133,244,0.3), 0 1px 3px 1px rgba(66,133,244,0.15);
        }

        /* Main Branding & Search Area */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 120px;
        }

        .logo {
            font-size: 90px;
            font-weight: 500;
            letter-spacing: -2.5px;
            margin-bottom: 28px;
            user-select: none;
        }

        /* Google original colors */
        .g1 { color: #4285F4; }
        .o1 { color: #EA4335; }
        .o2 { color: #FBBC05; }
        .g2 { color: #4285F4; }
        .l  { color: #34A853; }
        .e  { color: #EA4335; }

        .search-box {
            width: 100%;
            max-width: 584px;
            border: 1px solid #e3e6e8;
            border-radius: 24px;
            height: 46px;
            display: flex;
            align-items: center;
            padding: 0 14px;
            gap: 12px;
            box-shadow: none;
            transition: box-shadow 0.1s, border-color 0.1s;
        }

        .search-box:hover, .search-box:focus-within {
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
            border-color: rgba(223,225,229,0);
        }

        .search-icon {
            fill: #9aa0a6;
            width: 20px;
            height: 20px;
        }

        .search-input {
            flex-grow: 1;
            border: none;
            outline: none;
            font-size: 16px;
            height: 100%;
            color: #202124;
        }

        .mic-icon {
            width: 24px;
            height: 24px;
            cursor: pointer;
        }

        .buttons-container {
            margin-top: 29px;
            display: flex;
            gap: 12px;
        }

        .btn {
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            border-radius: 4px;
            color: #3c4043;
            font-size: 14px;
            padding: 0 16px;
            line-height: 27px;
            height: 36px;
            min-width: 54px;
            text-align: center;
            cursor: pointer;
            user-select: none;
        }

        .btn:hover {
            border: 1px solid #dadce0;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
            color: #202124;
        }

        /* Bottom Footer section */
        footer {
            background-color: #f2f2f2;
            border-top: 1px solid #e4e4e4;
        }

        .location {
            padding: 15px 30px;
            border-bottom: 1px solid #e4e4e4;
            color: rgba(0,0,0,0.54);
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            padding: 0 20px;
        }

        .footer-section {
            display: flex;
            flex-wrap: wrap;
        }

        .footer-links a {
            display: block;
            padding: 15px;
            color: #70757a;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <a href="#">Gmail</a>
        <a href="#">Images</a>
        <div class="apps-icon" title="Google apps">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="#5f6368">
                <path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 12c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 12c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 12c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"></path>
            </svg>
        </div>
        <a href="#" class="sign-in-btn">Sign in</a>
    </header>

    <main>
        <!-- Custom Colored Typography Logo -->
        <div class="logo">
            <span class="g1">G</span><span class="o1">o</span><span class="o2">o</span><span class="g2">g</span><span class="l">l</span><span class="e">e</span>
        </div>

        <!-- Search Bar Frame -->
        <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24">
                <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
            </svg>
            <input type="text" class="search-input" id="searchQuery" autofocus>
            <svg class="mic-icon" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"></path>
                <path fill="#34A853" d="M12 17c-3.14 0-5.64-2.5-5.64-5.64H5c0 3.53 2.61 6.44 6 6.92V21h2v-2.72c3.39-.48 6-3.39 6-6.92h-1.36C17.64 14.5 15.14 17 12 17z"></path>
            </svg>
        </div>

        <div class="buttons-container">
            <button class="btn" onclick="executeSearch()">Google Search</button>
            <button class="btn" onclick="feelingLucky()">I'm Feeling Lucky</button>
        </div>
    </main>

    <footer>
        <div class="location">United States</div>
        <div class="footer-links">
            <div class="footer-section">
                <a href="#">About</a>
                <a href="#">Advertising</a>
                <a href="#">Business</a>
                <a href="#">How Search works</a>
            </div>
            <div class="footer-section">
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Settings</a>
            </div>
        </div>
    </footer>

    <script>
        const queryInput = document.getElementById('searchQuery');

        // Handles passing the input query over to the real engine
        function executeSearch() {
            const query = queryInput.value.trim();
            if (query) {
                window.location.href = `https://google.com{encodeURIComponent(query)}`;
            }
        }

        function feelingLucky() {
            const query = queryInput.value.trim();
            if (query) {
                window.location.href = `https://google.com{encodeURIComponent(query)}&btnI=I`;
            } else {
                window.location.href = "https://doodles.google";
            }
        }

        // Trigger search on pressing Enter
        queryInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                executeSearch();
            }
        });
    </script>
</body>
</html>
