<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM LOCKED</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #050000; color: #ff3333;
            font-family: 'Courier New', Courier, monospace;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            overflow: hidden; user-select: none;
        }
        #container { text-align: center; max-width: 600px; padding: 20px; }
        h1 { font-size: 3rem; margin-bottom: 10px; text-shadow: 0 0 10px #ff0000; animation: blink 1.5s infinite; }
        p { font-size: 1.2rem; color: #ff8888; margin-bottom: 30px; }
        .input-hint { font-size: 0.9rem; color: #441111; letter-spacing: 2px; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body>

    <div id="container">
        <h1>ACCESS DENIED</h1>
        <p>This terminal has been locked down.<br>You cannot close or leave this screen normally.</p>
        <div class="input-hint">AWAITING CREDENTIALS...</div>
    </div>

    <script>
        let inputBuffer = "";
        const targetCode = "31718";
        let isLocked = true;

        // 1. Trap keypresses anywhere on the document to listen for the unlock sequence
        document.addEventListener('keydown', (e) => {
            if (!isLocked) return;

            // Block common escape/functional keys that could close overlays
            if (e.key === "Escape" || e.key === "F11") {
                e.preventDefault();
            }

            // Append standard numeric characters to our validation buffer
            if (/^\d\$/.test(e.key)) {
                inputBuffer += e.key;
                
                // Keep the running buffer short to prevent accidental spillover strings
                if (inputBuffer.length > targetCode.length) {
                    inputBuffer = inputBuffer.substring(inputBuffer.length - targetCode.length);
                }

                // Verify check
                if (inputBuffer === targetCode) {
                    unlockScreen();
                }
            }
        });

        // 2. Annoy the user if they try to click anywhere on the page
        document.addEventListener('click', () => {
            if (isLocked) {
                alert("🔒 TERMINAL SECURED. Type the 5-digit bypass code to release.");
            }
        });

        // 3. Trigger the standard browser exit warnings if they try to reload or navigate away
        window.addEventListener('beforeunload', (e) => {
            if (isLocked) {
                e.preventDefault();
                e.returnValue = "Are you sure you want to leave?";
            }
        });

        function unlockScreen() {
            isLocked = false;
            document.body.style.backgroundColor = "#001100";
            document.body.style.color = "#33ff33";
            document.getElementById('container').innerHTML = `
                <h1 style="text-shadow: 0 0 10px #00ff00; animation: none;">ACCESS GRANTED</h1>
                <p style="color: #88ff88;">Bypass accepted. Restrictions lifted. You may now close this tab safely.</p>
            `;
        }
    </script>
</body>
</html>
