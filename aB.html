<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Video Generator</title>
    <style>
        body { background: #050510; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        canvas { border-radius: 8px; box-shadow: 0 0 20px rgba(0,255,255,0.2); }
        button { margin-top: 20px; padding: 12px 24px; font-size: 16px; background: #00ffff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; display: none; }
        button:hover { background: #00cccc; }
        #status { font-size: 18px; margin-bottom: 10px; color: #00ffff; }
    </style>
</head>
<body>

    <div id="status">Generating Video (5 Seconds)...</div>
    <canvas id="canvas" width="640" height="360"></canvas>
    <button id="downloadBtn">Download Video (.webm)</button>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusText = document.getElementById('status');

        const FPS = 30;
        const DURATION = 5; // 5-second video length
        const TOTAL_FRAMES = FPS * DURATION;
        
        let currentFrame = 0;
        let recordedChunks = [];
        
        // Setup MediaRecorder to capture the canvas stream natively
        const stream = canvas.captureStream(FPS);
        const mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });

        mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            downloadBtn.style.display = 'block';
            downloadBtn.onclick = () => {
                const a = document.createElement('a');
                a.href = url;
                a.download = 'html_generated_video.webm';
                a.click();
            };
            statusText.innerText = "Video Ready!";
        };

        // Render loop for creating the procedural content frame-by-frame
        function renderVideoFrame() {
            if (currentFrame >= TOTAL_FRAMES) {
                mediaRecorder.stop();
                return;
            }

            // Progress tracking variables
            let progress = currentFrame / TOTAL_FRAMES;
            let time = currentFrame / FPS;

            // Frame Background
            ctx.fillStyle = '#0a0518';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Ambient background particles
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            for(let i=0; i<30; i++) {
                let x = (Math.sin(i + time) * 0.5 + 0.5) * canvas.width;
                let y = ((i * 15 + time * 50) % canvas.height);
                ctx.fillRect(x, y, 2, 2);
            }

            // Animated Geometric Star (Centerpiece)
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(time * 1.5);

            let lines = 12;
            for (let i = 0; i < lines; i++) {
                ctx.rotate((Math.PI * 2) / lines);
                let length = 80 + Math.sin(time * 5 + i) * 30;
                
                // Neon glowing properties
                ctx.strokeStyle = `hsl(${(time * 50 + i * 20) % 360}, 100%, 60%)`;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(length, 0);
                ctx.stroke();
            }
            ctx.restore();

            // Overlay Cinematic Timecode text
            ctx.fillStyle = '#00ffff';
            ctx.font = '16px monospace';
            ctx.fillText(`TIME: 00:0${time.toFixed(2)} / 00:05.00`, 20, 340);
            ctx.fillText(`FRAME: ${currentFrame} / ${TOTAL_FRAMES}`, 450, 340);

            currentFrame++;
            requestAnimationFrame(renderVideoFrame);
        }

        // Start recording and processing
        mediaRecorder.start();
        renderVideoFrame();
    </script>
</body>
</html>
