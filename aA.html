<!DOCTYPE html><html><body style="margin:0;overflow:hidden;background:#111;font-family:sans-serif;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;">
<div id="auth" style="background:#222;padding:25px;border-radius:8px;text-align:center;width:280px;position:absolute;z-index:20;">
    <h2 id="auth-title">Log In</h2>
    <input id="usr" placeholder="User" style="width:90%;margin:5px;padding:8px;background:#333;color:#fff;border:none;">
    <input id="pwd" type="password" placeholder="Pass (4+)" style="width:90%;margin:5px;padding:8px;background:#333;color:#fff;border:none;">
    <button id="submit-btn" onclick="submitAuth()" style="width:95%;margin:5px;padding:8px;background:#0fcc;border:none;font-weight:bold;cursor:pointer;border-radius:4px;">Enter Arena</button>
    <div style="margin-top:15px;font-size:13px;color:#aaa;">
        <span id="switch-text">Don't have an account?</span> 
        <a id="switch-link" href="#" onclick="toggleAuthMode(event)" style="color:#0fcc;text-decoration:none;font-weight:bold;">Sign Up</a>
    </div>
    <p id="err" style="color:#f55;font-size:12px;margin-top:5px;"></p>
</div>

<div id="menu" style="display:none;background:rgba(34,34,34,0.95);padding:20px;border-radius:8px;text-align:center;position:absolute;z-index:10;width:300px;max-height:90vh;overflow-y:auto;">
    <h2>Menu</h2><p id="m-hi" style="color:#0fcc;margin:5px 0;"></p>
    <label style="cursor:pointer;"><input type="checkbox" id="ai-on" checked> Enable AI Bot</label>
    
    <h3 style="margin:15px 0 5px 0;border-top:1px solid #444;padding-top:10px;color:#0fcc;">Cosmetic Shop</h3>
    <div id="shop-items" style="display:flex;flex-direction:column;gap:5px;margin-bottom:15px;"></div>

    <button onclick="toggleM()" style="width:100%;padding:8px;background:#0fcc;border:none;font-weight:bold;cursor:pointer;margin-bottom:5px;">Resume</button>
    <button onclick="signOut()" style="width:100%;padding:8px;background:#f55;border:none;color:#fff;cursor:pointer;">Sign Out</button>
</div>
<canvas id="c" style="display:none;position:absolute;top:0;left:0;"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),authDiv=document.getElementById('auth'),menuDiv=document.getElementById('menu'),err=document.getElementById('err'),aiOn=document.getElementById('ai-on'),shopDiv=document.getElementById('shop-items');
let px=0,py=0,score=0,currentUsr='',keys={},targets=[],bullets=[],hue=0,ai={x:100,y:-100,s:0,cd:0},isLoginMode=true;
let playerColor='#0fcc', unlockedItems=['#0fcc'], bgStyle='none', starField=[];

const shopInventory=[
    {name:'Cyan Core (Skin)',type:'col',id:'#0fcc',cost:0},
    {name:'Lime Laser (Skin)',type:'col',id:'#0f0',cost:200},
    {name:'Purple Plasma (Skin)',type:'col',id:'#b0f',cost:400},
    {name:'Pink Pixels (Skin)',type:'col',id:'#f0f',cost:800},
    {name:'Space Theme (BG)',type:'bg',id:'space',cost:2000}
];

const res=()=>{c.width=window.innerWidth;c.height=window.innerHeight;};window.onresize=res;res();

// Populate a static background pattern for the Space theme map space
for(let i=0; i<150; i++) {
    starField.push({x: (Math.random() - 0.5) * 3000, y: (Math.random() - 0.5) * 3000, r: Math.random() * 2 + 0.5});
}

function toggleAuthMode(e) {
    if(e) e.preventDefault();
    isLoginMode = !isLoginMode;
    document.getElementById('auth-title').textContent = isLoginMode ? "Log In" : "Sign Up";
    document.getElementById('switch-text').textContent = isLoginMode ? "Don't have an account?" : "Already have an account?";
    document.getElementById('switch-link').textContent = isLoginMode ? "Sign Up" : "Log In";
    err.textContent = '';
}

function submitAuth(){
    let u=document.getElementById('usr').value.trim(),p=document.getElementById('pwd').value,st=localStorage.getItem('g_'+u);
    if(!u||p.length<4){err.textContent="4+ chars required!";return;}
    if(isLoginMode){
        if(!st){err.textContent="Account does not exist!";return;}
        let user=JSON.parse(st);if(user.pwd !== p){err.textContent="Wrong password!";return;}
        score=user.hi||0;playerColor=user.col||'#0fcc';bgStyle=user.bg||'none';unlockedItems=user.owns||['#0fcc'];
    }else{
        if(st){err.textContent="Username already taken!";return;}
        localStorage.setItem('g_'+u,JSON.stringify({pwd:p,hi:0,col:'#0fcc',bg:'none',owns:['#0fcc']}));
        score=0;playerColor='#0fcc';bgStyle='none';unlockedItems=['#0fcc'];
    }
    currentUsr=u;authDiv.style.display='none';c.style.display='block';toggleM();
}

function renderShop(){
    shopDiv.innerHTML='';
    shopInventory.forEach(item=>{
        let btn=document.createElement('button');
        btn.style.width='100%';btn.style.padding='6px';btn.style.border='none';btn.style.borderRadius='4px';btn.style.cursor='pointer';btn.style.fontWeight='bold';
        
        let isEquipped = (item.type === 'col' && playerColor === item.id) || (item.type === 'bg' && bgStyle === item.id);
        
        if(isEquipped){
            btn.textContent=`${item.name} (Equipped)`;btn.style.background=item.type==='col'?item.id:'#444';btn.style.color=item.type==='col'?'#111':'#0fcc';
        }else if(unlockedItems.includes(item.id)){
            btn.textContent=`Equip ${item.name}`;btn.style.background='#555';btn.style.color='#fff';
            btn.onclick=()=>{if(item.type==='col')playerColor=item.id;else bgStyle=item.id;saveProgress();renderShop();};
        }else{
            btn.textContent=`Buy ${item.name} (${item.cost} pts)`;btn.style.background='#333';btn.style.color='#aaa';
            if(score>=item.cost){
                btn.style.color='#fff';btn.style.border=`1px solid ${item.type==='col'?item.id:'#0fcc'}`;
                btn.onclick=()=>{score-=item.cost;unlockedItems.push(item.id);if(item.type==='col')playerColor=item.id;else bgStyle=item.id;saveProgress();renderShop();};
            }
        }
        shopDiv.appendChild(btn);
    });
}

function toggleM(){
    if(menuDiv.style.display==='block'){menuDiv.style.display='none';c.requestPointerLock();}
    else {document.exitPointerLock();document.getElementById('m-hi').textContent=`Points Available: ${score}`;renderShop();menuDiv.style.display='block';}
}
function signOut(){
    currentUsr='';menuDiv.style.display='none';c.style.display='none';authDiv.style.display='block';
    isLoginMode=true;toggleAuthMode();
    document.getElementById('usr').value='';document.getElementById('pwd').value='';err.textContent='';
}
document.addEventListener('pointerlockchange',()=>{if(document.pointerLockElement!==c&&currentUsr&&menuDiv.style.display==='none')toggleM();});
window.onclick=()=>{if(currentUsr&&menuDiv.style.display==='none')c.requestPointerLock();};
document.onmousemove=(e)=>{if(document.pointerLockElement===c){px+=e.movementX;py+=e.movementY;}};
document.onkeydown=(e)=>{keys[e.key.toLowerCase()]=true;if(e.key==='Escape'&&currentUsr)toggleM();};
document.onkeyup=(e)=>{keys[e.key.toLowerCase()]=false;};
window.onkeypress=(e)=>{
    if(!currentUsr||document.pointerLockElement!==c)return;
    if(e.key===' '){px+=(keys.d?2:keys.a?-2:0)*50;py+=(keys.s?2:keys.w?-2:0)*50;}
    if(e.key.toLowerCase()==='e')bullets.push({x:c.width/2,y:c.height/2,r:60,life:5,o:'p'});
};
window.onmousedown=()=>{if(currentUsr&&document.pointerLockElement===c)bullets.push({x:c.width/2,y:c.height/2,r:6,vy:-8,o:'p'});};

setInterval(()=>{
    if(!currentUsr||menuDiv.style.display==='block')return;
    targets.push({x:px+c.width/2+(Math.random()-0.5)*1000,y:py+c.height/2+(Math.random()-0.5)*1000,t:'n'});
    if(Math.random()<0.01)targets.push({x:px+c.width/2+(Math.random()-0.5)*600,y:py+c.height/2+(Math.random()-0.5)*600,t:'r'});
},1000);

function saveProgress() {
    let user = JSON.parse(localStorage.getItem('g_'+currentUsr)) || {};
    user.hi = Math.max(user.hi||0, score);user.col = playerColor;user.bg = bgStyle;user.owns = unlockedItems;
    localStorage.setItem('g_'+currentUsr, JSON.stringify(user));
}

function loop(){
    if(currentUsr&&menuDiv.style.display==='none'){
        ctx.fillStyle='rgba(17,17,17,0.3)';ctx.fillRect(0,0,c.width,c.height);hue=(hue+2)%360;
        let cx=c.width/2,cy=c.height/2;
        if(keys.w) py-=5; if(keys.s) py+=5; if(keys.a) px-=5; if(keys.d) px+=5;

        // Render Space Background Stars if activated
        if(bgStyle === 'space'){
            ctx.fillStyle = '#fff';
            starField.forEach(s => {
                let sx = ((s.x - px) % 3000 + 3000) % 3000 - 1500 + cx;
                let sy = ((s.y - py) % 3000 + 3000) % 3000 - 1500 + cy;
                ctx.beginPath(); ctx.arc(sx, sy, s.r, 0, 7); ctx.fill();
            });
        }

        if(aiOn.checked&&targets.length>0){
            let close=targets.reduce((a,b)=>Math.hypot(a.x-ai.x,a.y-ai.y)<Math.hypot(b.x-ai.x,b.y-ai.y)?a:b);
            let ang=Math.atan2(close.y-ai.y,close.x-ai.x);ai.x+=Math.cos(ang)*3.5;ai.y+=Math.sin(ang)*3.5;
            if(ai.cd--<=0){bullets.push({x:ai.x-px,y:ai.y-py,r:6,vy:-8,o:'a'});ai.cd=20;}
            ctx.fillStyle='#fa0';ctx.beginPath();ctx.arc(ai.x-px,ai.y-py,8,0,7);ctx.fill();
        }

        bullets.forEach((b,bi)=>{
            b.y+=b.vy||0;if(b.life)b.life--;ctx.fillStyle=b.o==='a'?'#fa0':(b.life?'rgba(0,255,200,0.4)':playerColor);
            ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();if(b.y<0||b.life===0)bullets.splice(bi,1);
        });

        targets.forEach((t,ti)=>{
            let sx=t.x-px,sy=t.y-py,dp=Math.hypot(sx-cx,sy-cy),da=Math.hypot(sx-(ai.x-px),sy-(ai.y-py));
            let pts=t.t==='r'?100:10;
            if(dp<20){targets.splice(ti,1);score+=pts;saveProgress();return;}
            if(aiOn.checked&&da<20){targets.splice(ti,1);ai.s+=pts;return;}

            ctx.fillStyle=t.t==='r'?`hsl(${hue},100%,60%)` : '#f55';ctx.beginPath();ctx.arc(sx,sy,t.t==='r'?22:15,0,7);ctx.fill();
            bullets.forEach((b,bi)=>{
                if(Math.hypot(sx-b.x,sy-b.y)<(b.r+(t.t==='r'?22:15))){
targets.splice(ti,1);if(!b.life)bullets.splice(bi,1);
if(b.o==='p'){score+=pts;saveProgress();}else{ai.s+=pts;}
}
});
});
ctx.fillStyle=playerColor;ctx.beginPath();ctx.arc(cx,cy,8,0,7);ctx.fill();
ctx.strokeStyle=playerColor;ctx.lineWidth=2;
ctx.beginPath();ctx.moveTo(cx-15, cy);ctx.lineTo(cx+15, cy);ctx.moveTo(cx, cy-15); ctx.lineTo(cx, cy+15); ctx.stroke();
ctx.fillStyle='#fff';ctx.font='18px sans-serif';ctx.fillText(You: ${score},20,40);
if(aiOn.checked){ctx.fillStyle='#fa0';ctx.fillText(AI: ${ai.s},20,65);}
}
requestAnimationFrame(loop);
}
loop();
