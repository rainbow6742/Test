<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab Controller Pro</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            background: #2d2d2d;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
        }
        h2 {
            margin-top: 0;
            color: #e0e0e0;
        }
        p {
            color: #aaaaaa;
            margin-bottom: 30px;
        }
        .control-row {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 15px;
        }
        button {
            flex: 1;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        button:hover {
            filter: brightness(1.2);
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-launch {
            background-color: #28a745;
        }
        .btn-close {
            background-color: #dc3545;
        }
        .btn-demon-launch {
            background-color: #660000;
            border: 1px solid #ff3333;
        }
        .btn-demon-close {
            background-color: #330000;
            border: 1px solid #ff3333;
        }
        .btn-master-close {
            background-color: #111111;
            border: 2px dashed #dc3545;
            margin-top: 15px;
            width: 100%;
            flex: none;
        }
        .demon-icon {
            width: 20px;
            height: 20px;
            fill: #ff3333;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Tab Controller Pro</h2>
    <p>Select a tier to launch or terminate multiple browser tabs instantly.</p>
    
    <!-- 10 Tabs Row -->
    <div class="control-row">
        <button class="btn-launch" onclick="spawnTabs(10)">Launch 10 Tabs</button>
        <button class="btn-close" onclick="closeTabs(10)">Close 10 Tabs</button>
    </div>

    <!-- 20 Tabs Row -->
    <div class="control-row">
        <button class="btn-launch" onclick="spawnTabs(20)">Launch 20 Tabs</button>
        <button class="btn-close" onclick="closeTabs(20)">Delete 20 Tabs</button>
    </div>

    <!-- 30 Tabs Row (Demon Tier) -->
    <div class="control-row">
        <button class="btn-demon-launch" onclick="spawnTabs(30)">
            <svg class="demon-icon" viewBox="0 0 24 24">
                <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A2,2 0 0,1 14,6A2,2 0 0,1 12,8A2,2 0 0,1 10,6A2,2 0 0,1 12,4M7,9E1,1 0 0,1 8,10A1,1 0 0,1 7,11A1,1 0 0,1 6,10A1,1 0 0,1 7,9M17,9A1,1 0 0,1 18,10A1,1 0 0,1 17,11A1,1 0 0,1 16,10A1,1 0 0,1 17,9M12,13C14.75,13 17,14.56 17,16.5C17,18.44 14.75,20 12,20C9.25,20 7,18.44 7,16.5C7,14.56 9.25,13 12,13Z"/>
            </svg>
            Launch 30 Tabs
        </button>
        <button class="btn-demon-close" onclick="closeTabs(30)">
            <svg class="demon-icon" viewBox="0 0 24 24">
                <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A2,2 0 0,1 14,6A2,2 0 0,1 12,8A2,2 0 0,1 10,6A2,2 0 0,1 12,4M7,9E1,1 0 0,1 8,10A1,1 0 0,1 7,11A1,1 0 0,1 6,10A1,1 0 0,1 7,9M17,9A1,1 0 0,1 18,10A1,1 0 0,1 17,11A1,1 0 0,1 16,10A1,1 0 0,1 17,9M12,13C14.75,13 17,14.56 17,16.5C17,18.44 14.75,20 12,20C9.25,20 7,18.44 7,16.5C7,14.56 9.25,13 12,13Z"/>
            </svg>
            Close 30 Tabs
        </button>
    </div>

    <!-- Master Close Action -->
    <button class="btn-master-close" onclick="masterClose()">⚠️ MASTER CLOSE ALL TABS</button>
</div>

<script>
// Track references across all potential tiers
let tabRegistry = {
    10: [],
    20: [],
    30: []
};

// FIX: Changed target from an external site to a blank origin page to retain closure privileges
const targetUrl = "about:blank";

function spawnTabs(count) {
    closeTabs(count);

    for (let i = 0; i < count; i++) {
        const newTab = window.open(targetUrl, '_blank');
        if (newTab) {
            // Write a simple message into the newly spawned tab so it isn't completely empty
            try {
                newTab.document.write(`
                    <html style="background:#111; color:#fff; font-family:sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;">
                        <h1>Spawned Tab #${i+1}</h1>
                    </html>
                `);
            } catch(e) {
                // Fail silently if browser blocks writing access
            }
            tabRegistry[count].push(newTab);
        }
    }
}

function closeTabs(count) {
    tabRegistry[count].forEach(tab => {
        if (tab && !tab.closed) {
            tab.close();
        }
    });
    tabRegistry[count] = [];
}

function masterClose() {
    Object.keys(tabRegistry).forEach(tier => {
        closeTabs(tier);
    });
}
</script>

</body>
</html>
