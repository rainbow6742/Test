<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .container {
            text-align: center;
            padding: 30px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        .warning {
            color: #dc3545;
            font-size: 14px;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Auto Tab Spawner</h2>
    <p>This page is attempting to open 20 tabs automatically.</p>
    <div class="warning">
        ⚠️ Check your address bar! Modern browsers will completely block this automated action until you manually allow pop-ups for this page.
    </div>
</div>

<script>
// window.onload triggers the function instantly when the page finishes loading
window.onload = function() {
    const targetUrl = "https://google.com"; 
    
    for (let i = 0; i < 20; i++) {
        window.open(targetUrl, '_blank');
    }
};
</script>

</body>
</html>
