<!DOCTYPE html><html><body style="margin:0;overflow:hidden;background:#111;font-family:sans-serif;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;">
<div style="position:absolute;top:15px;left:15px;z-index:10;pointer-events:none;background:rgba(0,0,0,0.5);padding:10px;border-radius:6px;">
    <div style="font-size:18px;font-weight:bold;color:#ff3366;">Mega-Hard Obby (Web Edition)</div>
    <div style="font-size:13px;margin-top:4px;color:#eee;">Checkpoint Status: <span id="chk" style="color:#0fcc;font-weight:bold;">Not Saved</span></div>
    <input id="chat" placeholder="Type commands here..." style="margin-top:8px;pointer-events:auto;background:#222;color:#fff;border:1px solid #555;padding:4px;border-radius:4px;width:160px;">
</div>
<div id="msg" style="display:none;position:absolute;z-index:20;background:rgba(20,20,20,0.95);padding:25px;border-radius:10px;text-align:center;border:2px solid #ff3366;box-shadow:0 0 15px rgba(255,51,102,0.4);width:280px;">
    <h2 id="m-tit" style="margin:0 0 10px 0;color:#ff3366;">GODLIKE CONQUEROR!</h2><p id="m-desc" style="margin:0 0 15px 0;font-size:13px;color:#ddd;">You survived the ultra-long path and claimed the golden trophy!</p>
    <button onclick="restartObby()" style="padding:6px 20px;background:#ff3366;border:none;font-weight:bold;cursor:pointer;border-radius:4px;color:#fff;">Play Again</button>
</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),chat=document.getElementById('chat'),msg=document.getElementById('msg');
let keys={},px=50,py=200,pw=20,ph=20,g=0.28,vy=0,isG=false,active=true,tick=0,hasCheckpoint=false,isFlying=false;
let respawnX=50,respawnY=200;
const plat=[
    //Type secret code 31718 to fly
    {x:20,y:260,w:100,h:20,t:'spawn'},
    {x:160,y:230,w:45,h:15},{x:255,y:200,w:45,h:15},{x:350,y:230,w:45,h:15},
    {x:445,y:250,w:40,h:15,t:'plat'},{x:450,y:240,w:30,h:10,t:'lava'},{x:535,y:210,w:45,h:15},
    {x:625,y:250,w:40,h:15,t:'plat'},{x:630,y:240,w:30,h:10,t:'lava'},{x:715,y:210,w:45,h:15},
    {x:810,y:240,w:40,h:15,t:'move',mx:25,baseX:810},{x:925,y:200,w:40,h:15,t:'move',mx:-25,baseX:925},
    {x:1030,y:240,w:50,h:15,t:'rainbow',state:'idle',timer:0},{x:1130,y:210,w:50,h:15,t:'rainbow',state:'idle',timer:0},{x:1230,y:240,w:50,h:15,t:'rainbow',state:'idle',timer:0},
    {x:1330,y:260,w:120,h:20,t:'checkpoint'},
    {x:1495,y:230,w:40,h:15},{x:1585,y:255,w:40,h:15,t:'plat'},{x:1590,y:245,w:30,h:10,t:'lava'},{x:1675,y:210,w:40,h:15},
    {x:1765,y:255,w:40,h:15,t:'plat'},{x:1770,y:245,w:30,h:10,t:'lava'},
    {x:1855,y:230,w:40,h:15},{x:1945,y:190,w:40,h:15},{x:2035,y:240,w:40,h:15},
    {x:2125,y:240,w:35,h:15,t:'rainbow',state:'idle',timer:0},{x:2210,y:200,w:35,h:15,t:'rainbow',state:'idle',timer:0},{x:2295,y:240,w:35,h:15,t:'rainbow',state:'idle',timer:0},
    {x:2385,y:240,w:40,h:15,t:'move',mx:35,baseX:2385},{x:2505,y:200,w:40,h:15,t:'move',mx:-35,baseX:2505},
    {x:2625,y:250,w:60,h:15,t:'plat'},{x:2675,y:240,w:10,h:10,t:'lava'},{x:2735,y:220,w:60,h:15,t:'plat'},{x:2785,y:210,w:10,h:10,t:'lava'},{x:2845,y:190,w:60,h:15,t:'plat'},{x:2895,y:180,w:10,h:10,t:'lava'},
    {x:2955,y:240,w:40,h:15,t:'rainbow',state:'idle',timer:0},{x:3045,y:200,w:40,h:15,t:'rainbow',state:'idle',timer:0},{x:3135,y:240,w:40,h:15,t:'rainbow',state:'idle',timer:0},
    {x:3225,y:230,w:35,h:15},{x:3310,y:210,w:35,h:15},{x:3395,y:190,w:35,h:15},{x:3480,y:255,w:100,h:20,t:'plat'},{x:3485,y:245,w:90,h:10,t:'lava'},
    {x:3620,y:240,w:40,h:15,t:'move',mx:30,baseX:3620},{x:3740,y:210,w:40,h:15,t:'move',mx:-30,baseX:3740},
    {x:3850,y:240,w:40,h:15,t:'rainbow',state:'idle',timer:0},{x:3940,y:220,w:40,h:15,t:'rainbow',state:'idle',timer:0},{x:4030,y:200,w:40,h:15,t:'rainbow',state:'idle',timer:0},
    {x:4125,y:240,w:40,h:15,t:'move',mx:45,baseX:4125},{x:4270,y:240,w:100,h:20,t:'goal'}
];
const items=[{x:4310,y:200,w:20,h:40,t:'trophy',c:'#ffd700'}];
const boxColl=(b1,b2)=>b1.x<b2.x+b2.w&&b1.x+b1.w>b2.x&&b1.y<b2.y+b2.h&&b1.y+b1.h>b2.y;
const killPlayer=()=>{
    px=respawnX;py=respawnY;vy=0;isG=false;
    plat.forEach(p=>{if(p.t==='rainbow'){p.state='idle';p.timer=0;}});
};
const restartObby=()=>{
    hasCheckpoint=false;isFlying=false;respawnX=50;respawnY=200;killPlayer();msg.style.display='none';active=true;
    document.getElementById('chk').textContent="Not Saved";document.getElementById('chk').style.color="#ff3366";
};
const res=()=>{c.width=window.innerWidth;c.height=window.innerHeight;};window.onresize=res;res();
window.onkeydown=(e)=>{
    keys[e.key.toLowerCase()]=true;
    if(e.key==='Enter'&&document.activeElement===chat){
        let v=chat.value.trim().toLowerCase();
        if(v==='/reset')killPlayer();
        if(v==='31718'){isFlying=!isFlying;vy=0;}
        if(v==='/skip'){
            let cp=plat.find(p=>p.t==='checkpoint');
            if(!hasCheckpoint){respawnX=cp.x+40;respawnY=cp.y-40;hasCheckpoint=true;killPlayer();}
            else{respawnX=4280;respawnY=200;killPlayer();}
        }
        chat.value='';chat.blur();
    }
};
window.onkeyup=(e)=>{keys[e.key.toLowerCase()]=false;};
function loop(){
    ctx.fillStyle='#111';ctx.fillRect(0,0,c.width,c.height);ctx.save();ctx.translate(c.width/2-px,c.height/2-py);
    tick+=0.04;
    plat.forEach(p=>{
        if(p.t==='move'){let lastX=p.x;p.x=p.baseX+Math.sin(tick)*p.mx;p.vx=p.x-lastX;}
        if(p.t==='rainbow'){
            if(p.state==='stepped'){p.timer++;if(p.timer>=90){p.state='gone';p.timer=0;}}
            else if(p.state==='gone'){p.timer++;if(p.timer>=480){p.state='idle';p.timer=0;}}
            ctx.fillStyle=p.state==='idle'?`hsla(${tick*30+p.x},100%,60%,1)`:p.state==='stepped'?`hsla(${tick*30+p.x},100%,45%,${1-(p.timer/90)})` : 'rgba(0,0,0,0)';
        }else{ctx.fillStyle=p.t==='spawn'?'#0c8':p.t==='checkpoint'?'#0bc':p.t==='lava'?'#f33':p.t==='goal'?'#ffd700':'#555';}
        if(p.t!=='rainbow'||p.state!=='gone')ctx.fillRect(p.x,p.y,p.w,p.h);
        if(p.t==='checkpoint'||p.t==='spawn'||p.t==='goal'){ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(p.x,p.y-4,p.w,4);}
    });
    items.forEach(i=>{ctx.fillStyle=i.c;ctx.fillRect(i.x,i.y,i.w,i.h);});
    ctx.fillStyle=isFlying?'#0fcc':'#ff3366';ctx.fillRect(px,py,pw,ph);
    if(active){
        if(keys['a']||keys['arrowleft'])px-=3.2;if(keys['d']||keys['arrowright'])px+=3.2;
        if(isFlying){if(keys['w']||keys['arrowup'])py-=3.5;if(keys['s']||keys['arrowdown'])py+=3.5;}
        else{if((keys['w']||keys[' '||keys['arrowup']])&&isG){vy=-6.8;isG=false;}vy+=g;py+=vy;}
        let onPlatform=false;
        plat.forEach(p=>{
            if(p.t==='lava'&&boxColl({x:px,y:py,w:pw,h:ph},p)){killPlayer();return;}
            let collides=px+pw>p.x+4&&px<p.x+p.w-4&&py+ph>=p.y&&py+ph-vy<=p.y+6;
            if(p.t==='rainbow'&&p.state==='gone')collides=false;
            if(!isFlying&&p.t!=='lava'&&collides){
                py=p.y-ph;vy=0;isG=true;onPlatform=true;
                if(p.t==='move')px+=p.vx;if(p.t==='rainbow'&&p.state==='idle')p.state='stepped';
                if(p.t==='checkpoint'&&!hasCheckpoint){hasCheckpoint=true;respawnX=p.x+p.w/2-pw/2;respawnY=p.y-ph-10;document.getElementById('chk').textContent="SAVED!";document.getElementById('chk').style.color="#0fcc";}
            }
        });
        if(!onPlatform&&!isFlying)isG=false;
        items.forEach(i=>{if(boxColl({x:px,y:py,w:pw,h:ph},i)&&i.t==='trophy'){msg.style.display='block';active=false;}});
        if(py>500)killPlayer();
    }ctx.restore();requestAnimationFrame(loop);
}loop();
</script></body></html>
