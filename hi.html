                window.speechSynthesis.speak(utterance);

        clickBtn.addEventListener('click', () => {

            landingScreen.style.display = 'none';
            layout.style.visibility = 'visible';

            // Snap browser into Fullscreen
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();

                mapFrame.style.display = 'block';

        // 5. Timer logic with custom 20-second reveal trigger
        function startCountdown() {
            let secondsLeft = 60;
            const timer = setInterval(() => {

                countdownEl.textContent = `00:${displaySec}${secondsLeft}`;
                
                if (secondsLeft === 20) {
                    revealPrank();
                }

                if (secondsLeft <= 0) {
                    clearInterval(timer);
                }
            }, 1000);
        }

        function revealPrank() {
            banner.style.display = 'block';
            document.body.style.background = "#1a0000";

            speakRansom("Relax, you are being pranked. Look at the bottom of the screen. Your files are completely safe.");

            { text: "[!] WARNING: DELETION TIMEOUT ENGAGED. Files will be wiped permanently on timer expiration.", type: "warning", delay: 800 }
        ];

runNextLog();
}
function runNextLog() {
if (index < logs.length) {
let current = logs[index];
let lineText = current.text.replace("{IP}", ipAddress).replace("{LOC}", locationStr);
