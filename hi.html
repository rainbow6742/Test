<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
    <style>
        body, html { margin:0; padding:0; background:#050505; color:#00ff33; font-family:monospace; height:100%; overflow:hidden; user-select:none; }
        #gate { position:fixed; top:0; left:0; width:100%; height:100%; background:#fff; display:flex; align-items:center; justify-content:center; z-index:999; }
        #btn { padding:15px 30px; font-size:18px; font-weight:bold; color:#fff; background:#007bff; border:none; border-radius:5px; cursor:pointer; }
        #main { display:flex; height:100%; width:100%; }
        #term { flex:1; padding:20px; font-size:15px; line-height:1.5; white-space:pre-wrap; overflow-y:auto; position:relative; }
        #side { width:320px; background:#0a0a0a; padding:20px; display:flex; flex-direction:column; gap:20px; border-left:1px solid #222; }
        #box { border:2px solid #f33; padding:15px; text-align:center; background:rgba(255,0,0,0.05); }
        #time { font-size:36px; color:#f33; font-weight:bold; margin-top:10px; }
        #map { width:100%; height:220px; background:#111; border:2px solid #f33; }
        
        /* Popups & BSOD Styles */
        .fake-pop { position:absolute; width:220px; background:#1a0000; border:2px solid #f33; color:#f33; font-weight:bold; box-shadow:0 0 10px rgba(255,0,0,0.5); z-index:10; }
        .pop-hdr { background:#f33; color:#000; padding:4px 8px; display:flex; justify-content:space-between; align-items:center; font-size:12px; }
        .pop-body { padding:15px 10px; text-align:center; }
        .pop-close { cursor:pointer; font-weight:bold; background:#000; color:#f33; border:1px solid #f33; padding:0 5px; font-size:11px; }
        
        /* Changed to subtle opacity/overlays so the chaos behind stays visible */
        #bsod { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0, 120, 215, 0.95); color:#fff; font-family:'Segoe UI',Arial,sans-serif; padding:10% ; box-sizing:border-box; z-index:100; }
        
        /* Rickroll Screen overlay */
        #rick { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0, 0, 0, 0.9); color:#ff3399; font-size:40px; font-weight:bold; text-align:center; justify-content:center; align-items:center; flex-direction:column; z-index:101; }
        .dance { font-size:80px; animation: bounce 0.5s infinite alternate; margin-top:20px; }
        @keyframes bounce { from { transform: scale(0.8); } to { transform: scale(1.2); } }
    </style>
</head>
<body>
    <div id="gate"><button id="btn">Click here to continue</button></div>
    
    <div id="main">
        <div id="term">Initializing core protocol...</div>
        <div id="side">
            <div id="box"><b style="color:#f33">TIME REMAINING</b><div id="time">01:00</div></div>
            <iframe id="map" style="display:none; border:none;"></iframe>
        </div>
    </div>

    <div id="bsod">
        <div style="font-size:100px;">:(</div>
        <h1 style="font-weight:300; font-size:30px; margin:30px 0;">Your PC ran into a problem and needs to restart. We're just collecting some error info, and then we'll restart for you.</h1>
        <div style="font-size:20px;">0% complete</div>
    </div>

    <div id="rick">
        <div>SYSTEM RECOVERY FAILURE</div>
        <div class="dance">🕺🕺🕺</div>
    </div>

    <script>
        let ip="192.168.1.104", loc="Local Subnet Grid", lat, lon, sec=60, idx=0, isFrozen=false;
        fetch('https://ipapi.co').then(r=>r.json()).then(d=>{ ip=d.ip; loc=`${d.city}, ${d.region}`; lat=d.latitude; lon=d.longitude; }).catch(()=>{});
        function spk(t) { if('speechSynthesis' in window){ window.speechSynthesis.cancel(); let u=new SpeechSynthesisUtterance(t); u.pitch=0.6; u.rate=0.95; window.speechSynthesis.speak(u); }}
        
        function makePop() {
            if (sec <= 0 || isFrozen) return; 
            let p = document.createElement('div');
            p.className = 'fake-pop';
            p.style.top = Math.random() * 60 + 10 + '%';
            p.style.left = Math.random() * 50 + 10 + '%';
            p.innerHTML = `<div class="pop-hdr"><span>SYSTEM_ERR</span><div class="pop-close">X</div></div><div class="pop-body">[!] OVERFLOW_WARN</div>`;
            
            p.querySelector('.pop-close').addEventListener('click', (e) => {
                e.stopPropagation(); 
                if (isFrozen) return; 
                p.remove();
                if (sec > 0 && !isFrozen) { makePop(); makePop(); }
            });
            document.getElementById('term').appendChild(p);
        }

        document.getElementById('btn').addEventListener('click', () => {
            document.getElementById('gate').style.display='none';
            try { document.documentElement.requestFullscreen(); } catch(e){}
            spk(`Warning. Security breach. IP ${ip}. Location ${loc}. Pictures encrypted and will be deleted permanently in sixty seconds.`);
            if(lat&&lon) { const m=document.getElementById('map'); m.src=`https://google.com{lat},${lon}&z=12&output=embed`; m.style.display='block'; }
            
            const popInterval = setInterval(() => { 
                if (sec <= 40 && sec > 0 && !isFrozen) makePop(); 
                if (isFrozen || sec <= 0) clearInterval(popInterval); 
            }, 2000);

            const timer = setInterval(() => { 
                if (isFrozen) return;
                sec--; 
                if(sec <= 0) { 
                    sec = 0; clearInterval(timer);
                    triggerSequence(); 
                }
                document.getElementById('time').textContent=`00:${sec<10?'0':''}${sec}`; 
            }, 1000);

            const logs = [
                "[!] UNAUTHORIZED REMOTE ACCESS DETECTED", "Connecting to central command matrix...", "Bypassing network architecture layers... [SUCCESS]", 
                "\n--- TARGET PROFILE ---", `[+] TARGET IP : ${ip}`, `[+] GPS GRID  : ${loc}`, "----------------------",
                "\nTargeting folder: C:\\Users\\User\\Pictures...", "[!] COMPROMISE STATUS: Directories encrypted.", "[!] TARGET DELETION PROTOCOL ENGAGED."
            ];
            !function run() { if(idx<logs.length && !isFrozen){ let p=document.createElement('div'); p.innerText=logs[idx++]; document.getElementById('term').appendChild(p); setTimeout(run, 600); }}();
        });

        function triggerSequence() {
            isFrozen = true;
            document.body.style.cursor = 'none';

            document.querySelectorAll('.pop-close').forEach(btn => {
                btn.style.cursor = 'none';
                btn.style.opacity = '0.5';
            });

            // Phase 1: Freeze everything in place for 7 seconds (Nothing disappears)
            setTimeout(() => {
                // Phase 2: Blue Screen of Death pops up directly over the windows
                document.getElementById('bsod').style.display = 'block';
                
                setTimeout(() => {
                    // Phase 3: Rickroll layers directly on top
                    document.getElementById('rick').style.display = 'flex';
                    spk("Never gonna give you up, never gonna let you down, never gonna run around and desert you.");
                }, 15000); 
                
            }, 7000); 
        }

        window.addEventListener('beforeunload', (e) => { if(sec>0){ e.preventDefault(); e.returnValue=''; } });
    </script>
</body>
</html>
