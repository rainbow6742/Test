<!DOCTYPE html><html><body style="margin:0;overflow:hidden;background:#111;font-family:sans-serif;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;">
<div id="auth" style="background:#222;padding:20px;border-radius:8px;text-align:center;width:260px;position:absolute;z-index:20;">
<h3 id="at">Log In</h3>
<input id="usr" placeholder="User" style="width:90%;margin:4px;padding:6px;background:#333;color:#fff;border:none;">
<input id="pwd" type="password" placeholder="Pass (4+)" style="width:90%;margin:4px;padding:6px;background:#333;color:#fff;border:none;">
<button onclick="auth()" style="width:95%;margin:4px;padding:6px;background:#0fcc;border:none;font-weight:bold;cursor:pointer;border-radius:4px;">Enter</button>
<div style="margin-top:10px;font-size:12px;"><a id="sl" href="#" onclick="isL=!isL;document.getElementById('at').textContent=isL?'Log In':'Sign Up';document.getElementById('sl').textContent=isL?'Need an account? Sign Up':'Have an account? Log In';err.textContent='';" style="color:#0fcc;text-decoration:none;font-weight:bold;">Need an account? Sign Up</a></div>
<p id="err" style="color:#f55;font-size:11px;margin:4px 0 0 0;"></p>
</div>
<div id="menu" style="display:none;background:rgba(34,34,34,0.95);padding:15px;border-radius:8px;text-align:center;position:absolute;z-index:10;width:280px;max-height:90vh;overflow-y:auto;">
<p id="m-hi" style="color:#0fcc;margin:0 0 5px 0;"></p>
<label style="cursor:pointer;"><input type="checkbox" id="ai-on" checked> Enable AI Bot</label>
<h4 style="margin:10px 0 5px 0;color:#0fcc;border-top:1px solid #444;padding-top:5px;">Shop</h4><div id="sh"></div>
<h4 style="margin:10px 0 5px 0;color:#fa0;border-top:1px solid #444;padding-top:5px;">Boosts & Upgrades</h4><div id="bo"></div><br>
<button onclick="toggleM()" style="width:100%;padding:6px;background:#0fcc;border:none;font-weight:bold;margin-bottom:4px;cursor:pointer;border-radius:4px;">Resume</button>
<button onclick="location.reload()" style="width:100%;padding:6px;background:#f55;border:none;color:#fff;cursor:pointer;border-radius:4px;">Sign Out</button>
</div>
<canvas id="c" style="display:none;position:absolute;top:0;left:0;"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),authDiv=document.getElementById('auth'),menuDiv=document.getElementById('menu'),err=document.getElementById('err'),aiOn=document.getElementById('ai-on'),shDiv=document.getElementById('sh'),boDiv=document.getElementById('bo');
let px=0,py=0,score=0,currentUsr='',keys={},targets=[],bullets=[],hue=0,ai={x:100,y:-100,s:0,cd:0},isL=true,pCol='#0fcc',owns=['#0fcc','none'],bg='none',stars=[],mult=1,mTimer=0,magTimer=0,magPulse=0;
const res=()=>{c.width=window.innerWidth;c.height=window.innerHeight;};window.onresize=res;res();
for(let i=0;i<100;i++)stars.push({x:(Math.random()-0.5)*3000,y:(Math.random()-0.5)*3000,r:Math.random()*2});
function auth(){
let u=document.getElementById('usr').value.trim(),p=document.getElementById('pwd').value,st=localStorage.getItem('g_'+u);
if(!u||p.length<4){err.textContent="4+ chars required!";return;}
if(isL){
if(!st){err.textContent="No account found!";return;}
let user=JSON.parse(st);if(user.pwd!==p){err.textContent="Wrong password!";return;}
score=user.hi||0;pCol=user.col||'#0fcc';bg=user.bg||'none';owns=user.owns||['#0fcc','none'];
}else{
if(st){err.textContent="Username taken!";return;}
localStorage.setItem('g_'+u,JSON.stringify({pwd:p,hi:0,col:'#0fcc',bg:'none',owns:['#0fcc','none']}));
score=0;pCol='#0fcc';bg='none';owns=['#0fcc','none'];
}
currentUsr=u;authDiv.style.display='none';c.style.display='block';toggleM();
}
function renderS(){
shDiv.innerHTML='';boDiv.innerHTML='';
[{n:'Cyan Skin',t:'col',id:'#0fcc',c:0},{n:'Lime Skin',t:'col',id:'#0f0',c:200},{n:'Purple Skin',t:'col',id:'#b0f',c:400},{n:'Pink Skin',t:'col',id:'#f0f',c:800},{n:'Default Dark BG',t:'bg',id:'none',c:0},{n:'Space BG',t:'bg',id:'space',c:2000}].forEach(item=>{
let btn=document.createElement('button');btn.style="width:100%;margin:2px 0;padding:6px;font-weight:bold;cursor:pointer;border:none;border-radius:4px;";
let eq=(item.t=='col'&&pCol==item.id)||(item.t=='bg'&&bg==item.id);
if(eq){btn.textContent=`${item.n} (Equipped)`;btn.style.background='#555';btn.style.color='#fff';}
else if(owns.includes(item.id)){btn.textContent=`Equip ${item.n}`;btn.style.background='#3a3a3a';btn.style.color='#fff';btn.onclick=()=>{if(item.t=='col')pCol=item.id;else bg=item.id;save();renderS();};}
else{btn.textContent=`Buy ${item.n} (${item.c}pt)`;btn.disabled=score<item.c;btn.style.background=score<item.c?'#222':'#0fcc';btn.style.color=score<item.c?'#666':'#111';btn.onclick=()=>{score-=item.c;owns.push(item.id);if(item.t=='col')pCol=item.id;else bg=item.id;save();renderS();};}
shDiv.appendChild(btn);
});
const upgrades=[
{n:'2x Boost (1m)',t:'boost',m:2,d:60,c:150},
{n:'2x Boost (2m)',t:'boost',m:2,d:120,c:300},
{n:'5x Boost (1m)',t:'boost',m:5,d:60,c:500},
{n:'5x Boost (2m)',t:'boost',m:5,d:120,c:1000},
{n:'Screen Magnet (30s)',t:'magnet',d:30,c:250},
{n:'Screen Magnet (1m)',t:'magnet',d:60,c:450}
];
upgrades.forEach(b=>{
let btn=document.createElement('button');btn.style="width:100%;margin:2px 0;padding:6px;font-weight:bold;cursor:pointer;border:none;border-radius:4px;";
btn.textContent=`${b.n} (${b.c}pt)`;btn.disabled=score<b.c;btn.style.background=score<b.c?'#222':'#fa0';btn.style.color=score<b.c?'#666':'#111';
btn.onclick=()=>{
score-=b.c;
if(b.t==='boost'){mult=b.m;mTimer=b.d*60;}
else if(b.t==='magnet'){magTimer=b.d*60;}
save();toggleM();
};
boDiv.appendChild(btn);
});
}
function toggleM(){
if(menuDiv.style.display==='block'){menuDiv.style.display='none';c.requestPointerLock();}
else{document.exitPointerLock();document.getElementById('m-hi').textContent=`Points Available: ${score}`;renderS();menuDiv.style.display='block';}
}
function save(){let u=JSON.parse(localStorage.getItem('g_'+currentUsr))||{};u.hi=Math.max(u.hi||0,score);u.col=pCol;u.bg=bg;u.owns=owns;localStorage.setItem('g_'+currentUsr,JSON.stringify(u));}
document.addEventListener('pointerlockchange',()=>{if(document.pointerLockElement!==c&&currentUsr&&menuDiv.style.display==='none')toggleM();});
window.onclick=()=>{if(currentUsr&&menuDiv.style.display==='none')c.requestPointerLock();};
document.onmousemove=(e)=>{if(document.pointerLockElement===c){px+=e.movementX;py+=e.movementY;}};
document.onkeydown=(e)=>{keys[e.key.toLowerCase()]=true;if(e.key==='Escape'&&currentUsr)toggleM();};
document.onkeyup=(e)=>{keys[e.key.toLowerCase()]=false;};
window.onkeypress=(e)=>{
if(!currentUsr||document.pointerLockElement!==c)return;
if(e.key===' '){px+=(keys.d?2:keys.a?-2:0)*50;py+=(keys.s?2:keys.w?-2:0)*50;}
if(e.key.toLowerCase()==='e')bullets.push({x:c.width/2,y:c.height/2,r:60,life:5,o:'p'});
};
window.onmousedown=()=>{if(currentUsr&&document.pointerLockElement===c)bullets.push({x:c.width/2,y:c.height/2,r:6,vy:-8,o:'p'});};
setInterval(()=>{
if(!currentUsr||menuDiv.style.display!=='none')return;
targets.push({x:px+c.width/2+(Math.random()-0.5)*1000,y:py+c.height/2+(Math.random()-0.5)*1000,t:'n'});
if(Math.random()<0.01)targets.push({x:px+c.width/2+(Math.random()-0.5)*600,y:py+c.height/2+(Math.random()-0.5)*600,t:'r'});
},1000);
function loop(){
if(currentUsr&&menuDiv.style.display==='none'){
ctx.fillStyle='rgba(17,17,17,0.3)';ctx.fillRect(0,0,c.width,c.height);hue=(hue+2)%360;
let cx=c.width/2,cy=c.height/2;if(mTimer>0&&--mTimer<=0)mult=1;
if(magTimer>0)magTimer--;
if(keys.w)py-=5;if(keys.s)py+=5;if(keys.a)px-=5;if(keys.d)px+=5;
if(bg=='space'){ctx.fillStyle='#fff';stars.forEach(s=>{ctx.beginPath();ctx.arc(((s.x-px)%3000+3000)%3000-1500+cx,((s.y-py)%3000+3000)%3000-1500+cy,s.r,0,7);ctx.fill();});}
if(magTimer>0){
magPulse=(magPulse+0.05)%1;
ctx.strokeStyle=`rgba(0, 204, 255, ${0.4 * (1 - magPulse)})`;
ctx.lineWidth=3;
ctx.beginPath();ctx.arc(cx,cy,magPulse*Math.max(c.width,c.height)*0.6,0,7);ctx.stroke();
ctx.strokeStyle=`rgba(0, 255, 200, ${0.2 * magPulse})`;
ctx.beginPath();ctx.arc(cx,cy,30+(1-magPulse)*40,0,7);ctx.stroke();
}
if(aiOn.checked&&targets.length>0){
let close=targets.reduce((a,b)=>Math.hypot(a.x-ai.x,a.y-ai.y)<Math.hypot(b.x-ai.x,b.y-ai.y)?a:b);
let ang=Math.atan2(close.y-ai.y,close.x-ai.x);ai.x+=Math.cos(ang)*3.5;ai.y+=Math.sin(ang)*3.5;
if(ai.cd--<=0){bullets.push({x:ai.x-px,y:ai.y-py,r:6,vy:-8,o:'a'});ai.cd=20;}
ctx.fillStyle='#fa0';ctx.beginPath();ctx.arc(ai.x-px,ai.y-py,10,0,7);ctx.fill();
}
bullets.forEach((b,bi)=>{b.y+=b.vy||0;if(b.life)b.life--;ctx.fillStyle=b.o==='a'?'#fa0':(b.life?'rgba(0,255,200,0.4)':pCol);ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();if(b.y<0||b.life===0)bullets.splice(bi,1);});
targets.forEach((t,ti)=>{
if(magTimer>0){
let dx=px+cx-t.x,dy=py+cy-t.y,dist=Math.hypot(dx,dy);
if(dist>1){t.x+=((dx/dist)*8);t.y+=((dy/dist)*8);}
}
let sx=t.x-px,sy=t.y-py,dp=Math.hypot(sx-cx,sy-cy),da=Math.hypot(sx-(ai.x-px),sy-(ai.y-py)),pts=t.t==='r'?100:10;
if(dp<22){targets.splice(ti,1);score+=pts*mult;save();return;}if(aiOn.checked&&da<22){targets.splice(ti,1);ai.s+=pts;return;}
ctx.fillStyle=t.t==='r'?`hsl(${hue},100%,60%)` : '#f55';ctx.beginPath();ctx.arc(sx,sy,t.t==='r'?22:15,0,7);ctx.fill();
if(magTimer>0){
ctx.strokeStyle='rgba(0,204,255,0.4)';ctx.lineWidth=1;
ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(cx,cy);ctx.stroke();
}
bullets.forEach((b,bi)=>{if(Math.hypot(sx-b.x,sy-b.y)<(b.r+(t.t==='r'?22:15))){targets.splice(ti,1);if(!b.life)bullets.splice(bi,1);if(b.o==='p'){score+=pts*mult;save();}else ai.s+=pts;}});
});
ctx.fillStyle=pCol;ctx.beginPath();ctx.arc(cx,cy,12,0,7);ctx.fill();
ctx.fillStyle='#fff';ctx.font='18px sans-serif';ctx.fillText(`You: ${score}`,20,40);if(aiOn.checked){ctx.fillStyle='#fa0';ctx.fillText(`AI: ${ai.s}`,20,65);}
let uiY=c.height-20;
if(magTimer>0){ctx.fillStyle='#0fcc';ctx.font='bold 16px sans-serif';ctx.fillText(`Magnet Active: ${Math.ceil(magTimer/60)}s`,20,uiY);uiY-=25;}if(mult>1){ctx.fillStyle='#fa0';ctx.font='bold 16px sans-serif';ctx.fillText(${mult}x Boost Active: ${Math.ceil(mTimer/60)}s,20,uiY);}
}
requestAnimationFrame(loop);
}
loop();
