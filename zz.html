<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Roblox 2D Obby Clone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #191B1D;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            color: white;
        }
        #ui { display: flex; gap: 40px; margin-bottom: 10px; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 0px #000; }
        #window { width: 800px; height: 400px; overflow: hidden; border: 4px solid #3a3f44; border-radius: 8px; position: relative; }
        #canvas { background: linear-gradient(to bottom, #5ce1e6, #38b6ff); position: absolute; left: 0; top: 0; }
        .info { margin-top: 15px; font-size: 14px; color: #aaa; text-align: center; }
        .info span { color: #00e676; font-weight: bold; }
    </style>
</head>
<body>

    <div id="ui">
        <div>Stage: <span id="stage">1</span></div>
        <div style="color: #FFD11A;">Checkpoint: <span id="cp">1</span>/4</div>
    </div>
    
    <div id="window">
        <canvas id="canvas" width="3200" height="400"></canvas>
    </div>
    
    <p class="info">Use <span>A / D</span> or <span>← / →</span> to move. Press <span>SPACEBAR</span> or <span>W</span> to jump!</p>

<script>
    window.onload = function() {
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const stageUI = document.getElementById("stage");
        const cpUI = document.getElementById("cp");

        let isGameOver = false, spawnX = 80, activeCP = 1, cameraX = 0, time = 0;
        const keys = { Left: false, Right: false };
        const checkpoints =;
        const killbricks =;
        const rainbowBlocks = [
            { x: 1200, offset: 0 }, { x: 1800, offset: 60 }, 
            { x: 1950, offset: 0 }, { x: 2750, offset: 30 }, { x: 2900, offset: 90 }
        ];

        const player = {
            x: 80, y: 300, width: 35, height: 50, speed: 5, gravity: 0.6, lift: -12, vx: 0, vy: 0, isGrounded: false,
            draw() {
                ctx.fillStyle = "#FFD11A"; ctx.fillRect(this.x + 7, this.y, 21, 15);
                ctx.fillStyle = "#0066FF"; ctx.fillRect(this.x, this.y + 15, this.width, 22);
                ctx.fillStyle = "#22AA33"; ctx.fillRect(this.x + 2, this.y + 37, 13, 13); ctx.fillRect(this.x + 20, this.y + 37, 13, 13);
            },
            update() {
                this.vx = keys.Left ? -this.speed : (keys.Right ? this.speed : 0);
                this.x += this.vx; this.vy += this.gravity; this.y += this.vy;
                if (this.x < 0) this.x = 0;
                if (this.x + this.width > canvas.width) this.x = canvas.width - this.width;
                if (this.y + this.height >= 350) { this.y = 350 - this.height; this.vy = 0; this.isGrounded = true; } 
                else { this.isGrounded = false; }
            }
        };

        function animate() {
            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#FFFFFF"; ctx.font = "bold 32px Arial"; ctx.textAlign = "center";
                ctx.fillText("Oof! You hit the Lava!", cameraX + 400, 180);
                ctx.font = "20px Arial"; ctx.fillStyle = "#00e676";
                ctx.fillText("Press SPACEBAR to Respawn", cameraX + 400, 230);
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            player.update();

            ctx.fillStyle = "#A3A7AC"; ctx.fillRect(0, 350, canvas.width, 50);
            ctx.fillStyle = "#8E9296"; ctx.fillRect(0, 350, canvas.width, 5);

            checkpoints.forEach((cpX, index) => {
                let reached = activeCP > index;
                ctx.fillStyle = reached ? "#00E676" : "#FFD11A"; ctx.fillRect(cpX - 10, 340, 20, 10);
                ctx.fillStyle = "#FFFFFF"; ctx.fillRect(cpX - 3, 290, 6, 50);
                ctx.fillStyle = reached ? "#00E676" : "#FF3333"; ctx.fillRect(cpX + 3, 290, 25, 15);
                if (player.x + player.width >= cpX && player.x <= cpX + 20 && activeCP <= index) {
                    spawnX = cpX; activeCP = index + 1; cpUI.innerText = activeCP;
                }
            });

            stageUI.innerText = Math.floor(player.x / 200) + 1;

            ctx.fillStyle = "#FF0000";
            killbricks.forEach(bx => {
                ctx.fillRect(bx, 315, 35, 35);
                if (player.x < bx + 35 && player.x + player.width > bx && player.y + player.height > 315) isGameOver = true;
            });

            time++;
            rainbowBlocks.forEach(rb => {
                let solid = (time + rb.offset) % 120 < 70;
                if (solid) {
                    let grad = ctx.createLinearGradient(rb.x, 0, rb.x + 60, 0);
                    grad.addColorStop(0, "red"); grad.addColorStop(0.5, "green"); grad.addColorStop(1, "blue");
                    ctx.fillStyle = grad; ctx.fillRect(rb.x, 295, 60, 55);
                    if (player.x < rb.x + 60 && player.x + player.width > rb.x && player.y + player.height > 295) {
                        if (player.vy > 0 && player.y + player.height - player.vy <= 305) { player.y = 295 - player.height; player.vy = 0; player.isGrounded = true; }
                        else { player.x = player.vx > 0 ? rb.x - player.width : rb.x + 60; }
                    }
                } else {
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.15)"; ctx.strokeRect(rb.x, 295, 60, 55);
                }
            });

            player.draw();
            cameraX = Math.max(0, Math.min(canvas.width - 800, player.x - 200));
            canvas.style.transform = `translateX(-${cameraX}px)`;
            requestAnimationFrame(animate);
        }

        window.addEventListener("keydown", (e) => {
            if (e.code === "Space" || e.code === "KeyW" || e.code === "ArrowUp") {
                if (isGameOver) { player.x = spawnX; player.y = 200; player.vy = 0; isGameOver = false; animate(); } 
                else if (player.isGrounded) { player.vy = player.lift; }
            }
            if (e.code === "KeyA" || e.code === "ArrowLeft") keys.Left = true;
            if (e.code === "KeyD" || e.code === "ArrowRight") keys.Right = true;
        });

        window.addEventListener("keyup", (e) => {
            if (e.code === "KeyA" || e.code === "ArrowLeft") keys.Left = false;
            if (e.code === "KeyD" || e.code === "ArrowRight") keys.Right = false;
        });

        animate();
    };
</script>
</body>
</html>
