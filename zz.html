<!DOCTYPE html><html><body style="margin:0;overflow:hidden;background:#111;font-family:sans-serif;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;">
<div id="ui" style="position:absolute;top:20px;left:20px;z-index:10;font-size:18px;font-weight:bold;text-shadow:1px 1px 3px #000;pointer-events:none;">
    <div>Score: <span id="sc">10</span></div><div style="font-size:12px;color:#aaa;margin-top:4px;">Hold Left-Click or Space to BOOST</div>
</div>
<div id="lb" style="position:absolute;top:20px;right:20px;z-index:10;background:rgba(0,0,0,0.6);padding:12px;border-radius:6px;font-size:13px;width:160px;pointer-events:none;">
    <h4 style="margin:0 0 8px 0;color:#0fcc;border-bottom:1px solid #333;padding-bottom:4px;">Leaderboard</h4><div id="lbi"></div>
</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),sc=document.getElementById('sc'),lbi=document.getElementById('lbi');
let mx=0,my=0,foods=[],bots=[],isBoost=false;
const mapW=3000,mapH=3000,p={x:1500,y:1500,ang:0,r:12,segments:[],col:'#0fcc',alive:true,name:'You'};
const res=()=>{c.width=window.innerWidth;c.height=window.innerHeight;};window.onresize=res;res();
for(let i=0;i<20;i++)p.segments.push({x:p.x,y:p.y});
const spawnFood=()=>({x:Math.random()*mapW,y:Math.random()*mapH,r:Math.random()*4+3,hue:Math.random()*360});
for(let i=0;i<400;i++)foods.push(spawnFood());
const names=['Slitherer','Wormy','Viper','Anancoda','Python','Cobrax','Naga','Striker','Neon','Gliss'];
const spawnBot=()=>{
    let bx=Math.random()*mapW,by=Math.random()*mapH,bot={x:bx,y:by,ang:Math.random()*6,r:12,segments:[],col:`hsl(${Math.random()*360},100%,60%)`,name:names[Math.floor(Math.random()*names.length)],alive:true,bTimer:0};
    for(let i=0;i<20;i++)bot.segments.push({x:bx,y:by});return bot;
};
for(let i=0;i<15;i++)bots.push(spawnBot());
window.onmousemove=(e)=>{mx=e.clientX;my=e.clientY;};
window.onmousedown=window.onkeydown=(e)=>{if(e.type==='mousedown'||e.key===' ')isBoost=true;};
window.onmouseup=window.onkeyup=(e)=>{if(e.type==='mouseup'||e.key===' ')isBoost=false;};
const moveSnake=(s,tAng,boost)=>{
    if(!s.alive)return;let speed=boost&&s.segments.length>10?5:2.5;
    if(boost&&s.segments.length>10&&Math.random()<0.15){s.segments.pop();if(Math.random()<0.4)foods.push({x:s.x,y:s.y,r:4,hue:Math.random()*360});}
    s.ang+=Math.atan2(Math.sin(tAng-s.ang),Math.cos(tAng-s.ang))*0.12;
    s.x=(s.x+Math.cos(s.ang)*speed+mapW)%mapW;s.y=(s.y+Math.sin(s.ang)*speed+mapH)%mapH;
    s.segments.unshift({x:s.x,y:s.y});while(s.segments.length>Math.floor(s.r*1.5))s.segments.pop();
};
const drawSnake=(s,cx,cy)=>{
    if(!s.alive)return;ctx.lineWidth=s.r*2;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=s.col;ctx.beginPath();
    s.segments.forEach((seg,i)=>{
        let sx=((seg.x-p.x+mapW/2)%mapW+mapW)%mapW-mapW/2+cx,sy=((seg.y-p.y+mapH/2)%mapH+mapH)%mapH-mapH/2+cy;
        if(i===0)ctx.moveTo(sx,sy);else ctx.lineTo(sx,sy);
    });ctx.stroke();
    let hx=((s.x-p.x+mapW/2)%mapW+mapW)%mapW-mapW/2+cx,hy=((s.y-p.y+mapH/2)%mapH+mapH)%mapH-mapH/2+cy;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(hx+Math.cos(s.ang+0.5)*6,hy+Math.sin(s.ang+0.5)*6,3,0,7);ctx.arc(hx+Math.cos(s.ang-0.5)*6,hy+Math.sin(s.ang-0.5)*6,3,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='11px sans-serif';ctx.fillText(s.name,hx-15,hy-18);
};
const explodeSnake=(s)=>{
    s.alive=false;s.segments.forEach(seg=>{if(Math.random()<0.5)foods.push({x:seg.x+Math.random()*10-5,y:seg.y+Math.random()*10-5,r:6,hue:Math.random()*360});});
};
function loop(){
    let cx=c.width/2,cy=c.height/2;ctx.fillStyle='#161616';ctx.fillRect(0,0,c.width,c.height);
    ctx.strokeStyle='#222';ctx.lineWidth=1;let startX=(cx-p.x)%50,startY=(cy-p.y)%50;
    for(let x=startX;x<c.width;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,c.height);ctx.stroke();}
    for(let y=startY;y<c.height;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(c.width,y);ctx.stroke();}
    if(p.alive){let targetAng=Math.atan2(my-cy,mx-cx);moveSnake(p,targetAng,isBoost);sc.textContent=p.segments.length;p.r=Math.max(12,12+p.segments.length*0.05);}
    bots.forEach((b,bi)=>{
        if(!b.alive){bots[bi]=spawnBot();return;}if(--b.bTimer<=0||Math.random()<0.02){b.bTimer=Math.random()*60+30;b.targetAng=Math.random()*6.28;}
        moveSnake(b,b.targetAng,Math.random()<0.05);b.r=Math.max(12,12+b.segments.length*0.05);
        if(p.alive&&Math.hypot(b.x-p.x,b.y-p.y)<b.r+p.r){let headAng=Math.atan2(b.y-p.y,b.x-p.x);if(Math.abs(headAng-p.ang)<1.5){explodeSnake(p);}else{explodeSnake(b);}}
        b.segments.forEach(seg=>{if(p.alive&&Math.hypot(p.x-seg.x,p.y-seg.y)<p.r+b.r*0.5){explodeSnake(p);}});
    });
    bots.forEach(b=>{p.segments.forEach(seg=>{if(b.alive&&Math.hypot(b.x-seg.x,b.y-seg.y)<b.r+p.r*0.5){explodeSnake(b);}});});
    foods.forEach((f,fi)=>{
        let sx=((f.x-p.x+mapW/2)%mapW+mapW)%mapW-mapW/2+cx,sy=((f.y-p.y+mapH/2)%mapH+mapH)%mapH-mapH/2+cy;
        ctx.fillStyle=`hsl(${f.hue},100%,60%)`;ctx.beginPath();ctx.arc(sx,sy,f.r,0,7);ctx.fill();
        if(p.alive&&Math.hypot(p.x-f.x,p.y-f.y)<p.r+f.r){p.segments.push({x:p.x,y:p.y});foods[fi]=spawnFood();}
        bots.forEach(b=>{if(b.alive&&Math.hypot(b.x-f.x,b.y-f.y)<b.r+f.r){b.segments.push({x:b.x,y:b.y});foods[fi]=spawnFood();}});
    });
    bots.forEach(b=>drawSnake(b,cx,cy));if(p.alive)drawSnake(p,cx,cy);
    else{ctx.fillStyle='#fff';ctx.font='bold 30px sans-serif';ctx.fillText("GAME OVER",cx-90,cy-10);ctx.font='16px sans-serif';ctx.fillText("Refresh page to slither again",cx-100,cy+20);}
    let list=[p,...bots.filter(b=>b.alive)].sort((a,b)=>b.segments.length-a.segments.length).slice(0,5);
    lbi.innerHTML=list.map((s,i)=>`<div>${i+1}. ${s.name}: ${s.segments.length}</div>`).join('');
    requestAnimationFrame(loop);
}loop();
</script></body></html>
