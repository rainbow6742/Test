<!DOCTYPE html><html><body style="margin:0;overflow:hidden;background:#111;font-family:sans-serif;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;">
<div style="position:absolute;top:15px;left:15px;z-index:10;pointer-events:none;background:rgba(0,0,0,0.5);padding:10px;border-radius:6px;">
    <div style="font-size:18px;font-weight:bold;color:#fa0;">Easiest Game Ever (Web Edition)</div>
    <div style="font-size:13px;margin-top:4px;color:#eee;">Endings Found: <span id="found">0</span> / 8</div>
    <input id="chat" placeholder="Type /dance here..." style="margin-top:8px;pointer-events:auto;background:#222;color:#fff;border:1px solid #555;padding:4px;border-radius:4px;width:150px;">
</div>
<div id="lb" style="position:absolute;top:15px;right:15px;z-index:10;background:rgba(0,0,0,0.7);padding:12px;border-radius:6px;font-size:12px;width:180px;max-height:80vh;overflow-y:auto;">
    <h4 style="margin:0 0 6px 0;color:#0fcc;border-bottom:1px solid #444;padding-bottom:2px;">Discovered Endings</h4><div id="elist" style="color:#aaa;line-height:1.4;"></div>
</div>
<div id="msg" style="display:none;position:absolute;z-index:20;background:rgba(20,20,20,0.95);padding:25px;border-radius:10px;text-align:center;border:2px solid #fa0;box-shadow:0 0 15px rgba(255,170,0,0.4);width:280px;">
    <h2 id="m-tit" style="margin:0 0 10px 0;color:#fa0;">ENDING UNLOCKED!</h2><p id="m-desc" style="margin:0 0 15px 0;font-size:14px;color:#ddd;"></p>
    <button onclick="resetGame()" style="padding:6px 20px;background:#0fcc;border:none;font-weight:bold;cursor:pointer;border-radius:4px;color:#111;">Respawn / Try Again</button>
</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),chat=document.getElementById('chat'),elist=document.getElementById('elist'),msg=document.getElementById('msg');
let keys={},px=100,py=250,pw=20,ph=20,g=0.3,vy=0,isG=false,bx=220,by=240,br=12,bvx=0,bvy=0,worldCol='#111',active=true;
const plat=[{x:40,y:260,w:150,h:20,t:'normal'},{x:250,y:260,w:120,h:20,t:'normal'},{x:440,y:260,w:60,h:20,t:'normal'}];
const items=[{x:460,y:230,w:20,h:30,t:'trophy',c:'#fa0'},{x:300,y:240,w:18,h:20,t:'cheese',c:'#ff0'},{x:120,y:190,w:20,h:20,t:'trash',c:'#7a7'}];
const endings={
    'fell':{n:'The "Fell" Ending',d:'You completely missed the platforms and fell into the void.'},
    'win':{n:'The "You Won" Ending',d:'You walked across the path and touched the glorious golden trophy! Easy!'},
    'reset':{n:'The "Reset" Ending',d:'You opened the console or your mind and manually reset your character.'},
    'super':{n:'The "Super Win" Ending',d:'You went through the trouble of pushing the physics ball all the way to the trophy.'},
    'cheese':{n:'The "Cheese World" Ending',d:'You pushed the yellow ball into the void and plunged the game world into Cheese mode!'},
    'toxic':{n:'The "Toxic Death" Ending',d:'You inspected the green radioactive waste container closely... too closely.'},
    'dance':{n:'The "Dance Party" Ending',d:'You typed /dance into the console and threw an absolute rager.'},
    'secret':{n:'The "Secret Wall" Ending',d:'You completely bypassed the paths and ran directly through the secret invisible door.'}
};
let unlocked=JSON.parse(localStorage.getItem('rob_ends'))||[];
const saveEnd=(k)=>{
    if(!unlocked.includes(k)){unlocked.push(k);localStorage.setItem('rob_ends',JSON.stringify(unlocked));}
    document.getElementById('m-tit').textContent=endings[k].n;document.getElementById('m-desc').textContent=endings[k].d;
    msg.style.display='block';active=false;updateUI();
};
const updateUI=()=>{
    document.getElementById('found').textContent=unlocked.length;
    elist.innerHTML=Object.keys(endings).map(k=>`<div style="color:${unlocked.includes(k)?'#0fcc':'#555'}">${unlocked.includes(k)?'✓':'?'} ${endings[k].n}</div>`).join('');
};
const resetGame=()=>{
    px=100;py=250;vy=0;bx=220;by=240;bvx=bvy=0;worldCol='#111';msg.style.display='none';active=true;chat.value='';chat.blur();
};
const res=()=>{c.width=window.innerWidth;c.height=window.innerHeight;};window.onresize=res;res();updateUI();
window.onkeydown=(e)=>{keys[e.key.toLowerCase()]=true;if(e.key==='Enter'&&document.activeElement===chat){if(chat.value.trim()==='/dance'&&active)saveEnd('dance');else if(chat.value.trim()==='/reset'&&active)saveEnd('reset');chat.value='';chat.blur();}};
window.onkeyup=(e)=>{keys[e.key.toLowerCase()]=false;};
const boxColl=(b1,b2)=>b1.x<b2.x+b2.w&&b1.x+b1.w>b2.x&&b1.y<b2.y+b2.h&&b1.y+b1.h>b2.y;
function loop(){
    ctx.fillStyle=worldCol;ctx.fillRect(0,0,c.width,c.height);
    ctx.save();ctx.translate(c.width/2-px,c.height/2-py);
    plat.forEach(p=>{ctx.fillStyle='#444';ctx.fillRect(p.x,p.y,p.w,p.h);});
    items.forEach(i=>{ctx.fillStyle=i.c;ctx.fillRect(i.x,i.y,i.w,i.h);});
    ctx.fillStyle='#0fcc';ctx.fillRect(px,py,pw,ph);
    ctx.fillStyle='#ffff33';ctx.beginPath();ctx.arc(bx,by,br,0,7);ctx.fill();
    if(active){
        if(keys['a']||keys['arrowleft'])px-=3;if(keys['d']||keys['arrowright'])px+=3;
        if((keys['w']||keys[' '||keys['arrowup']])&&isG){vy=-6.5;isG=false;}
        vy+=g;py+=vy;isG=false;
        plat.forEach(p=>{if(px+pw>p.x&&px<p.x+p.w&&py+ph>=p.y&&py+ph-vy<=p.y+6){py=p.y-ph;vy=0;isG=true;}});
        bvy+=g;bx+=bvx;by+=bvy;bvx*=0.98;
        plat.forEach(p=>{if(bx+br>p.x&&bx-br<p.x+p.w&&by+br>=p.y&&by+br-bvy<=p.y+6){by=p.y-br;bvy=-bvy*0.4;bvx*=0.8;}});
        let dist=Math.hypot(bx-(px+pw/2),by-(py+ph/2));
        if(dist<br+pw/2){let ang=Math.atan2(by-(py+ph/2),bx-(px+pw/2));bvx=Math.cos(ang)*4;bvy=Math.sin(ang)*4-2;}
        items.forEach(i=>{
            if(boxColl({x:px,y:py,w:pw,h:ph},i)){
                if(i.t==='trophy')saveEnd('win');if(i.t==='trash')saveEnd('toxic');
                if(i.t==='cheese')worldCol='#443d1a';
            }
            if(bx+br>i.x&&bx-br<i.x+i.w&&by+br>i.y&&by-br<i.y+i.h&&i.t==='trophy')saveEnd('super');
        });
        if(py>400)saveEnd('fell');if(by>400&&worldCol==='#111'){worldCol='#ffea6b';saveEnd('cheese');}
        if(px<0)saveEnd('secret');
    }
    ctx.restore();requestAnimationFrame(loop);
}loop();
</script></body></html>
