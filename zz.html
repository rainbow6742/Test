    {x:10420,y:240,w:100,h:20,t:'goal'}
];
const items=[{x:10460,y:200,w:20,h:40,t:'trophy',c:'#ffd700'}];
const boxColl=(b1,b2)=>b1.x<b2.x+b2.w&&b1.x+b1.w>b2.x&&b1.y<b2.y+b2.h&&b1.y+b1.h>b2.y;
const killPlayer=()=>{px=respawnX;py=respawnY;vy=0;isG=false;plat.forEach(p=>{if(p.t==='rainbow'){p.state='idle';p.timer=0;}});};
const restartObby=()=>{hasCheckpoint=false;isFlying=false;respawnX=50;respawnY=200;killPlayer();msg.style.display='none';active=true;document.getElementById('chk').textContent="Not Saved";document.getElementById('chk').style.color="#ff3366";};
const res=()=>{c.width=window.innerWidth;c.height=window.innerHeight;};window.onresize=res;res();
window.onkeydown=(e)=>{
    keys[e.key.toLowerCase()]=true;
    if(e.key==='Enter'&&document.activeElement===chat){
        let v=chat.value.trim().toLowerCase();if(v==='/reset')killPlayer();if(v==='31718'){isFlying=!isFlying;vy=0;}
        if(v==='/skip'){if(!hasCheckpoint){respawnX=plat.find(p=>p.t==='checkpoint').x+40;respawnY=220;hasCheckpoint=true;killPlayer();}else{respawnX=10430;respawnY=200;killPlayer();}}
        chat.value='';chat.blur();
    }
};
window.onkeyup=(e)=>{keys[e.key.toLowerCase()]=false;};
function loop(){
    ctx.fillStyle='#111';ctx.fillRect(0,0,c.width,c.height);ctx.save();ctx.translate(c.width/2-px,c.height/2-py);tick+=0.04;
    plat.forEach(p=>{
        if(p.t==='move'){let lastX=p.x;p.x=p.baseX+Math.sin(tick)*p.mx;p.vx=p.x-lastX;}
        if(p.t==='rainbow'){
            if(p.state==='stepped'){p.timer++;if(p.timer>=90){p.state='gone';p.timer=0;}}else if(p.state==='gone'){p.timer++;if(p.timer>=480){p.state='idle';p.timer=0;}}
            ctx.fillStyle=p.state==='idle'?`hsla(${tick*30+p.x},100%,60%,1)`:p.state==='stepped'?`hsla(${tick*30+p.x},100%,45%,${1-(p.timer/90)})` : 'rgba(0,0,0,0)';
        }else{ctx.fillStyle=p.t==='spawn'?'#0c8':p.t==='checkpoint'?'#0bc':p.t==='lava'?'#f33':p.t==='goal'?'#ffd700':'#555';}
        if(p.t!=='rainbow'||p.state!=='gone')ctx.fillRect(p.x,p.y,p.w,p.h);
        if(p.t==='checkpoint'||p.t==='spawn'||p.t==='goal'){ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(p.x,p.y-4,p.w,4);}
    });
    items.forEach(i=>{ctx.fillStyle=i.c;ctx.fillRect(i.x,i.y,i.w,i.h);});ctx.fillStyle=isFlying?'#0fcc':'#ff3366';ctx.fillRect(px,py,pw,ph);
    if(active){
        if(keys['a']||keys['arrowleft'])px-=3.2;if(keys['d']||keys['arrowright'])px+=3.2;
        if(isFlying){if(keys['w']||keys['arrowup'])py-=3.5;if(keys['s']||keys['arrowdown'])py+=3.5;}else{if((keys['w']||keys[' '||keys['arrowup']])&&isG){vy=-6.8;isG=false;}vy+=g;py+=vy;}
        let onPlatform=false;
        plat.forEach(p=>{
            if(p.t==='lava'&&boxColl({x:px,y:py,w:pw,h:ph},p)){killPlayer();return;}
            let collides=px+pw>p.x+4&&px<p.x+p.w-4&&py+ph>=p.y&&py+ph-vy<=p.y+6;if(p.t==='rainbow'&&p.state==='gone')collides=false;
if(p.t!=='lava'&&collides){py=p.y-ph;vy=0;isG=true;onPlatform=true;if(p.t==='move')px+=p.vx;if(p.t==='rainbow'&&p.state==='idle')p.state='stepped';if(p.t==='checkpoint'&&!hasCheckpoint){hasCheckpoint=true;respawnX=p.x+p.w/2-pw/2;respawnY=p.y-ph-10;document.getElementById('chk').textContent="SAVED!";document.getElementById('chk').style.color="#0fcc";}}}
});
if(!onPlatform&&!isFlying)isG=false;items.forEach(i=>{if(boxColl({x:px,y:py,w:pw,h:ph},i)&&i.t==='trophy'){msg.style.display='block';active=false;}});if(py>500)killPlayer();
}ctx.restore();requestAnimationFrame(loop);
}loop();
