<!DOCTYPE html><html><body style="margin:0;overflow:hidden;background:#111;font-family:sans-serif;color:#fff;">
<div style="position:absolute;top:15px;left:15px;z-index:10;pointer-events:none;background:rgba(0,0,0,0.5);padding:10px;border-radius:6px;">
    <div style="font-size:16px;font-weight:bold;color:#ff3366;">Chat Here!</div>
    <div style="font-size:12px;margin-top:2px;">Checkpoint Status: <span id="chk" style="color:#ff3366;font-weight:bold;">Not Saved</span></div>
    <div style="font-size:11px;color:#aaa;">Code 31718 toggles fly (W/S)</div>
    <input id="chat" placeholder="Type here..." style="margin-top:6px;pointer-events:auto;background:#222;color:#fff;border:1px solid #555;padding:4px;border-radius:4px;width:150px;">
</div>
<div id="msg" style="display:none;position:absolute;z-index:20;background:rgba(20,20,20,0.95);padding:20px;border-radius:10px;text-align:center;border:2px solid #ff3366;width:260px;">
    <h3 style="margin:0;color:#ff3366;">CONQUEROR!</h3><p style="font-size:13px;color:#ddd;">You finished the marathon!</p>
    <button onclick="location.reload()" style="padding:6px 20px;background:#ff3366;border:none;font-weight:bold;cursor:pointer;border-radius:4px;color:#fff;">Play Again</button>
</div><canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),chat=document.getElementById('chat'),msg=document.getElementById('msg'),keys={};
let px=50,py=200,pw=20,ph=20,vy=0,isG=false,active=true,tick=0,hasCheckpoint=false,isFlying=false,respawnX=50,respawnY=200;
const plat=[{x:20,y:260,w:100,h:20,t:'spawn'}];
for(let i=0;i<40;i++){
    let sx=160+i*240,sy=230-(i%3)*20,types=['norm','plat','move','rainbow'],t=types[i%4];
    plat.push({x:sx,y:sy,w:50,h:15,t:t,mx:t==='move'?30:0,baseX:sx,state:'idle',timer:0});
    if(t==='plat')plat.push({x:sx+10,y:sy-10,w:30,h:10,t:'lava'});
    if(i===20)plat.push({x:sx+80,y:sy+20,w:120,h:20,t:'checkpoint'});
}
plat.push({x:10000,y:240,w:100,h:20,t:'goal'});const items=[{x:10040,y:200,w:20,h:40,t:'trophy'}];
const boxColl=(b1,b2)=>b1.x<b2.x+b2.w&&b1.x+b1.w>b2.x&&b1.y<b2.y+b2.h&&b1.y+b1.h>b2.y;
const kill=()=>{px=respawnX;py=respawnY;vy=0;isG=false;plat.forEach(p=>{if(p.t==='rainbow'){p.state='idle';p.timer=0;}});};
window.onresize=()=>{c.width=window.innerWidth;c.height=window.innerHeight;};window.onresize();
window.onkeydown=e=>{keys[e.key.toLowerCase()]=true;if(e.key==='Enter'&&document.activeElement===chat){let v=chat.value.trim().toLowerCase();if(v==='/reset')kill();if(v==='31718'){isFlying=!isFlying;vy=0;}if(v==='/skip'){if(!hasCheckpoint){respawnX=5000;respawnY=200;hasCheckpoint=true;kill();}else{px=10010;py=200;}}chat.value='';chat.blur();}};
window.onkeyup=e=>keys[e.key.toLowerCase()]=false;
function loop(){
    ctx.fillStyle='#111';ctx.fillRect(0,0,c.width,c.height);ctx.save();ctx.translate(c.width/2-px,c.height/2-py);tick+=0.04;
    plat.forEach(p=>{
        if(p.t==='move'){let lx=p.x;p.x=p.baseX+Math.sin(tick)*p.mx;p.vx=p.x-lx;}
        if(p.t==='rainbow'){
            if(p.state==='stepped'&&++p.timer>=90){p.state='gone';p.timer=0;}else if(p.state==='gone'&&++p.timer>=480){p.state='idle';p.timer=0;}
            ctx.fillStyle=p.state==='idle'?`hsla(${tick*30+p.x},100%,60%,1)`:p.state==='stepped'?`hsla(${tick*30+p.x},100%,45%,${1-(p.timer/90)})` : 'rgba(0,0,0,0)';
        }else ctx.fillStyle=p.t==='spawn'?'#0c8':p.t==='checkpoint'?'#0bc':p.t==='lava'?'#f33':p.t==='goal'?'#ffd700':'#555';
        if(p.t!=='rainbow'||p.state!=='gone')ctx.fillRect(p.x,p.y,p.w,p.h);
    });
    ctx.fillStyle='#ffd700';items.forEach(i=>ctx.fillRect(i.x,i.y,i.w,i.h));ctx.fillStyle=isFlying?'#0fcc':'#ff3366';ctx.fillRect(px,py,pw,ph);
    if(active){
        if(keys.a||keys.arrowleft)px-=3.2;if(keys.d||keys.arrowright)px+=3.2;
        if(isFlying){if(keys.w||keys.arrowup)py-=3.5;if(keys.s||keys.arrowdown)py+=3.5;}else{if((keys.w||keys[' ' ]||keys.arrowupSpecial)&&isG){vy=-6.8;isG=false;}vy+=0.28;py+=vy;}
        let onPlat=false;
        plat.forEach(p=>{
            if(p.t==='lava'&&boxColl({x:px,y:py,w:pw,h:ph},p)){kill();return;}
            let col=px+pw>p.x+4&&px<p.x+p.w-4&&py+ph>=p.y&&py+ph-vy<=p.y+6;if(p.t==='rainbow'&&p.state==='gone')col=false;
            if(p.t!=='lava'&&col){py=p.y-ph;vy=0;isG=onPlat=true;if(p.t==='move')px+=p.vx;if(p.t==='rainbow'&&p.state==='idle')p.state='stepped';if(p.t==='checkpoint'&&!hasCheckpoint){hasCheckpoint=true;respawnX=p.x+p.w/2-pw/2;respawnY=p.y-ph-10;document.getElementById('chk').textContent="SAVED!";document.getElementById('chk').style.color="#0fcc";}}}
        });
        if(!onPlat&&!isFlying)isG=false;if(boxColl({x:px,y:py,w:pw,h:ph},items[0])){msg.style.display='block';active=false;}if(py>600)kill();
    }ctx.restore();requestAnimationFrame(loop);
}loop();
</script></body></html>
