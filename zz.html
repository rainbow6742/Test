<!DOCTYPE html><html><body style="margin:0;overflow:hidden;background:#111;font-family:sans-serif;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;">
<div style="position:absolute;top:15px;left:15px;z-index:10;pointer-events:none;background:rgba(0,0,0,0.5);padding:10px;border-radius:6px;">
    <div style="font-size:18px;font-weight:bold;color:#ff3366;">Mega-Hard Obby (Web Edition)</div>
    <div style="font-size:13px;margin-top:4px;color:#eee;">Checkpoint Status: <span id="chk" style="color:#0fcc;font-weight:bold;">Not Saved</span></div>
    <div style="font-size:11px;color:#aaa;margin-top:2px;">Type /reset to respawn or /skip to cheat</div>
    <input id="chat" placeholder="Type commands here..." style="margin-top:8px;pointer-events:auto;background:#222;color:#fff;border:1px solid #555;padding:4px;border-radius:4px;width:160px;">
</div>
<div id="msg" style="display:none;position:absolute;z-index:20;background:rgba(20,20,20,0.95);padding:25px;border-radius:10px;text-align:center;border:2px solid #ff3366;box-shadow:0 0 15px rgba(255,51,102,0.4);width:280px;">
    <h2 id="m-tit" style="margin:0 0 10px 0;color:#ff3366;">GODLIKE CONQUEROR!</h2><p id="m-desc" style="margin:0 0 15px 0;font-size:13px;color:#ddd;">You survived the ultra-long path and claimed the golden trophy!</p>
    <button onclick="restartObby()" style="padding:6px 20px;background:#ff3366;border:none;font-weight:bold;cursor:pointer;border-radius:4px;color:#fff;">Play Again</button>
</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),chat=document.getElementById('chat'),msg=document.getElementById('msg');
let keys={},px=50,py=200,pw=20,ph=20,g=0.28,vy=0,isG=false,active=true,tick=0,hasCheckpoint=false;
let respawnX=50,respawnY=200;
const plat=[
    {x:20,y:260,w:100,h:20,t:'spawn'},
    {x:180,y:230,w:45,h:15},{x:285,y:200,w:45,h:15},{x:390,y:230,w:45,h:15},
    {x:490,y:250,w:40,h:15,t:'plat'},{x:495,y:240,w:30,h:10,t:'lava'},{x:580,y:210,w:45,h:15},
    {x:670,y:250,w:40,h:15,t:'plat'},{x:675,y:240,w:30,h:10,t:'lava'},{x:765,y:210,w:45,h:15},
    {x:870,y:240,w:40,h:15,t:'move',mx:40,baseX:870},{x:1000,y:200,w:40,h:15,t:'move',mx:-40,baseX:1000},
    {x:1120,y:240,w:50,h:15,t:'rainbow',state:'idle',timer:0},{x:1230,y:210,w:50,h:15,t:'rainbow',state:'idle',timer:0},{x:1340,y:240,w:50,h:15,t:'rainbow',state:'idle',timer:0},
    {x:1460,y:260,w:120,h:20,t:'checkpoint'},
    {x:1640,y:230,w:40,h:15},{x:1740,y:255,w:40,h:15,t:'plat'},{x:1745,y:245,w:30,h:10,t:'lava'},{x:1840,y:210,w:40,h:15},
    {x:1940,y:255,w:40,h:15,t:'plat'},{x:1945,y:245,w:30,h:10,t:'lava'},
    {x:2040,y:230,w:40,h:15},{x:2140,y:190,w:40,h:15},{x:2240,y:240,w:40,h:15},
    {x:2340,y:240,w:35,h:15,t:'rainbow',state:'idle',timer:0},{x:2430,y:200,w:35,h:15,t:'rainbow',state:'idle',timer:0},{x:2520,y:240,w:35,h:15,t:'rainbow',state:'idle',timer:0},
    {x:2620,y:240,w:40,h:15,t:'move',mx:60,baseX:2620},{x:2760,y:200,w:40,h:15,t:'move',mx:-60,baseX:2760},
    {x:2900,y:250,w:40,h:15,t:'plat'},{x:2905,y:240,w:30,h:10,t:'lava'},{x:3000,y:220,w:40,h:15,t:'plat'},{x:3005,y:210,w:30,h:10,t:'lava'},{x:3100,y:190,w:40,h:15,t:'plat'},{x:3105,y:180,w:30,h:10,t:'lava'},
    {x:3200,y:240,w:40,h:15,t:'rainbow',state:'idle',timer:0},{x:3290,y:200,w:40,h:15,t:'rainbow',state:'idle',timer:0},{x:3380,y:240,w:40,h:15,t:'rainbow',state:'idle',timer:0},
    {x:3490,y:230,w:35,h:15},{x:3590,y:210,w:35,h:15},{x:3690,y:190,w:35,h:15},{x:3800,y:255,w:100,h:20,t:'plat'},{x:3805,y:245,w:90,h:10,t:'lava'},
    {x:3950,y:240,w:40,h:15,t:'move',mx:50,baseX:3950},{x:4090,y:210,w:40,h:15,t:'move',mx:-50,baseX:4090},
    {x:4220,y:240,w:40,h:15,t:'rainbow',state:'idle',timer:0},{x:4310,y:220,w:40,h:15,t:'rainbow',state:'idle',timer:0},{x:4400,y:200,w:40,h:15,t:'rainbow',state:'idle',timer:0},
    {x:4500,y:240,w:40,h:15,t:'move',mx:80,baseX:4500},{x:4670,y:240,w:100,h:20,t:'goal'}
];
const items=[{x:4710,y:200,w:20,h:40,t:'trophy',c:'#fa0'}];
const boxColl=(b1,b2)=>b1.x<b2.x+b2.w&&b1.x+b1.w>b2.x&&b1.y<b2.y+b2.h&&b1.y+b1.h>b2.y;
const killPlayer=()=>{
    px=respawnX;py=respawnY;vy=0;isG=false;
    plat.forEach(p=>{if(p.t==='rainbow'){p.state='idle';p.timer=0;}});
};
const restartObby=()=>{
    hasCheckpoint=false;respawnX=50;respawnY=200;killPlayer();msg.style.display='none';active=true;
    document.getElementById('chk').textContent="Not Saved";document.getElementById('chk').style.color="#ff3366";
};
const res=()=>{c.width=window.innerWidth;c.height=window.innerHeight;};window.onresize=res;res();
window.onkeydown=(e)=>{
    keys[e.key.toLowerCase()]=true;
    if(e.key==='Enter'&&document.activeElement===chat){
        let v=chat.value.trim().toLowerCase();
        if(v==='/reset')killPlayer();
        if(v==='/skip'){
            let cp=plat.find(p=>p.t==='checkpoint');
            if(!hasCheckpoint){respawnX=cp.x+40;respawnY=cp.y-40;hasCheckpoint=true;killPlayer();}
            else{respawnX=4680;respawnY=200;killPlayer();}
        }
        chat.value='';chat.blur();
    }
};
window.onkeyup=(e)=>{keys[e.key.toLowerCase()]=false;};
function loop(){
    ctx.fillStyle='#111';ctx.fillRect(0,0,c.width,c.height);ctx.save();ctx.translate(c.width/2-px,c.height/2-py);
    tick+=0.04;
    plat.forEach(p=>{
        if(p.t==='move'){let lastX=p.x;p.x=p.baseX+Math.sin(tick)*p.mx;p.vx=p.x-lastX;}
        if(p.t==='rainbow'){
            if(p.state==='stepped'){p.timer++;if(p.timer>=180){p.state='gone';p.timer=0;}}
            else if(p.state==='gone'){p.timer++;if(p.timer>=480){p.state='idle';p.timer=0;}}
            ctx.fillStyle=p.state==='idle'?`hsla(${tick*30+p.x},100%,60%,1)`:p.state==='stepped'?`hsla(${tick*30+p.x},100%,45%,${1-(p.timer/180)})` : 'rgba(0,0,0,0)';
        }else{ctx.fillStyle=p.t==='spawn'?'#0c8':p.t==='checkpoint'?'#0bc':p.t==='lava'?'#f33':p.t==='goal'?'#fa0':'#555';}
        if(p.t!=='rainbow'||p.state!=='gone')ctx.fillRect(p.x,p.y,p.w,p.h);
        if(p.t==='checkpoint'||p.t==='spawn'||p.t==='goal'){ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(p.x,p.y-4,p.w,4);}
    });
    items.forEach(i=>{ctx.fillStyle=i.c;ctx.fillRect(i.x,i.y,i.w,i.h);});
    ctx.fillStyle='#ff3366';ctx.fillRect(px,py,pw,ph);
    if(active){
        if(keys['a']||keys['arrowleft'])px-=3.2;if(keys['d']||keys['arrowright'])px+=3.2;
        if((keys['w']||keys[' '||keys['arrowup']])&&isG){vy=-6.8;isG=false;}
        vy+=g;py+=vy;let onPlatform=false;
        plat.forEach(p=>{
            if(p.t==='lava'&&boxColl({x:px,y:py,w:pw,h:ph},p)){killPlayer();return;}
            let collides=px+pw>p.x&&px<p.x+p.w&&py+ph>=p.y&&py+ph-vy<=p.y+6;
            if(p.t==='rainbow'&&p.state==='gone')collides=false;
            if(p.t!=='lava'&&collides){
                py=p.y-ph;vy=0;isG=true;onPlatform=true;
                if(p.t==='move')px+=p.vx;
                if(p.t==='rainbow'&&p.state==='idle')p.state='stepped';
                if(p.t==='checkpoint'&&!hasCheckpoint){
                    hasCheckpoint=true;respawnX=p.x+p.w/2-pw/2;respawnY=p.y-ph-10;
                    document.getElementById('chk').textContent="SAVED!";document.getElementById('chk').style.color="#0fcc";
                }
            }
        });
        if(!onPlatform)isG=false;
        items.forEach(i=>{if(boxColl({x:px,y:py,w:pw,h:ph},i)&&i.t==='trophy'){msg.style.display='block';active=false;}});
        if(py>500)killPlayer();
    }
    ctx.restore();requestAnimationFrame(loop);
}loop();
</script></body></html>
