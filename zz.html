<!DOCTYPE html><html><body style="margin:0;overflow:hidden;background:#111;font-family:sans-serif;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;">
<div style="position:absolute;top:15px;left:15px;z-index:10;pointer-events:none;background:rgba(0,0,0,0.5);padding:10px;border-radius:6px;">
    <div style="font-size:18px;font-weight:bold;color:#0fcc;">Roblox-Style Obby (Web Edition)</div>
    <div style="font-size:13px;margin-top:4px;color:#eee;">Stage: <span id="stg">1</span> / 4 | Checkpoint: <span id="chk">Saved</span></div>
    <input id="chat" placeholder="Type /skip or /reset here..." style="margin-top:8px;pointer-events:auto;background:#222;color:#fff;border:1px solid #555;padding:4px;border-radius:4px;width:160px;">
</div>
<div id="msg" style="display:none;position:absolute;z-index:20;background:rgba(20,20,20,0.95);padding:25px;border-radius:10px;text-align:center;border:2px solid #0fcc;box-shadow:0 0 15px rgba(0,255,204,0.4);width:280px;">
    <h2 id="m-tit" style="margin:0 0 10px 0;color:#0fcc;">OBBY COMPLETE!</h2><p id="m-desc" style="margin:0 0 15px 0;font-size:13px;color:#ddd;">You conquered all the platforms and reached the golden trophy!</p>
    <button onclick="restartObby()" style="padding:6px 20px;background:#0fcc;border:none;font-weight:bold;cursor:pointer;border-radius:4px;color:#111;">Play Again</button>
</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),chat=document.getElementById('chat'),msg=document.getElementById('msg');
let keys={},px=50,py=200,pw=20,ph=20,g=0.28,vy=0,isG=false,active=true,tick=0,currentStage=1;
let respawnX=50,respawnY=200;
const plat=[
    {x:20,y:260,w:100,h:20,t:'spawn'},{x:180,y:230,w:50,h:15,t:'normal'},{x:290,y:200,w:50,h:15,t:'normal'},{x:400,y:240,w:120,h:20,t:'checkpoint',s:2},
    {x:580,y:240,w:30,h:15,t:'normal'},{x:670,y:210,w:20,h:50,t:'lava'},{x:750,y:240,w:30,h:15,t:'normal'},{x:850,y:240,w:120,h:20,t:'checkpoint',s:3},
    {x:1030,y:240,w:40,h:15,t:'normal'},{x:1130,y:170,w:30,h:100,t:'lava'},{x:1220,y:240,w:40,h:15,t:'normal'},{x:1320,y:240,w:120,h:20,t:'checkpoint',s:4},
    {x:1500,y:240,w:40,h:15,t:'move',mx:60,baseX:1500},{x:1640,y:200,w:40,h:15,t:'move',mx:-60,baseX:1640},{x:1780,y:240,w:100,h:20,t:'goal'}
];
const items=[{x:1820,y:200,w:20,h:40,t:'trophy',c:'#fa0'}];
const killPlayer=()=>{
    px=respawnX;py=respawnY;vy=0;
};
const restartObby=()=>{
    currentStage=1;respawnX=50;respawnY=200;killPlayer();msg.style.display='none';active=true;
};
const res=()=>{c.width=window.innerWidth;c.height=window.innerHeight;};window.onresize=res;res();
window.onkeydown=(e)=>{
    keys[e.key.toLowerCase()]=true;
    if(e.key==='Enter'&&document.activeElement===chat){
        let v=chat.value.trim().toLowerCase();
        if(v==='/reset')killPlayer();
        if(v==='/skip'&&currentStage<4){
            let nextCheck=plat.find(p=>p.t==='checkpoint'&&p.s===currentStage+1);
            if(nextCheck){respawnX=nextCheck.x+40;respawnY=nextCheck.y-40;currentStage++;killPlayer();}
        }
        chat.value='';chat.blur();
    }
};
window.onkeyup=(e)=>{keys[e.key.toLowerCase()]=false;};
const boxColl=(b1,b2)=>b1.x<b2.x+b2.w&&b1.x+b1.w>b2.x&&b1.y<b2.y+b2.h&&b1.y+b1.h>b2.y;
function loop(){
    ctx.fillStyle='#111';ctx.fillRect(0,0,c.width,c.height);ctx.save();ctx.translate(c.width/2-px,c.height/2-py);
    tick+=0.04;
    plat.forEach(p=>{
        if(p.t==='move')p.x=p.baseX+Math.sin(tick)*p.mx;
        ctx.fillStyle=p.t==='spawn'?'#0c8':p.t==='checkpoint'?'#0bc':p.t==='lava'?'#f33':p.t==='goal'?'#fa0':'#555';
        ctx.fillRect(p.x,p.y,p.w,p.h);
        if(p.t==='checkpoint'||p.t==='spawn'||p.t==='goal'){
            ctx.fillStyle='rgba(255,255,255,0.15)';
            ctx.fillRect(p.x,p.y-4,p.w,4);
        }
    });
    items.forEach(i=>{ctx.fillStyle=i.c;ctx.fillRect(i.x,i.y,i.w,i.h);});
    ctx.fillStyle='#0fcc';ctx.fillRect(px,py,pw,ph);
    if(active){
        if(keys['a']||keys['arrowleft'])px-=3.2;if(keys['d']||keys['arrowright'])px+=3.2;
        if((keys['w']||keys[' '||keys['arrowup']])&&isG){vy=-6.8;isG=false;}
        vy+=g;py+=vy;let stoodOnPlat=false;
        plat.forEach(p=>{
            if(px+pw>p.x&&px<p.x+p.w&&py+ph>=p.y&&py+ph-vy<=p.y+6){
                if(p.t==='lava'){killPlayer();return;}
                py=p.y-ph;vy=0;isG=true;stoodOnPlat=true;
                if(p.t==='checkpoint'&&p.s>currentStage){
                    currentStage=p.s;respawnX=p.x+p.w/2-pw/2;respawnY=p.y-ph-10;
                    document.getElementById('chk').textContent="Stage "+p.s;
                }
            }
        });
        document.getElementById('stg').textContent=currentStage;
        items.forEach(i=>{
            if(boxColl({x:px,y:py,w:pw,h:ph},i)&&i.t==='trophy'){msg.style.display='block';active=false;}
        });
        if(py>500)killPlayer();
    }
    ctx.restore();requestAnimationFrame(loop);
}loop();
</script></body></html>
