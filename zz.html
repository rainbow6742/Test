<!DOCTYPE html><html><body style="margin:0;overflow:hidden;background:#111;font-family:sans-serif;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;">
<div style="position:absolute;top:15px;left:15px;z-index:10;pointer-events:none;background:rgba(0,0,0,0.5);padding:10px;border-radius:6px;">
    <div style="font-size:18px;font-weight:bold;color:#fa0;">Easiest Game Ever (Web Edition)</div>
    <div style="font-size:13px;margin-top:4px;color:#eee;">Endings Found: <span id="found">0</span> / 18</div>
    <input id="chat" placeholder="Type commands here..." style="margin-top:8px;pointer-events:auto;background:#222;color:#fff;border:1px solid #555;padding:4px;border-radius:4px;width:150px;">
</div>
<div id="lb" style="position:absolute;top:15px;right:15px;z-index:10;background:rgba(0,0,0,0.7);padding:12px;border-radius:6px;font-size:11px;width:190px;max-height:80vh;overflow-y:auto;">
    <h4 style="margin:0 0 6px 0;color:#0fcc;border-bottom:1px solid #444;padding-bottom:2px;">Discovered Endings</h4><div id="elist" style="color:#aaa;line-height:1.4;"></div>
</div>
<div id="msg" style="display:none;position:absolute;z-index:20;background:rgba(20,20,20,0.95);padding:25px;border-radius:10px;text-align:center;border:2px solid #fa0;box-shadow:0 0 15px rgba(255,170,0,0.4);width:280px;">
    <h2 id="m-tit" style="margin:0 0 10px 0;color:#fa0;">ENDING UNLOCKED!</h2><p id="m-desc" style="margin:0 0 15px 0;font-size:13px;color:#ddd;"></p>
    <button onclick="resetGame()" style="padding:6px 20px;background:#0fcc;border:none;font-weight:bold;cursor:pointer;border-radius:4px;color:#111;">Respawn / Try Again</button>
</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),chat=document.getElementById('chat'),elist=document.getElementById('elist'),msg=document.getElementById('msg');
let keys={},px=40,py=100,pw=20,ph=20,g=0.3,vy=0,isG=false,bx=120,by=200,br=12,bvx=0,bvy=0,worldCol='#111',active=true,jumps=0,afk=0,konami='',clicks=0;
const plat=[{x:-40,y:260,w:230,h:20},{x:250,y:260,w:120,h:20},{x:440,y:260,w:60,h:20},{x:100,y:140,w:40,h:15,t:'cloud'},{x:290,y:170,w:40,h:15,t:'fake'}];
const items=[{x:460,y:230,w:20,h:30,t:'trophy',c:'#fa0'},{x:300,y:240,w:18,h:20,t:'cheese',c:'#ff0'},{x:0,y:230,w:20,h:30,t:'trash',c:'#7a7'}];
const endings={
    'fell':{n:'1. The Void',d:'You completely missed the platforms and fell into the void.'},'win':{n:'2. You Won',d:'You walked across the path and touched the golden trophy! Easy!'},
    'reset':{n:'3. Reset Command',d:'You opened the console and manually used /reset.'},'super':{n:'4. Super Win',d:'You went through the trouble of pushing the physics ball into the trophy.'},
    'cheese':{n:'5. Cheese World',d:'You pushed the yellow ball into the void and turned on cheese mode.'},'toxic':{n:'6. Toxic Death',d:'You touched the green radioactive container.'},
    'dance':{n:'7. Dance Party',d:'You typed /dance into the console and threw an absolute rager.'},'secret':{n:'8. Secret Wall',d:'You bypassed the track completely and ran far left.'},
    'cloud':{n:'9. Sky High',d:'You successfully jumped onto the hidden platform high in the sky.'},'fake':{n:'10. Betrayal',d:'You tried to stand on the red platform, but it instantly vanished.'},
    'afk':{n:'11. Couch Potato',d:'You stood completely still at the spawn point for 10 straight seconds.'},'bunny':{n:'12. Bunny Hopper',d:'You spammed the jump button 25 times in a single life.'},
    'cheat':{n:'13. Script Kitty',d:'You typed /cheat directly into the text command console.'},'fly':{n:'14. Gravity Defied',d:'You typed /fly to alter your physics property dimensions.'},
    'rich':{n:'15. Pay to Win',d:'You typed /donate to spend fake currency on the developer.'},'color':{n:'16. Inversion',d:'You typed /disco to radically warp the world color values.'},
    'konami':{n:'17. Retro Gamer',d:'Entered secret code: Up Up Down Down Left Right Left Right.'},'clicker':{n:'18. Screen Masher',d:'Left-clicked the background gameplay canvas 15 times.'}
};
let unlocked=JSON.parse(localStorage.getItem('rob_ends3'))||[];
const saveEnd=(k)=>{
    if(!unlocked.includes(k)){unlocked.push(k);localStorage.setItem('rob_ends3',JSON.stringify(unlocked));}
    document.getElementById('m-tit').textContent=endings[k].n;document.getElementById('m-desc').textContent=endings[k].d;msg.style.display='block';active=false;updateUI();
};
const updateUI=()=>{
    document.getElementById('found').textContent=unlocked.length;
    elist.innerHTML=Object.keys(endings).map(k=>`<div style="color:${unlocked.includes(k)?'#0fcc':'#555'}">${unlocked.includes(k)?'✓':'?'} ${endings[k].n}</div>`).join('');
};
const resetGame=()=>{
    px=40;py=100;vy=0;bx=120;by=200;bvx=bvy=0;worldCol='#111';msg.style.display='none';active=true;chat.value='';chat.blur();jumps=afk=clicks=0;konami='';
};
const res=()=>{c.width=window.innerWidth;c.height=window.innerHeight;};window.onresize=res;res();updateUI();
window.onkeydown=(e)=>{
    keys[e.key.toLowerCase()]=true;
    if(['arrowup','arrowdown','arrowleft','arrowright'].includes(e.key))konami+=e.key.toLowerCase();
    if(konami.endsWith('arrowuparrowuparrowdownarrowdownarrowleftarrowrightarrowleftarrowright')&&active)saveEnd('konami');
    if(e.key==='Enter'&&document.activeElement===chat){
        let v=chat.value.trim().toLowerCase();
        if(v==='/dance'&&active)saveEnd('dance');if(v==='/reset'&&active)saveEnd('reset');if(v==='/cheat'&&active)saveEnd('cheat');
        if(v==='/fly'&&active){py-=150;saveEnd('fly');}if(v==='/donate'&&active)saveEnd('rich');
        if(v==='/disco'&&active){worldCol='#3a1f5d';saveEnd('color');}chat.value='';chat.blur();
    }
};
window.onkeyup=(e)=>{keys[e.key.toLowerCase()]=false;};
c.onmousedown=()=>{clicks++;if(clicks>15&&active)saveEnd('clicker');};
const boxColl=(b1,b2)=>b1.x<b2.x+b2.w&&b1.x+b1.w>b2.x&&b1.y<b2.y+b2.h&&b1.y+b1.h>b2.y;
function loop(){
    ctx.fillStyle=worldCol;ctx.fillRect(0,0,c.width,c.height);ctx.save();ctx.translate(c.width/2-px,c.height/2-py);
    plat.forEach(p=>{ctx.fillStyle=p.t==='cloud'?'#8ee':p.t==='fake'?'#a44':'#444';ctx.fillRect(p.x,p.y,p.w,p.h);});
    items.forEach(i=>{ctx.fillStyle=i.c;ctx.fillRect(i.x,i.y,i.w,i.h);});
    ctx.fillStyle='#0fcc';ctx.fillRect(px,py,pw,ph);ctx.fillStyle='#ffff33';ctx.beginPath();ctx.arc(bx,by,br,0,7);ctx.fill();
    if(active){
        if(keys['a']||keys['arrowleft'])px-=3;if(keys['d']||keys['arrowright'])px+=3;
        if(!keys['a']&&!keys['d']&&!keys['w']&&!keys[' '])afk++;else afk=0;if(afk>600)saveEnd('afk');
        if((keys['w']||keys[' '||keys['arrowup']])&&isG){vy=-6.5;isG=false;jumps++;if(jumps>=25)saveEnd('bunny');}
        vy+=g;py+=vy;isG=false;
        plat.forEach(p=>{
            if(px+pw>p.x&&px<p.x+p.w&&py+ph>=p.y&&py+ph-vy<=p.y+6){
                if(p.t==='fake'){p.y+=200;saveEnd('fake');return;}
                py=p.y-ph;vy=0;isG=true;if(p.t==='cloud')saveEnd('cloud');
            }
        });
        bvy+=g;bx+=bvx;by+=bvy;bvx*=0.98;
        plat.forEach(p=>{if(bx+br>p.x&&bx-br<p.x+p.w&&by+br>=p.y&&by+br-bvy<=p.y+6){by=p.y-br;bvy=-bvy*0.4;bvx*=0.8;}});
        let dist=Math.hypot(bx-(px+pw/2),by-(py+ph/2));
        if(dist<br+pw/2){let ang=Math.atan2(by-(py+ph/2),bx-(px+pw/2));bvx=Math.cos(ang)*4;bvy=Math.sin(ang)*4-2;}
        items.forEach(i=>{
            if(boxColl({x:px,y:py,w:pw,h:ph},i)){
                if(i.t==='trophy')saveEnd('win');if(i.t==='trash')saveEnd('toxic');
                if(i.t==='cheese')worldCol='#443d1a';
            }
            if(bx+br>i.x&&bx-br<i.x+i.w&&by+br>i.y&&by-br<i.y+i.h&&i.t==='trophy')saveEnd('super');
        });
        if(py>400)saveEnd('fell');if(by>400&&worldCol==='#111'){worldCol='#ffea6b';saveEnd('cheese');}
        if(px<-100)saveEnd('secret');
    }
    ctx.restore();requestAnimationFrame(loop);
}loop();
</script></body></html>
