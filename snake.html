<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Snake Game</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #1a1a24;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 { margin: 5px 0; color: #4caf50; font-size: 2.5rem; text-shadow: 0 0 10px rgba(76,175,80,0.3); }
        .score-board { font-size: 1.2rem; margin-bottom: 15px; font-weight: bold; letter-spacing: 1px; }
        canvas {
            background-color: #111116;
            border: 4px solid #333;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .controls { margin-top: 15px; font-size: 0.9rem; color: #888; }
    </style>
</head>
<body>

    <h1>SNAKE</h1>
    <div class="score-board">SCORE: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="controls">Use Arrow Keys or WASD to navigate</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 5, y: 5 };
        let dx = 1, dy = 0;
        let score = 0;
        let gameInterval;

        function startGame() {
            clearInterval(gameInterval);
            snake = [{ x: 10, y: 10 }];
            generateFood();
            dx = 1; dy = 0;
            score = 0;
            scoreElement.innerText = score;
            gameInterval = setInterval(update, 100);
        }

        function update() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Wall or Self Collision Check
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount || 
                snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                alert(`Game Over! Your final score was: ${score}`);
                startGame();
                return;
            }

            snake.unshift(head);

            // Food eating check
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                generateFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            ctx.fillStyle = "#111116";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Snake
            snake.forEach((segment, index) => {
                ctx.fillStyle = index === 0 ? "#4caf50" : "#81c784";
                ctx.strokeStyle = "#111116";
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);
                ctx.strokeRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);
            });

            // Draw Food
            ctx.fillStyle = "#ff5722";
            ctx.beginPath();
            ctx.arc((food.x + 0.5) * gridSize, (food.y + 0.5) * gridSize, gridSize / 2 - 2, 0, Math.PI * 2);
            ctx.fill();
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            // Ensure food doesn't spawn on top of the snake
            if (snake.some(segment => segment.x === food.x && segment.y === food.y)) {
                generateFood();
            }
        }

        window.addEventListener("keydown", e => {
            switch(e.key.toLowerCase()) {
                case "arrowup": case "w": if (dy === 0) { dx = 0; dy = -1; } break;
                case "arrowdown": case "s": if (dy === 0) { dx = 0; dy = 1; } break;
                case "arrowleft": case "a": if (dx === 0) { dx = -1; dy = 0; } break;
                case "arrowright": case "d": if (dx === 0) { dx = 1; dy = 0; } break;
            }
        });

        startGame();
    </script>
</body>
</html>
