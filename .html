<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catch the Star</title>

  <style>
    :root {
      --panel: #161b33;
      --accent: #ffd43b;
      --text: #f8f9ff;
      --muted: #bac2e5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, #283575 0, transparent 28%),
        radial-gradient(circle at 80% 75%, #4b1e71 0, transparent 33%),
        #090b1a;
    }

    .game-card {
      width: min(92vw, 620px);
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      background: rgba(22, 27, 51, 0.88);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
    }

    .instructions {
      margin: 0 0 20px;
      text-align: center;
      color: var(--muted);
    }

    .stats {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      font-weight: bold;
    }

    .stat {
      flex: 1;
      padding: 12px;
      text-align: center;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
    }

    #gameArea {
      position: relative;
      height: min(58vh, 420px);
      min-height: 300px;
      overflow: hidden;
      border: 3px solid rgba(255, 212, 59, 0.85);
      border-radius: 18px;
      cursor: crosshair;
      user-select: none;
      touch-action: manipulation;
      background:
        radial-gradient(circle, rgba(255, 255, 255, 0.8) 1px, transparent 1.5px),
        linear-gradient(145deg, #151c48, #2c1554);
      background-size: 38px 38px, auto;
    }

    #star {
      position: absolute;
      display: none;
      width: 58px;
      height: 58px;
      place-items: center;
      font-size: 46px;
      line-height: 1;
      cursor: pointer;
      filter: drop-shadow(0 0 8px rgba(255, 221, 87, 0.9));
      transition: transform 0.12s ease;
    }

    #star:hover {
      transform: scale(1.18) rotate(12deg);
    }

    .message {
      min-height: 32px;
      margin: 16px 0 12px;
      text-align: center;
      font-weight: bold;
      color: var(--accent);
    }

    button {
      width: 100%;
      padding: 14px 20px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      color: #1b1600;
      background: var(--accent);
      box-shadow: 0 8px 20px rgba(255, 212, 59, 0.22);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    button:hover {
      filter: brightness(1.08);
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }
  </style>
</head>

<body>
  <main class="game-card">
    <h1>✨ Catch the Star</h1>
    <p class="instructions">Click or tap the star as quickly as you can.</p>

    <section class="stats" aria-label="Game statistics">
      <div class="stat">Score: <span id="score">0</span></div>
      <div class="stat">Time: <span id="time">30</span>s</div>
      <div class="stat">Best: <span id="best">0</span></div>
    </section>

    <div id="gameArea" aria-label="Game area">
      <div id="star" role="button" aria-label="Catch this star">⭐</div>
    </div>

    <p id="message" class="message">Press Start to play!</p>
    <button id="startButton">Start game</button>
  </main>

  <script>
    const gameArea = document.getElementById("gameArea");
    const star = document.getElementById("star");
    const scoreDisplay = document.getElementById("score");
    const timeDisplay = document.getElementById("time");
    const bestDisplay = document.getElementById("best");
    const message = document.getElementById("message");
    const startButton = document.getElementById("startButton");

    let score = 0;
    let timeLeft = 30;
    let gameRunning = false;
    let timerId;
    let moveId;

    let bestScore = Number(localStorage.getItem("catchTheStarBest")) || 0;
    bestDisplay.textContent = bestScore;

    function moveStar() {
      const starSize = star.offsetWidth || 58;
      const maxX = gameArea.clientWidth - starSize;
      const maxY = gameArea.clientHeight - starSize;

      const x = Math.floor(Math.random() * Math.max(maxX, 1));
      const y = Math.floor(Math.random() * Math.max(maxY, 1));

      star.style.left = `${x}px`;
      star.style.top = `${y}px`;
    }

    function endGame() {
      gameRunning = false;
      clearInterval(timerId);
      clearInterval(moveId);

      star.style.display = "none";
      startButton.textContent = "Play again";

      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem("catchTheStarBest", bestScore);
        bestDisplay.textContent = bestScore;
        message.textContent = `Time's up! New best score: ${score} 🎉`;
      } else {
        message.textContent = `Time's up! Your final score: ${score}`;
      }
    }

    function startGame() {
      score = 0;
      timeLeft = 30;
      gameRunning = true;

      scoreDisplay.textContent = score;
      timeDisplay.textContent = timeLeft;
      message.textContent = "Go!";
      startButton.textContent = "Game in progress";
      star.style.display = "grid";

      moveStar();

      clearInterval(timerId);
      clearInterval(moveId);

      timerId = setInterval(() => {
        timeLeft--;
        timeDisplay.textContent = timeLeft;

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);

      moveId = setInterval(() => {
        if (gameRunning) {
          moveStar();
        }
      }, 700);
    }

    star.addEventListener("click", () => {
      if (!gameRunning) return;

      score++;
      scoreDisplay.textContent = score;
      message.textContent = `Nice! Score: ${score}`;

      moveStar();

      // The star moves faster as the score rises.
      const speed = Math.max(220, 700 - score * 18);
      clearInterval(moveId);

      moveId = setInterval(() => {
        if (gameRunning) {
          moveStar();
        }
      }, speed);
    });

    startButton.addEventListener("click", () => {
      if (!gameRunning) {
        startGame();
      }
    });

    window.addEventListener("resize", () => {
      if (gameRunning) {
        moveStar();
      }
    });
  </script>
</body>
</html>
