<!DOCTYPE html>
<html>
<head>
    <title>Type Campaign</title>
    <style>
        body { font-family: monospace; background: #1e1e2e; color: #cdd6f4; text-align: center; padding-top: 15px; }
        #bar, #menu, #box { background: #252538; padding: 15px; border-radius: 8px; max-width: 600px; margin: 10px auto; }
        #game { display: none; }
        #box { font-size: 1.4rem; text-align: left; min-height: 80px; }
        .letter { color: #6c7086; } .correct { color: #a6e3a1; } .incorrect { color: #f38ba8; background: rgba(243,139,168,0.2); } .current { border-left: 2px solid #cba6f7; color: #fff; }
        input[type="text"], input[type="password"] { background: #1e1e2e; border: 1px solid #45475a; color: #fff; padding: 5px; margin: 2px; }
        #in { position: absolute; opacity: 0; pointer-events: none; }
        button { background: #cba6f7; color: #1e1e2e; border: none; padding: 8px 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin: 5px; }
        button:disabled { background: #45475a; color: #7f849c; cursor: not-allowed; }
        #logout-btn { display: none; background: #f38ba8; color: #fff; }
        .info { color: #f9e2af; font-size: 1.2rem; font-weight: bold; margin: 5px 0; }
    </style>
</head>
<body>

    <div id="bar">
        <span id="user-status">👤 Guest</span> <button id="logout-btn" onclick="logout()">Logout</button> | 
        <span id="auth-fields">
            <input type="text" id="u" placeholder="User" size="10">
            <input type="password" id="p" placeholder="Code (5+)" size="10">
            <button onclick="auth(true)" style="background:#89b4fa">Sign Up</button>
            <button onclick="auth(false)" style="background:#a6e3a1">Login</button>
        </span>
    </div>

    <div id="menu">
        <h2>Select Mode (Starts at 120s)</h2>
        <button onclick="start('easy')" style="background:#a6e3a1">🟢 Easy (Short words)</button>
        <button onclick="start('hard')" style="background:#f38ba8; color:#fff">🔴 Hard (Tech words)</button>
    </div>

    <div id="game">
        <div class="info" id="campaign-display">Module 1: Tech | Level 1/10</div>
        <h3>Target: <span id="tg">120</span>s (<span id="md"></span>) | Time: <span id="t">120</span>s | WPM: <span id="w">0</span></h3>
        <input type="text" id="in" autocomplete="off">
        <div id="box" onclick="document.getElementById('in').focus()"></div>
        <button id="nxt" disabled onclick="initRound()">Next Level</button>
        <button onclick="exitToMenu()">Exit to Menu</button>
        <div id="msg" style="font-weight:bold; margin-top:10px;"></div>
    </div>

    <script>
        const mods = [
            { name: "Tech", easy: ["code", "data", "web", "link", "user", "file", "byte", "key", "text", "page"], hard: ["algorithm", "compiler", "variable", "developer", "database", "encryption", "javascript", "interface", "protocol", "framework"] },
            { name: "Toys and Fun", easy: ["ball", "doll", "game", "kite", "yo-yo", "bear", "lego", "clay", "car", "ship"], hard: ["trampoline", "skateboard", "videogame", "miniatures", "racecourse", "marbles", "puzzlebox", "actionfigure", "boardgames", "playhouse"] },
            { name: "On a Trip", easy: ["bus", "bag", "map", "car", "train", "camp", "tent", "park", "sea", "road"], hard: ["destination", "locomotive", "navigation", "exploration", "passengers", "itinerary", "backpacking", "sightseeing", "expedition", "adventures"] }
        ];
        
        let idx = 0, correct = 0, targetTime = 120, timeLeft = 120, active = false, interval, mode = '', user = null, mIdx = 0, lvl = 1;

        function auth(isSignUp) {
            let name = document.getElementById('u').value.trim().toLowerCase(), pass = document.getElementById('p').value;
            if (!name || pass.length <= 4) return alert("Username required & Code must be > 4 characters!");
            let data = localStorage.getItem('typer_' + name);
            
            if (isSignUp) {
                if (data) return alert("Taken!");
                localStorage.setItem('typer_' + name, JSON.stringify({ pass, mode: 'easy', time: 120, mIdx: 0, lvl: 1 }));
                alert("Saved! Click Login.");
            } else {
                if (!data) return alert("No user!");
                let p = JSON.parse(data);
                if (p.pass !== pass) return alert("Wrong code!");
                user = name; mode = p.mode; targetTime = p.time; mIdx = p.mIdx || 0; lvl = p.lvl || 1;
                document.getElementById('user-status').innerText = "👤 " + user.toUpperCase();
                document.getElementById('auth-fields').style.display = 'none';
                document.getElementById('logout-btn').style.display = 'inline-block';
                document.getElementById('menu').style.display = 'none'; 
                document.getElementById('game').style.display = 'block';
                initRound();
            }
            document.getElementById('p').value = '';
        }

        function logout() {
            clearInterval(interval); user = null; mode = ''; targetTime = 120; mIdx = 0; lvl = 1;
            document.getElementById('user-status').innerText = "👤 Guest";
            document.getElementById('auth-fields').style.display = 'inline-block';
            document.getElementById('logout-btn').style.display = 'none';
            document.getElementById('u').value = ''; document.getElementById('p').value = '';
            exitToMenu();
        }

        function exitToMenu() { clearInterval(interval); document.getElementById('game').style.display = 'none'; document.getElementById('menu').style.display = 'block'; }
        function start(m) { mode = m; targetTime = 120; mIdx = 0; lvl = 1; document.getElementById('menu').style.display = 'none'; document.getElementById('game').style.display = 'block'; initRound(); }
        function save() { if (user) localStorage.setItem('typer_' + user, JSON.stringify({ pass: JSON.parse(localStorage.getItem('typer_' + user)).pass, mode, time: targetTime, mIdx, lvl })); }

        function initRound() {
            clearInterval(interval); active = false; idx = 0; correct = 0; timeLeft = targetTime;
            if (mIdx >= mods.length) { exitToMenu(); alert("🎉 Campaign Complete!"); logout(); return; }
            document.getElementById('campaign-display').innerText = `Module ${mIdx + 1}: ${mods[mIdx].name} | Level ${lvl}/10`;
            document.getElementById('t').innerText = timeLeft; document.getElementById('tg').innerText = targetTime; document.getElementById('md').innerText = mode.toUpperCase(); document.getElementById('w').innerText = "0"; document.getElementById('msg').innerText = ""; document.getElementById('nxt').disabled = true; document.getElementById('in').disabled = false; document.getElementById('in').value = '';
            let words = [...mods[mIdx][mode]].sort(() => Math.random() - 0.5).slice(0, 10).join(' ');
            document.getElementById('box').innerHTML = [...words].map(c => `<span class="letter">${c}</span>`).join('');
            if (document.getElementById('box').children.length > 0) document.getElementById('box').children[0].classList.add('current');
            document.getElementById('in').focus();
        }

        document.getElementById('in').oninput = (e) => {
            let spans = document.getElementById('box').children;
            if (!active && timeLeft === targetTime) {
                active = true;
                interval = setInterval(() => {
                    if (--timeLeft <= 0) {
                        clearInterval(interval); document.getElementById('in').disabled = true;
                        document.getElementById('msg').innerHTML = `<span style="color:#f38ba8">Failed! Time +10s</span>`;
                        targetTime += 10; save();
                        document.getElementById('nxt').innerText = "Retry Level (+10s)"; document.getElementById('nxt').disabled = false;
                    }
                    document.getElementById('t').innerText = timeLeft;
                    document.getElementById('w').innerText = Math.round((correct / 5) / ((targetTime - timeLeft) / 60)) || 0;
                }, 1000);
            }

            if (timeLeft <= 0 || idx >= spans.length) return;
            spans[idx].classList.remove('current');

            if (e.inputType === 'deleteContentBackward') {
                if (idx > 0) { idx--; spans[idx].className = 'letter current'; if (spans[idx].classList.contains('correct')) correct--; }
            } else {
                let char = document.getElementById('in').value.slice(-1);
                if (!char) return;
                if (char === spans[idx].innerText) { spans[idx].classList.add('correct'); correct++; }
                else spans[idx].classList.add('incorrect');
                idx++;
                if (idx >= spans.length) {
                    clearInterval(interval); document.getElementById('in').disabled = true;
                    document.getElementById('msg').innerHTML = `<span style="color:#a6e3a1">Cleared! WPM: ${document.getElementById('w').innerText}</span>`;
                    lvl++; if (lvl > 10) { lvl = 1; mIdx++; }
                    targetTime = Math.max(10, targetTime - 10); save();
                    document.getElementById('nxt').innerText = "Next Level (-10s)"; document.getElementById('nxt').disabled = false;
                } else spans[idx].classList.add('current');
            }
            document.getElementById('in').value = '';
        };
    </script>
</body>
</html>
