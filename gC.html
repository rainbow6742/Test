<!DOCTYPE html>
<html>
<body style="margin:0; overflow:hidden; background:#111;">
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
let px = 0, py = 0, score = 0, keys = {}, targets = [], bullets = [];
const resize = () => { c.width = window.innerWidth; c.height = window.innerHeight; };
window.onresize = resize; resize();

// Pointer Lock for Center Crosshair
window.onclick = () => c.requestPointerLock();
document.onmousemove = (e) => { if (document.pointerLockElement === c) { px += e.movementX; py += e.movementY; } };
document.onkeydown = (e) => { keys[e.key.toLowerCase()] = true; };
document.onkeyup = (e) => { keys[e.key.toLowerCase()] = false; };

// Actions: Space (Dash) & E (Shield Flare)
window.onkeypress = (e) => {
    if (e.key === ' ') { px += (keys.d?2:keys.a?-2:0)*50; py += (keys.s?2:keys.w?-2:0)*50; }
    if (e.key.toLowerCase() === 'e') { bullets.push({x:c.width/2, y:c.height/2, r:60, life:5}); } // Shield blast
};
window.onmousedown = () => bullets.push({x:c.width/2, y:c.height/2, r:6, vy:-8}); // Shoot

setInterval(() => targets.push({x: px + c.width/2 + (Math.random()-0.5)*800, y: py + c.height/2 + (Math.random()-0.5)*800}), 600);

function loop() {
    ctx.fillStyle = 'rgba(17,17,17,0.3)'; ctx.fillRect(0, 0, c.width, c.height); // Motion blur
    if (keys.w) py -= 5; if (keys.s) py += 5; if (keys.a) px -= 5; if (keys.d) px += 5;

    let cx = c.width / 2, cy = c.height / 2;
    
    // Draw Bullets & Shields
    bullets.forEach((b, bi) => {
        b.y += b.vy || 0; if(b.life) b.life--;
        ctx.fillStyle = b.life ? 'rgba(0,255,200,0.4)' : '#ff0';
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
        if (b.y < 0 || b.life === 0) bullets.splice(bi, 1);
    });

    // Draw Targets
    targets.forEach((t, ti) => {
        let sx = t.x - px, sy = t.y - py;
        ctx.fillStyle = '#f55'; ctx.beginPath(); ctx.arc(sx, sy, 15, 0, 7); ctx.fill();
        
        bullets.forEach((b, bi) => {
            if (Math.hypot(sx - b.x, sy - b.y) < (b.r + 15)) {
                targets.splice(ti, 1); if(!b.life) bullets.splice(bi, 1); score += 10;
            }
        });
    });

    // Crosshair & Player Core
    ctx.fillStyle = '#0fcc'; ctx.beginPath(); ctx.arc(cx, cy, 8, 0, 7); ctx.fill();
    ctx.strokeStyle = '#0fcc'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx-15, cy); ctx.lineTo(cx+15, cy); ctx.moveTo(cx, cy-15); ctx.lineTo(cx, cy+15); ctx.stroke();

    // UI Score
    ctx.fillStyle = '#fff'; ctx.font = '20px sans-serif'; ctx.fillText(`Score: ${score}`, 20, 40);
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
