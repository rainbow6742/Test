<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>game.html</title>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    #game {
      position: relative;
      width: 380px;
      height: 640px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    }
    canvas {
      background: #1e293b;
      display: block;
      width: 100%;
      height: 100%;
    }
    #ui {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 16px;
      pointer-events: none;
    }
    .pill {
      background: rgba(15, 23, 42, 0.7);
      padding: 6px 12px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    button {
      padding: 10px 24px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 20px;
      border: none;
      background: #0ea5e9;
      color: #fff;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
</head>
<body>

<div id="game">
  <canvas id="canvas" width="380" height="640"></canvas>
  <div id="ui">
    <div class="pill">👥 <span id="crowd-val">10</span></div>
    <div class="pill">🏁 <span id="dist-val">0%</span></div>
  </div>
  <div id="overlay">
    <h2 id="result-status"></h2>
    <p id="result-detail" style="margin-top: 8px; color: #94a3b8;"></p>
    <button onclick="restart()">Play Again</button>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const crowdVal = document.getElementById('crowd-val');
const distVal = document.getElementById('dist-val');
const overlay = document.getElementById('overlay');
const resultStatus = document.getElementById('result-status');
const resultDetail = document.getElementById('result-detail');

// Track Settings
const PLAYER_SCREEN_Y = 520; // Anchored near bottom of screen
const TRACK_FINISH_DIST = 14000;
const SPEED = 4; // Smooth forward movement

let playerX = 190;
let distanceTraveled = 0;
let crowd = 10;
let bossHP = 800;
const MAX_BOSS_HP = 800;
let isBossFight = false;
let gameOver = false;
let isDragging = false;

// 12 sets of gates placed ahead along the track
const initialGates = [
  { d: 900, left: { op: 'x', v: 2, label: 'x2' }, right: { op: '+', v: 50, label: '+50' } },
  { d: 2000, left: { op: '-', v: 25, label: '-25' }, right: { op: 'x', v: 3, label: 'x3' } },
  { d: 3100, left: { op: '+', v: 70, label: '+70' }, right: { op: '/', v: 2, label: '÷2' } },
  { d: 4200, left: { op: 'x', v: 1.5, label: 'x1.5' }, right: { op: '+', v: 100, label: '+100' } },
  { d: 5300, left: { op: '/', v: 3, label: '÷3' }, right: { op: 'x', v: 2, label: 'x2' } },
  { d: 6400, left: { op: '+', v: 75, label: '+75' }, right: { op: '-', v: 40, label: '-40' } },
  { d: 7600, left: { op: 'x', v: 4, label: 'x4' }, right: { op: '+', v: 50, label: '+50' } },
  { d: 8800, left: { op: '/', v: 2, label: '÷2' }, right: { op: 'x', v: 2, label: 'x2' } },
  { d: 10000, left: { op: '+', v: 100, label: '+100' }, right: { op: '-', v: 50, label: '-50' } },
  { d: 11200, left: { op: 'x', v: 3, label: 'x3' }, right: { op: 'x', v: 1.5, label: 'x1.5' } },
  { d: 12400, left: { op: '-', v: 60, label: '-60' }, right: { op: '+', v: 120, label: '+120' } },
  { d: 13400, left: { op: 'x', v: 2, label: 'x2' }, right: { op: 'x', v: 3, label: 'x3' } }
];

let gates = [];

function restart() {
  playerX = 190;
  distanceTraveled = 0;
  crowd = 10;
  bossHP = MAX_BOSS_HP;
  isBossFight = false;
  gameOver = false;
  gates = initialGates.map(g => ({ ...g, passed: false }));
  overlay.style.display = 'none';
  crowdVal.innerText = crowd;
  distVal.innerText = '0%';
  requestAnimationFrame(loop);
}

// Steering
canvas.addEventListener('pointerdown', e => { isDragging = true; updatePos(e); });
window.addEventListener('pointermove', e => { if (isDragging) updatePos(e); });
window.addEventListener('pointerup', () => { isDragging = false; });
function updatePos(e) {
  const rect = canvas.getBoundingClientRect();
  playerX = Math.max(45, Math.min(335, e.clientX - rect.left));
}
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') playerX = Math.max(45, playerX - 20);
  if (e.key === 'ArrowRight' || e.key === 'd') playerX = Math.min(335, playerX + 20);
});

function applyMath(gate) {
  if (gate.op === '+') crowd += gate.v;
  if (gate.op === '-') crowd = Math.max(0, crowd - gate.v);
  if (gate.op === 'x') crowd = Math.round(crowd * gate.v);
  if (gate.op === '/') crowd = Math.max(0, Math.floor(crowd / gate.v));
  crowdVal.innerText = crowd;
}

function endGame(won, msg) {
  gameOver = true;
  resultStatus.innerText = won ? '🎉 VICTORY!' : '💀 DEFEAT';
  resultStatus.style.color = won ? '#38bdf8' : '#f43f5e';
  resultDetail.innerText = msg;
  overlay.style.display = 'flex';
}

function update() {
  if (gameOver) return;

  if (!isBossFight) {
    distanceTraveled += SPEED;
    distVal.innerText = Math.min(100, Math.floor((distanceTraveled / TRACK_FINISH_DIST) * 100)) + '%';

    // Check collision with gates
    gates.forEach(g => {
      // Gate reaches player's position
      if (!g.passed && distanceTraveled >= g.d) {
        g.passed = true;
        applyMath(playerX < 190 ? g.left : g.right);
      }
    });

    if (crowd <= 0) endGame(false, 'Your crowd was wiped out!');
    if (distanceTraveled >= TRACK_FINISH_DIST) isBossFight = true;
  } else {
    // Boss clash
    if (crowd > 0 && bossHP > 0) {
      crowd = Math.max(0, crowd - 2);
      bossHP = Math.max(0, bossHP - 5);
      crowdVal.innerText = crowd;
    } else if (bossHP <= 0) {
      endGame(true, `Boss defeated! Reward: ${crowd * 15 + 500} Gems!`);
    } else if (crowd <= 0) {
      endGame(false, 'The Boss overpowered your squad!');
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Road Lane Dividers
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 2;
  ctx.setLineDash([20, 20]);
  ctx.lineDashOffset = -distanceTraveled;
  ctx.beginPath();
  ctx.moveTo(190, 0); ctx.lineTo(190, canvas.height);
  ctx.stroke();
  ctx.setLineDash([]);

  // Draw Gates (Approaching from the TOP toward the player)
  gates.forEach(g => {
    // Object screen Y: comes down from top as distanceTraveled increases toward g.d
    const screenY = PLAYER_SCREEN_Y - (g.d - distanceTraveled);

    if (screenY > -50 && screenY < canvas.height + 50) {
      // Left Gate
      const isBadL = g.left.op === '-' || g.left.op === '/';
      ctx.fillStyle = isBadL ? 'rgba(239, 68, 68, 0.85)' : 'rgba(59, 130, 246, 0.85)';
      ctx.fillRect(20, screenY - 18, 165, 36);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 15px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(g.left.label, 102, screenY + 5);

      // Right Gate
      const isBadR = g.right.op === '-' || g.right.op === '/';
      ctx.fillStyle = isBadR ? 'rgba(239, 68, 68, 0.85)' : 'rgba(59, 130, 246, 0.85)';
      ctx.fillRect(195, screenY - 18, 165, 36);
      ctx.fillStyle = '#fff';
      ctx.fillText(g.right.label, 277, screenY + 5);
    }
  });

  // Boss / Finish Line approaching from top
  const finishScreenY = PLAYER_SCREEN_Y - (TRACK_FINISH_DIST - distanceTraveled);
  if (finishScreenY > -100 && finishScreenY < canvas.height) {
    // Finish tape
    ctx.fillStyle = '#e11d48';
    ctx.fillRect(20, finishScreenY, 340, 8);

    // Boss Body
    ctx.fillStyle = '#dc2626';
    ctx.beginPath();
    ctx.arc(190, finishScreenY - 60, 45, 0, Math.PI * 2);
    ctx.fill();

    // Boss HP Bar
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(90, finishScreenY - 120, 200, 10);
    ctx.fillStyle = '#22c55e';
    ctx.fillRect(90, finishScreenY - 120, 200 * (bossHP / MAX_BOSS_HP), 10);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px sans-serif';
    ctx.fillText(`BOSS HP: ${bossHP}`, 190, finishScreenY - 128);
  }

  // Draw Player Crowd (Anchored near the bottom)
  const spread = Math.min(38, 6 + Math.sqrt(crowd) * 2.2);
  const units = Math.min(crowd, 40);
  ctx.fillStyle = '#38bdf8';
  for (let i = 0; i < units; i++) {
    const angle = i * 2.4;
    const rad = (i / units) * spread;
    const ux = playerX + Math.cos(angle) * rad;
    const uy = PLAYER_SCREEN_Y + Math.sin(angle) * rad;
    ctx.beginPath();
    ctx.arc(ux, uy, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  // Crowd Total Label above squad
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 15px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(crowd, playerX, PLAYER_SCREEN_Y - spread - 10);
}

function loop() {
  update();
  draw();
  if (!gameOver) requestAnimationFrame(loop);
}

restart();
</script>
</body>
</html>
