<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack-a-Mole Game</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom, #74b9ff, #a29bfe);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }

        h1 {
            color: #2d3436;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px white;
        }

        .scoreboard {
            font-size: 24px;
            font-weight: bold;
            color: #2d3436;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 600px;
            width: 100%;
            padding: 20px;
        }

        .hole {
            background-color: #636e72;
            height: 120px;
            border-radius: 50% / 30%;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 10px 0 rgba(0,0,0,0.5), 0 4px 6px rgba(0,0,0,0.3);
            border-bottom: 15px solid #2d3436;
        }

        .mole {
            width: 80%;
            height: 85%;
            background: #e17055;
            border-radius: 50% 50% 0 0;
            position: absolute;
            bottom: -100%;
            left: 10%;
            transition: bottom 0.1s ease-out;
            cursor: pointer;
            border: 3px solid #2d3436;
            box-sizing: border-box;
        }

        /* Eyes and nose for the mole using CSS pseudo-elements */
        .mole::before {
            content: '• •';
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            color: #2d3436;
            letter-spacing: 5px;
        }

        .mole::after {
            content: '';
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 10px;
            background: #2d3436;
            border-radius: 50%;
        }

        .hole.up .mole {
            bottom: 0;
        }

        .btn {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            background-color: #00b894;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: #55efc4;
        }

        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h1>Whack-a-Mole!</h1>
    
    <div class="scoreboard">
        Score: <span id="score">0</span> | Time Left: <span id="time">30</span>s
    </div>

    <button class="btn" id="start-btn" onclick="startGame()">Start Game</button>

    <div class="game-grid">
        <div class="hole"><div class="mole" onclick="whack(this)"></div></div>
        <div class="hole"><div class="mole" onclick="whack(this)"></div></div>
        <div class="hole"><div class="mole" onclick="whack(this)"></div></div>
        <div class="hole"><div class="mole" onclick="whack(this)"></div></div>
        <div class="hole"><div class="mole" onclick="whack(this)"></div></div>
        <div class="hole"><div class="mole" onclick="whack(this)"></div></div>
        <div class="hole"><div class="mole" onclick="whack(this)"></div></div>
        <div class="hole"><div class="mole" onclick="whack(this)"></div></div>
        <div class="hole"><div class="mole" onclick="whack(this)"></div></div>
    </div>

    <script>
        const holes = document.querySelectorAll('.hole');
        const scoreDisplay = document.getElementById('score');
        const timeDisplay = document.getElementById('time');
        const startButton = document.getElementById('start-btn');
        
        let lastHole;
        let timeUp = false;
        let score = 0;
        let countdown;
        let moleTimer;
        let gameDuration = 30; // Game time in seconds

        function randomTime(min, max) {
            return Math.round(Math.random() * (max - min) + min);
        }

        function randomHole(holes) {
            const idx = Math.floor(Math.random() * holes.length);
            const hole = holes[idx];
            if (hole === lastHole) {
                return randomHole(holes);
            }
            lastHole = hole;
            return hole;
        }

        function peep() {
            const time = randomTime(600, 1200); // speed range for mole up/down
            const hole = randomHole(holes);
            hole.classList.add('up');
            
            moleTimer = setTimeout(() => {
                hole.classList.remove('up');
                if (!timeUp) peep();
            }, time);
        }

        function startGame() {
            // Reset everything
            score = 0;
            timeUp = false;
            scoreDisplay.textContent = 0;
            startButton.disabled = true;
            startButton.textContent = "Playing...";
            
            let timeLeft = gameDuration;
            timeDisplay.textContent = timeLeft;

            peep();

            // Countdown timer loop
            countdown = setInterval(() => {
                timeLeft--;
                timeDisplay.textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    clearTimeout(moleTimer);
                    timeUp = true;
                    // Force hide any active moles
                    holes.forEach(hole => hole.classList.remove('up'));
                    startButton.disabled = false;
                    startButton.textContent = "Play Again";
                    alert(`Game Over! Your final score is ${score}`);
                }
            }, 1000);
        }

        function whack(moleElement) {
            // Check if the mole is actually visible up
            const holeElement = moleElement.parentElement;
            if (!holeElement.classList.contains('up')) return;
            
            score++;
            holeElement.classList.remove('up');
            scoreDisplay.textContent = score;
        }
    </script>
</body>
</html>
