<!DOCTYPE html>
<html>
<head>
    <title>5x Obby Builder</title>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; text-align: center; margin: 20px; overflow: hidden; }
        canvas { background: #223; border: 3px solid #fff; cursor: crosshair; }
        .btn { background: #444; color: #fff; border: none; padding: 6px 12px; margin: 0 4px 10px; cursor: pointer; font-weight: bold; }
        .active { background: #00ffcc; color: #000; }
    </style>
</head>
<body>
    <button id="mBtn" class="btn active">🎮 PLAY MODE</button>
    Block: <select id="bSel" class="btn"><option value="safe">🟩 Ground</option><option value="lava">🟥 Lava</option><option value="win">🟨 Goal</option></select>
    <button id="clr" class="btn" style="background:#800">Clear Custom</button><br>
    <canvas id="c" width="800" height="400"></canvas>
    <p>Move: <b>A/D / Arrows</b> | Jump: <b>W / Space</b> | Build: <b>Click canvas in BUILD mode</b></p>

    <script>
        const canvas = document.getElementById("c"), ctx = canvas.getContext("2d"), vW = 4000;
        let camX = 0, isBuild = false, keys = {}, maps = [
            {x:0, y:340, w:200, h:60, t:"safe"}, {x:280, y:290, w:60, h:20, t:"safe"}, {x:400, y:240, w:60, h:20, t:"safe"},
            {x:520, y:190, w:60, h:20, t:"safe"}, {x:650, y:150, w:100, h:250, t:"safe"}, {x:200, y:390, w:3600, h:10, t:"lava"},
            {x:850, y:250, w:60, h:20, t:"safe"}, {x:1000, y:200, w:60, h:20, t:"safe"}, {x:1200, y:160, w:100, h:240, t:"safe"},
            {x:1400, y:280, w:60, h:20, t:"safe"}, {x:1600, y:220, w:60, h:20, t:"safe"}, {x:1800, y:150, w:120, h:250, t:"safe"},
            {x:2100, y:250, w:50, h:20, t:"safe"}, {x:2300, y:200, w:50, h:20, t:"safe"}, {x:2500, y:150, w:100, h:250, t:"safe"},
            {x:2750, y:250, w:60, h:20, t:"safe"}, {x:2950, y:200, w:60, h:20, t:"safe"}, {x:3150, y:160, w:100, h:240, t:"safe"},
            {x:3400, y:220, w:60, h:20, t:"safe"}, {x:3600, y:170, w:60, h:20, t:"safe"}, {x:3800, y:120, w:150, h:280, t:"win"}
        ], cust = [];

        const p = { x:50, y:200, w:20, h:20, vx:0, vy:0, speed:5, jump:11, gnd:false };
        const reset = () => { p.x = 50; p.y = 200; p.vx = p.vy = camX = 0; };

        window.onkeydown = (e) => keys[e.key] = true; window.onkeyup = (e) => keys[e.key] = false;
        document.getElementById("mBtn").onclick = (e) => { isBuild = !isBuild; e.target.innerText = isBuild ? "🛠️ BUILD MODE" : "🎮 PLAY MODE"; e.target.classList.toggle("active"); };
        document.getElementById("clr").onclick = () => cust = [];
        canvas.onmousedown = (e) => { if(!isBuild) return; const r = canvas.getBoundingClientRect(); cust.push({ x: Math.floor(e.clientX - r.left + camX - 30), y: Math.floor(e.clientY - r.top - 10), w: 60, h: 20, t: document.getElementById("bSel").value }); };

        function loop() {
            let mv = (keys.ArrowRight||keys.d||keys.D) - (keys.ArrowLeft||keys.a||keys.A);
            if (!isBuild) {
                p.vx = mv * p.speed;
                if ((keys.ArrowUp||keys.w||keys.W||keys[" "]) && p.gnd) { p.vy = -p.jump; p.gnd = false; }
                p.vy += 0.5; p.x += p.vx; p.y += p.vy;
                if (p.x < 0) p.x = 0; if (p.x + p.w > vW) p.x = vW - p.w; if (p.y > canvas.height) reset();
                p.gnd = false;

                [...maps, ...cust].forEach(b => {
                    if (p.x < b.x + b.w && p.x + p.w > b.x && p.y < b.y + b.h && p.y + p.w > b.y) {
                        if (b.t === "lava") reset();
                        else if (b.t === "win") { alert("🏆 Victory!"); reset(); }
                        else if (p.vy > 0 && p.y + p.w - p.vy <= b.y) { p.y = b.y - p.w; p.vy = 0; p.gnd = true; }
                    }
                });
                camX = Math.max(0, Math.min(p.x - canvas.width / 3, vW - canvas.width));
            } else {
                camX = Math.max(0, Math.min(camX + mv * 10, vW - canvas.width));
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save(); ctx.translate(-camX, 0);
            [...maps, ...cust].forEach(b => { ctx.fillStyle = b.t==="lava" ? "#f33" : b.t==="win" ? "#fd0" : "#4f4"; ctx.fillRect(b.x, b.y, b.w, b.h); });
            ctx.fillStyle = "#0fc"; ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.restore(); requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
