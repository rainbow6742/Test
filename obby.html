<!DOCTYPE html>
<html>
<head>
    <title>Saved Multi-Level Obby Builder</title>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; text-align: center; margin: 20px; overflow: hidden; }
        canvas { background: #1a1a2e; border: 3px solid #fff; cursor: crosshair; display: block; margin: 0 auto; }
        .btn { background: #444; color: #fff; border: none; padding: 6px 12px; margin: 0 4px 10px; cursor: pointer; font-weight: bold; vertical-align: middle; }
        .active { background: #00ffcc; color: #000; }
        select { vertical-align: middle; }
        label { font-weight: bold; margin-left: 10px; font-size: 14px; vertical-align: middle; }
        input[type="color"] { border: none; width: 35px; height: 30px; background: transparent; cursor: pointer; vertical-align: middle; }
    </style>
</head>
<body>
    <button id="mBtn" class="btn active">🎮 PLAY MODE</button>
    
    Level: 
    <select id="lvlSel" class="btn" onchange="switchLevel(); this.blur()">
        <option value="0">Level 1</option>
        <option value="1">Level 2</option>
        <option value="2">Level 3</option>
    </select>

    Block: 
    <select id="bSel" class="btn" onchange="this.blur()">
        <option value="safe">🟩 Block</option>
        <option value="semi">🟪 Platfrom</option>
        <option value="lava">🟥 Lava</option>
        <option value="win">🟨 End</option>
        <option value="erase">❌ Eraser Tool</option>
    </select>

    <label id="colLabel" for="cPick">Paint Color:</label>
    <input type="color" id="cPick" value="#44ff44" onchange="this.blur()">
    
    <button id="clr" class="btn" style="background:#800">Clear Slot</button><br>
    <canvas id="c" width="800" height="400"></canvas>
    <p>Move: <b>A/D / Arrows</b> | Jump: <b>W / Space</b> | Build: <b>Click canvas in BUILD mode</b></p>

    <script>
        const canvas = document.getElementById("c"), ctx = canvas.getContext("2d"), vW = 4000, gS = 40;
        let camX = 0, isBuild = false, keys = {}, curLvl = 0;

        const premadeMaps = [
            [
                {x:0, y:360, w:240, h:40, t:"safe", c:"#44ff44"}, {x:320, y:280, w:80, h:40, t:"safe", c:"#44ff44"}, {x:480, y:240, w:80, h:40, t:"semi", c:"#bb00ff"},
                {x:640, y:160, w:120, h:40, t:"safe", c:"#44ff44"}, {x:240, y:360, w:3560, h:40, t:"lava", c:"#ff3333"}, {x:3760, y:120, w:160, h:280, t:"win", c:"#ffd700"}
            ],
            [{x:0, y:360, w:200, h:40, t:"safe", c:"#44ff44"}, {x:200, y:360, w:3600, h:40, t:"lava", c:"#ff3333"}, {x:3800, y:160, w:200, h:240, t:"win", c:"#ffd700"}],
            [{x:0, y:360, w:200, h:40, t:"safe", c:"#44ff44"}, {x:200, y:360, w:3600, h:40, t:"lava", c:"#ff3333"}, {x:3800, y:160, w:200, h:240, t:"win", c:"#ffd700"}]
        ];

        let customLevels = [[], [], []];

        // --- LOCAL STORAGE FUNCTIONS ---
        function loadFromStorage() {
            try {
                const savedData = localStorage.getItem("obby_custom_levels");
                if (savedData) { customLevels = JSON.parse(savedData); }
            } catch(e) { console.error("Could not load saves", e); }
        }
        function saveToStorage() {
            localStorage.setItem("obby_custom_levels", JSON.stringify(customLevels));
        }

        function getActiveBlocks() {
            if (isBuild) return customLevels[curLvl];
            return [...premadeMaps[curLvl], ...customLevels[curLvl]];
        }

        const p = { x:40, y:200, w:24, h:24, vx:0, vy:0, speed:5, jump:10, gnd:false };
        const reset = () => { p.x = 40; p.y = 200; p.vx = p.vy = camX = 0; };

        window.onkeydown = (e) => { keys[e.key] = true; if(["Space","ArrowUp","ArrowDown"].includes(e.code) && !isBuild) e.preventDefault(); }; 
        window.onkeyup = (e) => keys[e.key] = false;
        
        const bSel = document.getElementById("bSel");
        const cPick = document.getElementById("cPick");
        
        // Match default color matching picker tool on dropdown switch
        bSel.oninput = () => {
            if(bSel.value === "safe") cPick.value = "#44ff44";
            if(bSel.value === "semi") cPick.value = "#bb00ff";
            if(bSel.value === "lava") cPick.value = "#ff3333";
            if(bSel.value === "win")  cPick.value = "#ffd700";
            document.getElementById("colLabel").style.display = bSel.value === "erase" ? "none" : "inline";
            cPick.style.display = bSel.value === "erase" ? "none" : "inline";
        };

        document.getElementById("mBtn").onclick = (e) => { 
            isBuild = !isBuild; 
            e.target.innerText = isBuild ? "🛠️ BUILD MODE" : "🎮 PLAY MODE"; 
            e.target.classList.toggle("active");
            e.target.blur(); reset();
        };
        
        document.getElementById("clr").onclick = (e) => { customLevels[curLvl] = []; saveToStorage(); e.target.blur(); };

        function switchLevel() { curLvl = parseInt(document.getElementById("lvlSel").value); reset(); }
        
        canvas.onmousedown = (e) => { 
            if(!isBuild) return; 
            const r = canvas.getBoundingClientRect(); 
            const snapX = Math.floor((e.clientX - r.left + camX) / gS) * gS;
            const snapY = Math.floor((e.clientY - r.top) / gS) * gS;
            const brush = bSel.value;

            const existingIdx = customLevels[curLvl].findIndex(b => b.x === snapX && b.y === snapY);

            if (brush === "erase") {
                if (existingIdx !== -1) customLevels[curLvl].splice(existingIdx, 1);
            } else {
                const blockColor = cPick.value;
                if (existingIdx === -1) {
                    customLevels[curLvl].push({ x: snapX, y: snapY, w: gS, h: gS, t: brush, c: blockColor }); 
                } else {
                    customLevels[curLvl][existingIdx].t = brush;
                    customLevels[curLvl][existingIdx].c = blockColor;
                }
            }
            saveToStorage(); // Auto-save edits instantly
        };

        function loop() {
            let mv = (keys.ArrowRight||keys.d||keys.D||false) - (keys.ArrowLeft||keys.a||keys.A||false);
            const blocks = getActiveBlocks();
            
            if (!isBuild) {
                p.vx = mv * p.speed; p.x += p.vx;
                if (p.x < 0) p.x = 0; if (p.x + p.w > vW) p.x = vW - p.w;

                blocks.forEach(b => {
                    if (p.x < b.x + b.w && p.x + p.w > b.x && p.y < b.y + b.h && p.y + p.h > b.y) {
                        if (b.t === "lava") reset();
                        else if (b.t === "win") { setTimeout(() => { alert("🏆 Level Cleared!"); reset(); }, 10); }
                        else if (b.t === "safe") {
                            if (p.vx > 0) p.x = b.x - p.w;
                            if (p.vx < 0) p.x = b.x + b.w;
                        }
                    }
                });

                if ((keys.ArrowUp||keys.w||keys.W||keys[" "]) && p.gnd) { p.vy = -p.jump; p.gnd = false; }
                p.vy += 0.5; p.y += p.vy;
                if (p.y > canvas.height) reset();
                p.gnd = false;

                blocks.forEach(b => {
                    if (p.x < b.x + b.w && p.x + p.w > b.x && p.y < b.y + b.h && p.y + p.h > b.y) {
                        if (b.t === "lava") reset();
                        else if (b.t === "win") { setTimeout(() => { alert("🏆 Level Cleared!"); reset(); }, 10); }
                        else if (b.t === "safe") {
                            if (p.vy < 0) { p.y = b.y + b.h; p.vy = 0; }
                            else if (p.vy > 0) { p.y = b.y - p.h; p.vy = 0; gnd = true; p.gnd = true; }
                        } 
                        else if (b.t === "semi") {
                            if (p.vy > 0 && (p.y + p.h - p.vy) <= b.y) { p.y = b.y - p.h; p.vy = 0; p.gnd = true; }
                        }
                    }
                });
                camX = Math.max(0, Math.min(p.x - canvas.width / 3, vW - canvas.width));
            } else {
                camX = Math.max(0, Math.min(camX + mv * 10, vW - canvas.width));
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save(); ctx.translate(-camX, 0);
            
            if (isBuild) {
                ctx.strokeStyle = "rgba(255,255,255,0.06)"; ctx.lineWidth = 1;
                for (let x = 0; x < vW; x += gS) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
                for (let y = 0; y < canvas.height; y += gS) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(vW, y); ctx.stroke(); }
            }

            blocks.forEach(b => { 
                ctx.fillStyle = b.c || "#fff"; 
                ctx.fillRect(b.x, b.y, b.w, b.h); 
                if (b.t === "semi") { ctx.fillStyle = "rgba(255,255,255,0.4)"; ctx.fillRect(b.x, b.y, b.w, 6); }
            });
            
            if (!isBuild) { ctx.fillStyle = "#0fc"; ctx.fillRect(p.x, p.y, p.w, p.h); }
            ctx.restore(); requestAnimationFrame(loop);
        }
        
        loadFromStorage(); // Auto-load levels on startup
        loop();
    </script>
</body>
</html>
