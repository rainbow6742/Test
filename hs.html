<!DOCTYPE html>
<html>
<head>
  <title>Hearthstone Lite with Spells</title>
  <style>
    body { background: #1a0f05; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; padding: 10px; justify-content: space-between; user-select: none; }
    .row { display: flex; justify-content: space-between; background: rgba(0,0,0,0.4); padding: 8px 15px; border-radius: 8px; align-items: center; }
    .hp { background: #900; padding: 5px 12px; border-radius: 50%; font-weight: bold; border: 2px solid #fff; }
    .mana { color: #00ddff; font-weight: bold; }
    .zone { height: 110px; border: 1px dashed #443322; border-radius: 8px; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .card { width: 75px; height: 105px; background: #2d1f10; border: 2px solid #a17846; border-radius: 6px; position: relative; padding: 4px; font-size: 0.65rem; cursor: pointer; text-align: center; }
    .card.spell { border-color: #0070ff; background: #101f30; }
    .card.ready { box-shadow: 0 0 8px #00ff22; border-color: #00ff22; }
    .card.target { box-shadow: 0 0 8px #ff0000; border-color: #ff0000; }
    .stat { position: absolute; width: 18px; height: 18px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #fff; }
    .m { top: -3px; left: -3px; background: #0070ff; }
    .a { bottom: -3px; left: -3px; background: #fcd34d; color: #000; }
    .h { bottom: -3px; right: -3px; background: #ef4444; }
    button { background: #f5a623; border: none; padding: 8px 15px; font-weight: bold; cursor: pointer; border-radius: 4px; }
    #ai-hand .card { background: #111 !important; border-color: #333 !important; color: transparent; }
  </style>
</head>
<body>

  <!-- AI SIDE -->
  <div class="row"><div>AI Hero <span id="ai-hp" class="hp">30</span></div><div id="ai-mana" class="mana"></div></div>
  <div id="ai-hand" class="zone"></div>
  <div id="ai-board" class="zone"></div>

  <!-- PLAYER SIDE -->
  <div id="player-board" class="zone"></div>
  <div id="player-hand" class="zone"></div>
  <div class="row">
    <div>Your Hero <span id="p-hp" class="hp">30</span></div>
    <button id="end-btn" onclick="endTurn()">END TURN</button>
    <div id="p-mana" class="mana"></div>
  </div>

  <script>
    // Minions and Spells catalog
    const POOL = [
      { name: "Murloc", type: "m", mana: 1, atk: 2, hp: 1 },
      { name: "Yeti", type: "m", mana: 4, atk: 4, hp: 5 },
      { name: "Ogre", type: "m", mana: 6, atk: 6, hp: 7 },
      { name: "Fireball", type: "s", mana: 2, effect: "damage", value: 3 }, // Spell: Deals 3 damage to enemy hero
      { name: "Holy Light", type: "s", mana: 2, effect: "heal", value: 4 }   // Spell: Heals your hero for 4
    ];

    let state = { pHP: 30, aiHP: 30, pMax: 1, pMana: 1, aiMax: 1, aiMana: 1, pHand: [], pBoard: [], aiHand: [], aiBoard: [], pTurn: true, sel: null };
    let idGen = 0;

    function randCard() { return { ...POOL[Math.floor(Math.random() * POOL.length)], id: idGen++ }; }
    
    function init() {
      for(let i=0; i<3; i++) { state.pHand.push(randCard()); state.aiHand.push(randCard()); }
      render();
    }

    function render() {
      if (state.aiHP <= 0) alert("WIN!"); if (state.pHP <= 0) alert("LOSE!");
      document.getElementById('p-hp').innerText = state.pHP; document.getElementById('ai-hp').innerText = state.aiHP;
      document.getElementById('p-mana').innerText = `Mana: ${state.pMana}/${state.pMax}`;
      document.getElementById('ai-mana').innerText = `Mana: ${state.aiMana}/${state.aiMax}`;
      document.getElementById('end-btn').disabled = !state.pTurn;

      // Render Hands & Boards
      drawZone('player-hand', state.pHand, c => clickHand(c));
      drawZone('player-board', state.pBoard, c => clickBoard(c));
      drawZone('ai-board', state.aiBoard, c => clickEnemy(c));
      document.getElementById('ai-hp').style.cursor = state.sel && state.sel.ready ? 'pointer' : 'default';
      document.getElementById('ai-hp').onclick = () => { if(state.sel && state.sel.ready) { state.aiHP -= state.sel.atk; state.sel.ready = false; state.sel = null; render(); } };

      // Secret Enemy Hand Elements
      const aiHandEl = document.getElementById('ai-hand'); aiHandEl.innerHTML = '';
      state.aiHand.forEach(() => aiHandEl.innerHTML += `<div class="card"></div>`);
    }

    function drawZone(id, arr, clickFn) {
      const el = document.getElementById(id); el.innerHTML = '';
      arr.forEach(c => {
        let isSpell = c.type === 's';
        let div = document.createElement('div');
        div.className = `card ${isSpell ? 'spell' : ''} ${c.ready && id==='player-board' ? 'ready' : ''} ${state.sel && id==='ai-board' ? 'target' : ''}`;
        div.innerHTML = `<div class="stat m">${c.mana}</div><b>${c.name}</b>` + 
          (isSpell ? `<br><small>${c.effect} ${c.value}</small>` : `<div class="stat a">${c.atk}</div><div class="stat h">${c.hp}</div>`);
        div.onclick = () => clickFn(c);
        el.appendChild(div);
      });
    }

    function clickHand(c) {
      if (!state.pTurn || state.pMana < c.mana) return;
      state.pMana -= c.mana;
      state.pHand = state.pHand.filter(x => x.id !== c.id);
      
      if (c.type === 'm') {
        state.pBoard.push({ ...c, ready: false }); // Minions sleep first turn
      } else {
        // Resolve Spell Instantly
        if (c.effect === "damage") state.aiHP -= c.value;
        if (c.effect === "heal") state.pHP = Math.min(30, state.pHP + c.value);
      }
      render();
    }

    function clickBoard(c) { if (state.pTurn && c.ready) { state.sel = c; render(); } }

    function clickEnemy(enemy) {
      if (state.sel) {
        enemy.hp -= state.sel.atk; state.sel.hp -= enemy.atk; state.sel.ready = false;
        state.pBoard = state.pBoard.filter(x => x.hp > 0); state.aiBoard = state.aiBoard.filter(x => x.hp > 0);
        state.sel = null; render();
      }
    }

    function endTurn() {
      state.pTurn = false; render();
      setTimeout(aiTurn, 600);
    }

    // AI logic execution
    function aiTurn() {
      state.aiMax = Math.min(10, state.aiMax + 1); state.aiMana = state.aiMax;
      if (state.aiHand.length < 5) state.aiHand.push(randCard());

      // AI Casts/Plays everything it can afford
      let choices = state.aiHand.filter(c => c.mana <= state.aiMana);
      choices.forEach(c => {
        state.aiMana -= c.mana;
        state.aiHand = state.aiHand.filter(x => x.id !== c.id);
        if (c.type === 'm') {
          state.aiBoard.push({ ...c, ready: true });
        } else {
          if (c.effect === "damage") state.pHP -= c.value;
          if (c.effect === "heal") state.aiHP = Math.min(30, state.aiHP + c.value);
        }
      });

      // AI Attacks with Board
      state.aiBoard.forEach(c => {
        if (state.pBoard.length > 0) {
          state.pBoard[0].hp -= c.atk; c.hp -= state.pBoard[0].atk;
        } else {
          state.pHP -= c.atk;
        }
      });

      state.pBoard = state.pBoard.filter(x => x.hp > 0); state.aiBoard = state.aiBoard.filter(x => x.hp > 0);
      
      // Flip back to Player
      state.pMax = Math.min(10, state.pMax + 1); state.pMana = state.pMax;
      if (state.pHand.length < 5) state.pHand.push(randCard());
      state.pBoard.forEach(c => c.ready = true);
      state.pTurn = true; render();
    }

    init();
  </script>
</body>
</html>
