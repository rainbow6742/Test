<!DOCTYPE html>
<html>
<head>
    <style>
        body { height: 100vh; margin: 0; background: #111; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        #prankBtn {
            position: absolute;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.1s ease;
        }
    </style>
</head>
<body>
    <button id="prankBtn" onmouseover="dodge()">Click to Close Tab</button>

    <script>
        function dodge() {
            const btn = document.getElementById('prankBtn');
            // Calculates a random spot on his screen to teleport to
            const x = Math.random() * (window.innerWidth - btn.offsetWidth);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight);
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }
    </script>
</body>
</html>
