<!DOCTYPE html>
<html>
<body style="margin:0; overflow:hidden; background:#111; font-family:sans-serif; color:#fff; display:flex; justify-content:center; align-items:center; height:100vh;">
<div id="auth" style="background:#222; padding:30px; border-radius:8px; text-align:center; max-width:300px; width:100%;">
    <h2 id="title">Arena Account</h2>
    <input id="usr" placeholder="Username" style="width:100%; margin:10px 0; padding:10px; background:#333; border:none; color:#fff; border-radius:4px;"><br>
    <input id="pwd" type="password" placeholder="Password (4+ chars)" style="width:100%; margin:10px 0; padding:10px; background:#333; border:none; color:#fff; border-radius:4px;"><br>
    <button onclick="auth()" style="width:100%; padding:10px; background:#0fcc; border:none; color:#111; font-weight:bold; cursor:pointer; border-radius:4px; margin-top:10px;">Enter</button>
    <p id="err" style="color:#ff5555; font-size:12px; margin-top:10px;"></p>
</div>

<!-- Main Game Menu Overlay -->
<div id="menu" style="display:none; background:rgba(34,34,34,0.95); padding:30px; border-radius:8px; text-align:center; position:absolute; z-index:10; width:320px;">
    <h2>Game Menu</h2>
    <p id="menu-hi" style="color:#0fcc;"></p>
    <div style="margin:20px 0;">
        <label style="cursor:pointer; font-size:18px;">
            <input type="checkbox" id="ai-toggle" style="transform:scale(1.3); margin-right:8px;"> Enable AI Bot Mode
        </label>
    </div>
    <button onclick="resumeGame()" style="width:100%; padding:10px; background:#0fcc; border:none; font-weight:bold; cursor:pointer; border-radius:4px; margin-bottom:10px;">Resume (Click Screen)</button>
    <button onclick="signOut()" style="width:100%; padding:10px; background:#ff5555; border:none; color:#fff; font-weight:bold; cursor:pointer; border-radius:4px;">Sign Out</button>
</div>

<canvas id="c" style="display:none; position:absolute; top:0; left:0;"></canvas>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d'), authDiv = document.getElementById('auth'), menuDiv = document.getElementById('menu'), err = document.getElementById('err'), aiToggle = document.getElementById('ai-toggle');
let px = 0, py = 0, score = 0, currentUsr = '', keys = {}, targets = [], bullets = [], hue = 0;
const resize = () => { c.width = window.innerWidth; c.height = window.innerHeight; };
window.onresize = resize; resize();

function auth() {
    let u = document.getElementById('usr').value.trim(), p = document.getElementById('pwd').value;
    if (!u || p.length < 4) { err.textContent = "Password must be 4+ characters!"; return; }
    let stored = localStorage.getItem('game_user_' + u);
    if (stored) {
        let user = JSON.parse(stored);
        if (user.pwd !== p) { err.textContent = "Wrong password!"; return; }
        score = user.highScore || 0;
    } else {
        localStorage.setItem('game_user_' + u, JSON.stringify({ pwd: p, highScore: 0 }));
        score = 0;
    }
    currentUsr = u; authDiv.style.display = 'none'; c.style.display = 'block';
    openMenu();
}

function openMenu() {
    document.exitPointerLock();
    document.getElementById('menu-hi').textContent = `Pilot: ${currentUsr} | High Score: ${score}`;
    menuDiv.style.display = 'block';
}

function resumeGame() {
    menuDiv.style.display = 'none';
    c.requestPointerLock();
}

function signOut() {
    currentUsr = ''; menuDiv.style.display = 'none'; c.style.display = 'none'; authDiv.style.display = 'block';
    document.getElementById('usr').value = ''; document.getElementById('pwd').value = ''; err.textContent = '';
}

// Track cursor locks and handle ESC key automatically returning to menu
document.addEventListener('pointerlockchange', () => {
    if (document.pointerLockElement !== c && currentUsr && menuDiv.style.display === 'none') {
        openMenu();
    }
});

window.onclick = () => { if(currentUsr && menuDiv.style.display === 'none') c.requestPointerLock(); };
document.onmousemove = (e) => { if (document.pointerLockElement === c && !aiToggle.checked) { px += e.movementX; py += e.movementY; } };
document.onkeydown = (e) => { keys[e.key.toLowerCase()] = true; };
document.onkeyup = (e) => { keys[e.key.toLowerCase()] = false; };

window.onkeypress = (e) => {
    if (!currentUsr || document.pointerLockElement !== c) return;
    if (e.key === ' ') { px += (keys.d?2:keys.a?-2:0)*50; py += (keys.s?2:keys.w?-2:0)*50; }
    if (e.key.toLowerCase() === 'e') { bullets.push({x:c.width/2, y:c.height/2, r:60, life:5}); }
};
window.onmousedown = () => { if(currentUsr && document.pointerLockElement === c && !aiToggle.checked) bullets.push({x:c.width/2, y:c.height/2, r:6, vy:-8}); };

// Spawners
setInterval(() => { 
    if(!currentUsr || menuDiv.style.display !== 'none') return;
    // Standard Targets
    targets.push({x: px + c.width/2 + (Math.random()-0.5)*1000, y: py + c.height/2 + (Math.random()-0.5)*1000, type: 'normal'});
    
    // 1% Chance per second for a Rainbow Ball
    if(Math.random() < 0.01) {
        targets.push({x: px + c.width/2 + (Math.random()-0.5)*600, y: py + c.height/2 + (Math.random()-0.5)*600, type: 'rainbow'});
    }
}, 1000);

// AI auto firing interval
setInterval(() => {
    if (currentUsr && aiToggle.checked && menuDiv.style.display === 'none' && targets.length > 0) {
        bullets.push({x:c.width/2, y:c.height/2, r:6, vy:-8});
    }
}, 250);

function saveProgress() {
    let user = JSON.parse(localStorage.getItem('game_user_' + currentUsr));
    if (score > user.highScore) { user.highScore = score; localStorage.setItem('game_user_' + currentUsr, JSON.stringify(user)); }
}

function loop() {
    if (currentUsr && menuDiv.style.display === 'none') {
        ctx.fillStyle = 'rgba(17,17,17,0.3)'; ctx.fillRect(0, 0, c.width, c.height);
        hue = (hue + 2) % 360;

        let cx = c.width / 2, cy = c.height / 2;

        // AI Logic: Auto-steer towards the closest target
        if (aiToggle.checked && targets.length > 0) {
            let closest = null, minDist = Infinity;
            targets.forEach(t => {
                let dist = Math.hypot(t.x - px - cx, t.y - py - cy);
                if (dist < minDist) { minDist = dist; closest = t; }
            });
            if (closest) {
                // Line target vector up directly vertically to let bullets hit it
                let targetAngle = Math.atan2((closest.y - py) - cy, (closest.x - px) - cx);
                px += Math.cos(targetAngle + Math.PI/2) * 4;
                py += Math.sin(targetAngle + Math.PI/2) * 4;
            }
        } else {
            if (keys.w) py -= 5; if (keys.s) py += 5; if (keys.a) px -= 5; if (keys.d) px += 5;
        }

        // Process Bullets
        bullets.forEach((b, bi) => {
            b.y += b.vy || 0; if(b.life) b.life--;
            ctx.fillStyle = b.life ? 'rgba(0,255,200,0.4)' : '#ff0';
            ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
            if (b.y < 0 || b.life === 0) bullets.splice(bi, 1);
        });

        // Process Targets
        targets.forEach((t, ti) => {
            let sx = t.x - px, sy = t.y - py;
            let distToPlayer = Math.hypot(sx - cx, sy - cy);

            // Targets slowly track the center player crosshair
            let angleToPlayer = Math.atan2(cy - sy, cx - sx);
            t.x += Math.cos(angleToPlayer) * (t.type === 'rainbow' ? 1 : 1.5);
            t.y += Math.sin(angleToPlayer) * (t.type === 'rainbow' ? 1 : 1.5);

            // Target reaches player -> Steals score points!
            if (distToPlayer < 20) {
                targets.splice(ti, 1);
                score = Math.max(0, score - (t.type === 'rainbow' ? 50 : 10));
                saveProgress();
                return;
            }

            // Draw target
            ctx.fillStyle = t.type === 'rainbow' ? `hsl(${hue}, 100%, 60%)` : '#f55';
            ctx.beginPath(); ctx.arc(sx, sy, t.type === 'rainbow' ? 22 : 15, 0, 7); ctx.fill();
            
            // Collisions with weapons
            bullets.forEach((b, bi) => {
                if (Math.hypot(sx - b.x, sy - b.y) < (b.r + (t.type === 'rainbow' ? 22 : 15))) {
                    targets.splice(ti, 1); 
                    if(!b.life) bullets.splice(bi, 1); 
                    score += t.type === 'rainbow' ? 100 : 10;
                    saveProgress();
                }
            });
        });

        // Crosshair Layout
        ctx.fillStyle = aiToggle.checked ? '#ffaa00' : '#0fcc'; 
        ctx.beginPath(); ctx.arc(cx, cy, 8, 0, 7); ctx.fill();
        ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(cx-15, cy); ctx.lineTo(cx+15, cy); ctx.moveTo(cx, cy-15); ctx.lineTo(cx, cy+15); ctx.stroke();

        // UI Header Text
        ctx.fillStyle = '#fff'; ctx.font = '20px sans-serif';
        ctx.fillText(`Pilot: ${currentUsr} | Score: ${score} ${aiToggle.checked ? '[AI AUTOPILOT]' : ''}`, 20, 40);
        ctx.font = '14px sans-serif'; ctx.fillStyle = '#aaa';
        ctx.fillText("Press ESC to open/close menu", 20, 65);
    }
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
